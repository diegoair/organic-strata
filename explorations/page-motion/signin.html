<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · motion proposal — Organica</title>
<meta name="robots" content="noindex">
<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<script src="/shared/pattern-init.js"></script>
<link rel="stylesheet" href="/shared/auth-card.css">
<style>
  html { height: 100%; }
  body { min-height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    font-family: var(--font);
    background: var(--canvas-grid), var(--canvas-bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-6);
  }
</style>
<link rel="stylesheet" href="/shared/fvs-field.css">
</head>
<body>
  <!-- A copy of /sign-in/ (no Supabase, the buttons do nothing) + the motion layer. the same as /sign-in/. ?p=a (Arrival) | ?p=b (Rules), ?pal=<n> pin them. -->
  <div class="org-fvs-field" id="field" aria-hidden="true"></div>
  <div class="org-fvs-field__band" id="field-band" aria-hidden="true"></div>
  <div class="org-auth-card">
    <p class="org-auth-card__brand">Organica</p>
    <p class="org-auth-card__sub">Private beta — sign in to continue.</p>

    <button type="button" class="org-auth-card__google" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.2-9.8 6.2-17.4z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.4 0-11.8-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="org-auth-card__divider">or</div>

    <form id="form" onsubmit="return false">
      <label class="org-auth-card__label" for="email">Email a magic link</label>
      <input class="org-auth-card__input" type="email" id="email" name="email" placeholder="you@example.com">
      <button type="submit" class="org-auth-card__link" id="submit">Send link</button>
    </form>

    <p class="org-auth-card__msg" id="msg" role="status"></p>

    <p class="org-auth-card__legal">By continuing you agree to the
      <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
  </div>

<script src="/shared/fvs-field.js"></script>
<script>
(function () {
  var F = Organica.fvsField, q = location.search, n = F.visit('organica.signin.visit'), pals = F.palettes();
  var pin = /[?&]p=([ab])\b/.exec(q), pinPal = /[?&]pal=(\d+)/.exec(q);
  F.mount(document.getElementById('field'), {
    motion: (pin ? pin[1] === 'a' : n % 2) ? 'arrival' : 'rules', text: 'WELCOME TO\nORGANICA',
    elements: { cell: 'triangle', mark: 'circle' }, hold: false,   // circles spell the words among triangles
    band: document.getElementById('field-band'), palette: pals[(pinPal ? +pinPal[1] : n) % pals.length],
  });
})();
</script>
</body>
</html>
