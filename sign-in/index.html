<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Organica</title>
<link rel="preload" href="/shared/vendor/wix-madefor-display-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/auth-card.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    font-family: var(--font);
    background: var(--panel);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-6);
  }
</style>
</head>
<body>
  <div class="org-auth-card">
    <p class="org-auth-card__brand">Organica</p>
    <p class="org-auth-card__sub">Private beta — sign in to continue.</p>

    <button type="button" class="org-auth-card__google" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.2-9.8 6.2-17.4z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.4 0-11.8-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="org-auth-card__divider">or</div>

    <form id="form" autocomplete="on">
      <label class="org-auth-card__label" for="email">Email a magic link</label>
      <input class="org-auth-card__input" type="email" id="email" name="email" required autocomplete="username"
             placeholder="you@example.com">
      <button type="submit" class="org-auth-card__link" id="submit">Send link</button>
    </form>

    <p class="org-auth-card__msg" id="msg" role="status"></p>

    <p class="org-auth-card__legal">By continuing you agree to the
      <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
  </div>

<script src="/shared/vendor/supabase-js.min.js"></script>
<script src="/shared/core.js"></script>
<script src="/shared/supabase.js"></script>
<script src="/shared/auth.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), email = $('email'), submit = $('submit'),
      google = $('google'), msg = $('msg');

  // ?mode=signup (the header's Sign Up button): same card, request-access copy. Sign-ups are
  // invite-only during the beta, so there is no separate flow — Google / magic link is it.
  if (/[?&]mode=signup(&|$)/.test(location.search)) {
    var sub = document.querySelector('.org-auth-card__sub');
    if (sub) sub.textContent = 'Private beta — sign up with the email you were invited on.';
    document.title = 'Sign up — Organica';
  }
  function nextUrl() {
    var m = /[?&]next=([^&]+)/.exec(location.search);
    var n = m ? decodeURIComponent(m[1]) : '/';
    return (n.charAt(0) === '/' && n.charAt(1) !== '/') ? n : '/';
  }
  function setMsg(text, kind) {
    msg.textContent = text || '';
    msg.className = 'org-auth-card__msg' + (kind ? ' org-auth-card__msg--' + kind : '');
  }

  // Returning from Google (or already signed in)? detectSessionInUrl has run —
  // just forward to the tool.
  Organica.auth.session().then(function (s) { if (s) location.replace(nextUrl()); });

  google.addEventListener('click', function () {
    google.disabled = true;
    setMsg('Redirecting to Google…');
    Organica.auth.signInWithGoogle(nextUrl()).then(function (r) {
      if (r && r.error) { google.disabled = false; setMsg(r.error.message, 'err'); }
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit.disabled = true;
    setMsg('…');
    Organica.auth.signInOtp(email.value.trim()).then(function (r) {
      submit.disabled = false;
      if (r && r.error) { setMsg(r.error.message || 'Failed.', 'err'); return; }
      setMsg('Check your email for the link.', 'ok');
    });
  });
})();
</script>
</body>
</html>
