<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Organica</title>
<meta name="robots" content="noindex">
<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/page.css">
<link rel="stylesheet" href="/shared/prose.css">
<script src="/shared/pattern-init.js"></script>
</head>
<body class="org-page">
<header class="org-header" role="banner">
  <button type="button" class="org-header__nav" aria-label="All tools" aria-controls="org-mega"><menu-icon state="menu" size="20" line-cap="square"></menu-icon></button>
  <a class="org-header__logo" href="/"><span class="org-header__mark" aria-hidden="true"></span><b>Organica</b><span>/ Not found</span></a>
  <div class="org-header__spacer"></div>
</header>

<!-- The 404. Vercel serves /404.html for any address that matches no file and no rewrite.
     Public (no auth.js): a signed-out visitor with a wrong link must see this, not a sign-in.
     On the Page template (reading column + card + footer) — /design-system/#template-page. -->
<main class="org-page__col">
  <article class="org-page__card">
    <div class="org-prose">
      <p class="org-prose__caption">Error 404</p>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The link may be wrong, or the page may have moved. Every tool is one click away in the menu at the top left.</p>
    </div>
    <a class="org-btn org-btn--lg org-btn--primary mt-6" href="/">Go to the home page</a>
  </article>
  <footer class="org-page__foot">
    <span>© Organica</span>
    <nav aria-label="Legal and reference">
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/design-system/">Design System</a>
    </nav>
  </footer>
</main>
<script src="/shared/tools.js"></script>
<script src="/shared/menu-icon.js"></script>
<script src="/shared/header.js"></script>
</body>
</html>
