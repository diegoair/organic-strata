<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paper Draw Editor — prototype</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #f5f2ec; color: #0a0a0a; margin: 0; display: flex; height: 100vh; }
  #panel { width: 260px; flex-shrink: 0; padding: 16px; border-right: 1px solid #d0c8b8; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  #panel h2 { font-size: 13px; margin: 0 0 4px; }
  #panel p { font-size: 11px; color: #726a5e; line-height: 1.5; margin: 0; }
  #panel button { font-size: 11px; padding: 6px 10px; cursor: pointer; border: 1px solid #0a0a0a; background: #fff; }
  #panel button:hover { background: #eee; }
  label { font-size: 11px; display: flex; align-items: center; gap: 6px; }
  #stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; }
  #stage { border: 1px solid #d0c8b8; background: #fff; }
  textarea { width: 100%; height: 100px; font-family: ui-monospace, monospace; font-size: 9px; resize: vertical; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { font-size: 10px; color: #726a5e; }
  #segcount { font-size: 11px; }
</style>
</head>
<body>

<div id="panel">
  <h2>Paper Draw Editor — prototype</h2>
  <p>Click empty canvas to add an anchor. Drag an anchor to move it. Drag a small square handle to hand-tune a tangent (mirrored, stays smooth). Double-click an anchor to release its tangent back to auto.</p>

  <label><input type="checkbox" id="ck-smooth" checked> Smooth</label>
  <label><input type="checkbox" id="ck-closed"> Closed</label>

  <div class="row">
    <button id="btn-undo">Undo</button>
    <button id="btn-clear">Clear</button>
  </div>

  <label>Simplify tolerance: <span id="simp-val">0</span>
    <input type="range" id="rg-simplify" min="0" max="20" step="0.5" value="0" style="flex:1">
  </label>

  <div id="segcount">0 segments</div>
  <div class="hint">pathData (live):</div>
  <textarea id="out" readonly></textarea>
</div>

<div id="stage-wrap">
  <canvas id="stage" width="640" height="640"></canvas>
</div>

<script src="/shared/paper-full.min.js"></script>
<script src="/shared/organica-paper.js"></script>
<script>
  const canvas = document.getElementById('stage');
  const out = document.getElementById('out');
  const segcount = document.getElementById('segcount');

  const editor = Organica.createPaperDrawEditor(canvas, {
    strokeColor: '#0a0a0a',
    strokeWidth: 2,
    onChange: refresh
  });

  function refresh() {
    out.value = editor.getPathData();
    segcount.textContent = editor.getSegmentCount() + ' segments';
  }

  document.getElementById('ck-smooth').addEventListener('change', e => editor.setSmooth(e.target.checked));
  document.getElementById('ck-closed').addEventListener('change', e => editor.setClosed(e.target.checked));
  document.getElementById('btn-undo').addEventListener('click', () => editor.undo());
  document.getElementById('btn-clear').addEventListener('click', () => editor.clear());
  document.getElementById('rg-simplify').addEventListener('input', e => {
    document.getElementById('simp-val').textContent = e.target.value;
    editor.simplify(parseFloat(e.target.value));
  });

  refresh();
</script>
</body>
</html>
