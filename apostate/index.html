<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apostate · Organica</title>
<!-- opentype.js — read/write OTF glyph outlines in the browser -->
<script src="/shared/vendor/opentype.min.js"></script>
<link rel="preload" href="/shared/vendor/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/panel.css">
<link rel="stylesheet" href="/shared/floatbar.css">
<link rel="stylesheet" href="/shared/mobile-gate.css">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Apostate — a standalone, independent reimplementation of typoclast.com's
   font-deformation engine (Sep 2026). Built as a genuinely separate tool:
   this file shares NO code with shared/pathfx.js (Living Path/Sinew's own
   effect registry) — every one of the 27 effects below was re-derived from
   scratch by driving typoclast.com directly (same method used for the
   earlier Living Path/typoclast comparative session, repeated independently
   here per an explicit "start from zero" decision — see CLAUDE.md).
   Font loading (opentype.js) and OTF export machinery follow the SAME
   proven pattern already in livingpath/index.html — that part is generic
   font-handling plumbing, not "the filters", so re-deriving it too would
   be pure waste. See docs/UI-SHELL.md for the shared chrome contract.

   Real divergence from the standard 2-col shell: typoclast's own layout is
   3-pane (character picker · single big glyph · controls), not a canvas+
   panel pair — #app below is a local 3-column grid instead of linking
   shared/shell.css, which assumes 2 columns. Deliberate, not an oversight.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  /* --tool: an unclaimed hue — the existing accents run warm-coral
     (membrane), vermilion (radial), rose (trellis); this sits colder and
     darker, toward blood-crimson — fits the heresy/blasphemy/damnation
     framing and reads distinctly next to every neighbour in the registry. */
  --tool: #9c2b3a;
}
body { background: var(--paper); }
#app {
  display: grid;
  grid-template-columns: 210px 1fr var(--panel-w, 248px);
  height: calc(100vh - var(--header-h, 52px));
}
#charset {
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: var(--space-3);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  align-content: start;
}
#charset button {
  font-family: var(--font);
  font-size: var(--fs-small);
  border: 1px solid transparent;
  background: none;
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 6px 0;
  cursor: pointer;
}
#charset button:hover { background: var(--panel); }
#charset button.active { background: var(--ink); color: var(--paper); }
#stage {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: var(--paper);
}
#stage.drag::after {
  content: 'drop a font (.otf / .ttf)'; position: absolute; inset: 14px; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  border: 2px dashed var(--tool); border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--tool) 8%, transparent);
  font-size: var(--fs-large); letter-spacing: .06em; color: var(--ink);
}
#board { max-width: 92%; max-height: 88%; }
#board path.glyph { fill: var(--ink); }
#board path.glyph.outline-mode { fill: none; stroke: var(--ink); stroke-width: 2; }
#board .handle { fill: var(--tool); opacity: .55; }
#empty-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--mid); font-size: var(--fs-medium); text-align: center; pointer-events: none;
}
#zoom-hud {
  position: absolute; bottom: 12px; left: 12px; display: flex; gap: var(--space-2); align-items: center;
  font-size: var(--fs-small); color: var(--mid);
}
#zoom-hud button { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius-sm); width: 22px; height: 22px; cursor: pointer; }
#panel { overflow-y: auto; border-left: 1px solid var(--border); }
.fx-cat-head {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: none; border: none; padding: 0; cursor: pointer;
  font: inherit; color: var(--ink); text-transform: uppercase; letter-spacing: .06em;
  font-size: var(--fs-small); font-weight: 600; margin-bottom: var(--space-3);
}
.fx-cat-head .chev { transition: transform .15s; }
.fx-cat-head.collapsed .chev { transform: rotate(-90deg); }
.fx-cat-body.collapsed { display: none; }
.fx-cat-head .cat-tag { color: var(--tool); }
.row-btns2 { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
.griddler-sub { padding-left: var(--space-3); border-left: 2px solid var(--border); margin: var(--space-2) 0 var(--space-3); }
</style>
</head>
<body>

<header class="org-header org-header--tool" role="banner">
  <a class="org-header__logo" href="/"><b>Organica</b><span>/ Apostate</span></a>
  <div class="org-header__spacer"></div>
  <output class="org-header__status" aria-live="polite" aria-atomic="true">
    <span class="org-header__dot" id="status-dot"></span>
    <span class="org-header__state" id="status-text">Loading default face…</span>
  </output>
  <div class="org-header__actions">
    <button class="org-btn" onclick="document.getElementById('file-input').click()">upload (.otf / .ttf)</button>
    <div class="org-popover-wrap">
      <button class="org-btn" id="btn-export">export &#9662;</button>
      <div class="org-popover" id="export-popover" aria-label="Export options">
        <div class="org-popover__title">Format</div>
        <div class="org-formats">
          <button class="org-btn" onclick="exportOTF()">.otf</button>
          <button class="org-btn" onclick="exportSVG()">.svg</button>
        </div>
        <div class="org-popover__divider"></div>
        <div class="org-popover__row">
          <span class="org-popover__label">Include</span>
        </div>
        <label class="check-row"><input type="checkbox" id="ck-upper" checked><span>A–Z</span></label>
        <label class="check-row"><input type="checkbox" id="ck-lower" checked><span>a–z</span></label>
        <label class="check-row"><input type="checkbox" id="ck-digits" checked><span>0–9</span></label>
        <label class="check-row"><input type="checkbox" id="ck-punct" checked><span>punctuation</span></label>
        <div class="org-popover__divider"></div>
        <div class="org-popover__row"><span class="org-popover__label">Font name</span></div>
        <input class="panel-input panel-input--full" id="exName" value="Apostate" style="width:100%">
      </div>
    </div>
  </div>
</header>

<div id="app">

  <div id="charset"></div>

  <div id="stage">
    <div id="empty-hint">load a font to begin</div>
    <svg id="board" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" style="display:none"></svg>
    <div id="zoom-hud">
      <button onclick="zoomBy(-0.1)">&minus;</button>
      <span id="zoom-level">1.00x</span>
      <button onclick="zoomBy(0.1)">+</button>
    </div>
  </div>

  <div id="panel">
    <div class="panel-section">
      <h3>View</h3>
      <label class="check-row"><input type="checkbox" id="ck-handles" checked onchange="render()"><span>show handles</span></label>
      <label class="check-row"><input type="checkbox" id="ck-outline" onchange="render()"><span>outline</span></label>
      <div class="row-btns2">
        <button class="mini-btn" onclick="randomizeAll()">randomize</button>
        <button class="mini-btn" onclick="resetAll()">reset all</button>
      </div>
    </div>

    <div class="panel-section">
      <button class="fx-cat-head" onclick="toggleCat(this)"><span>Mild heresy</span><span class="chev">&#9660;</span></button>
      <div class="fx-cat-body" id="cat-mild"></div>
    </div>

    <div class="panel-section">
      <button class="fx-cat-head" onclick="toggleCat(this)"><span>Total blasphemy</span><span class="chev">&#9660;</span></button>
      <div class="fx-cat-body" id="cat-blasphemy"></div>
    </div>

    <div class="panel-section">
      <button class="fx-cat-head" onclick="toggleCat(this)"><span>Eternal damnation</span><span class="chev">&#9660;</span></button>
      <div class="fx-cat-body" id="cat-damnation"></div>
    </div>

    <div class="panel-section">
      <button class="fx-cat-head" onclick="toggleCat(this)"><span>Texture (extra)</span><span class="chev">&#9660;</span></button>
      <div class="fx-cat-body" id="cat-texture"></div>
    </div>
  </div>

</div>

<input type="file" id="file-input" class="org-file-input" accept=".otf,.ttf" onchange="onFilePicked(this)">
<div class="mobile-gate"><p>Organica is designed for desktop. Please open this link on a laptop or desktop browser for the full experience.</p></div>

<script src="/shared/core.js"></script>

<script>
'use strict';
function $(id){ return document.getElementById(id); }
const setStatus = Organica.status();

/* ============================================================
   GEOMETRY — small, local, generic. Not effects — flatten/serialize
   helpers any point-space tool needs; kept local so this file has zero
   dependency on shared/pathfx.js, per the "from scratch" decision.
   ============================================================ */
function cubicPts(p0,p1,p2,p3,n){
  const out=[];
  for(let i=1;i<=n;i++){ const t=i/n,u=1-t;
    out.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
              y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}); }
  return out;
}
function quadPts(p0,p1,p2,n){
  const out=[];
  for(let i=1;i<=n;i++){ const t=i/n,u=1-t;
    out.push({x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y}); }
  return out;
}
function bboxOf(subs){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const s of subs) for(const p of s.pts){
    if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y;
  }
  if(minX>maxX){ minX=minY=0; maxX=maxY=1; }
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY};
}
// evenly resample a closed/open polyline at ~step spacing — pixelate needs
// this: a low-point-count glyph (Archivo Black's "A" has only 8 outer
// anchors) quantized straight off its existing sparse points collapses
// into a crude blob that loses the letterform, since there's nothing
// between two far-apart corners to trace the true edge through the grid.
function resamplePolyline(pts, closed, step){
  const n=pts.length; if(n<2) return pts.slice();
  const segs=closed?n:n-1, out=[];
  for(let i=0;i<segs;i++){
    const a=pts[i], b=pts[(i+1)%n];
    const segLen=Math.hypot(b.x-a.x,b.y-a.y);
    const steps=Math.max(1, Math.round(segLen/step));
    for(let k=0;k<steps;k++){ const t=k/steps; out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
  }
  if(!closed) out.push(pts[n-1]);
  return out;
}
// walks the polyline's TOTAL cumulative arc length and places points evenly
// at ~step apart, independent of the original point count — unlike
// resamplePolyline above (which guarantees at least one point per ORIGINAL
// segment, so it can only ever add density, never merge several original
// segments into fewer/longer ones). `bubbles` needs the latter: a dense
// contour like "O" (64 original points, mostly from bezier-flattening) has
// to be able to consolidate down to just a handful of long segments when
// bubble size is large, so the slider keeps working past the original point
// spacing instead of silently capping out.
function resampleArcLength(pts, closed, step){
  const n=pts.length; if(n<2) return pts.slice();
  const segs=closed?n:n-1;
  const cum=[0];
  for(let i=0;i<segs;i++){
    const a=pts[i], b=pts[(i+1)%n];
    cum.push(cum[i]+Math.hypot(b.x-a.x,b.y-a.y));
  }
  const total=cum[segs]; if(total<=0) return pts.slice();
  const count=Math.max(closed?3:2, Math.round(total/step)+(closed?0:1));
  const denom=closed?count:count-1;
  const out=[];
  for(let k=0;k<count;k++){
    const dist=(k/denom)*total;
    let i=0; while(i<segs-1 && cum[i+1]<dist) i++;
    const a=pts[i], b=pts[(i+1)%n];
    const segLen=(cum[i+1]-cum[i])||1;
    const t=(dist-cum[i])/segLen;
    out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
  }
  return out;
}
// Straight-line re-emission, NOT Catmull-Rom — found by a side-by-side
// bake-off against typoclast at IDENTITY (no effect active at all): a real,
// straight corner (the top peak of Archivo Black's "A", its leg corners —
// built from plain 'L' commands, no curve data) came back visibly rounded,
// because an unconditional Catmull-Rom smooths every point uniformly with
// no notion of "this one was actually sharp." Source curves are already
// flattened densely (FL=8 samples/Bézier in fromOTCommands), so plain
// straight segments between points still read as smooth curves while
// leaving every genuine corner exactly as sharp as the source glyph —
// confirmed by re-comparing the identity "A" pixel-for-pixel after this fix.
// evenodd is the default rule everywhere in this file (needed so a hole/
// counter subpath punches a real hole — see the header comment above), but
// it's also exactly what turns a SELF-intersecting single subpath into an
// alternating hole instead of a solid merge: `bubbles` at a large size can
// make two neighbouring bumps' circles cross each other, and evenodd reads
// that crossing as a tiny "leaf" cut into the ink (Diego's own screenshot).
// `echo` deliberately relies on evenodd's alternating behaviour for its own
// nested-ring look (see its case comment) — everywhere else, nonzero is the
// more correct choice: a hole subpath (always wound OPPOSITE to its outer
// contour, confirmed empirically) still punches a clean hole under nonzero
// exactly like it does under evenodd, but same-winding overlaps (bubbles
// crossing themselves) now union into solid black instead of alternating —
// literally "merge them and fill with black", Diego's own framing.
function currentFillRule(){ return STATE.echo ? 'evenodd' : 'nonzero'; }
function dFromSubs(subs){
  let d='';
  for(const s of subs){
    const p=s.pts, n=p.length; if(n<2) continue;
    d+=`M${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
    const segs=s.closed?n:n-1;
    for(let i=1;i<=segs;i++) d+=`L${p[i%n].x.toFixed(1)} ${p[i%n].y.toFixed(1)}`;
    if(s.closed) d+='Z';
  }
  return d;
}
// opentype path commands -> subpaths (font-specific, stays local)
function fromOTCommands(cmds){
  const subs=[]; let cur=null,start=null,p=null; const FL=8;
  for(const c of cmds){
    if(c.type==='M'){ if(cur&&cur.pts.length)subs.push(cur); cur={closed:false,pts:[{x:c.x,y:c.y}]}; start={x:c.x,y:c.y}; p={x:c.x,y:c.y}; }
    else if(c.type==='L'){ cur.pts.push({x:c.x,y:c.y}); p={x:c.x,y:c.y}; }
    else if(c.type==='C'){ cubicPts(p,{x:c.x1,y:c.y1},{x:c.x2,y:c.y2},{x:c.x,y:c.y},FL).forEach(q=>cur.pts.push(q)); p={x:c.x,y:c.y}; }
    else if(c.type==='Q'){ quadPts(p,{x:c.x1,y:c.y1},{x:c.x,y:c.y},FL).forEach(q=>cur.pts.push(q)); p={x:c.x,y:c.y}; }
    else if(c.type==='Z'){ if(cur){cur.closed=true; subs.push(cur); cur=null;} p=start; }
  }
  if(cur&&cur.pts.length){ cur.closed=true; subs.push(cur); }   // a font contour is always a closed loop, even if the source omitted the trailing Z
  // drop a coincident first/last point (the path closing back onto its own
  // start) — left in, it duplicates an anchor right where dFromSubs' closed-
  // loop Catmull-Rom wraps around, spiking the tangent at that one seam
  for(const s of subs){
    if(s.pts.length>2){
      const a=s.pts[0], b=s.pts[s.pts.length-1];
      if(Math.hypot(a.x-b.x,a.y-b.y)<0.01) s.pts.pop();
    }
  }
  // drop zero-length duplicate consecutive points (a genuine, common font
  // quirk: an "L" command that lands on the exact point already reached by
  // the previous curve — harmless on its own, but confuses the false-corner
  // bridge below)
  for(const s of subs){
    s.pts = s.pts.filter((p,i)=>{
      const prev = s.pts[i===0 ? s.pts.length-1 : i-1];
      return Math.hypot(p.x-prev.x, p.y-prev.y) > 0.01;
    });
  }
  // bridge "false corners": some fonts split an otherwise-smooth, tangent-
  // continuous curve into two curve runs joined by a short straight "L"
  // bridge (seen live in Archivo Black's own "O": …Q Q L L Q Q… right at the
  // counter's equator). dFromSubs draws literal straight chords between
  // points with nothing in between, so a real corner (large direction
  // change, e.g. "A"'s vertices) stays sharp — but this bridge has almost NO
  // direction change (it's not a real corner) and is far longer than the
  // curve's own typical sample spacing, so it renders as a visible flat
  // notch instead of the smooth curve it's actually part of. Detect that
  // exact shape (long segment, small turn angle at both ends relative to
  // the subpath's own median spacing) and re-curve it with a Catmull-Rom
  // fill using the flanking points as tangent references — real corners
  // (large turn angle) are untouched, so "A"'s vertices etc. stay sharp.
  for(const s of subs){
    const pts = s.pts, n = pts.length;
    if(!s.closed || n<6) continue;
    const segLens = pts.map((p,i)=>Math.hypot(pts[(i+1)%n].x-p.x, pts[(i+1)%n].y-p.y));
    const sorted = [...segLens].sort((a,b)=>a-b);
    const median = sorted[Math.floor(n/2)] || 1;
    function turnAngle(i){
      const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n];
      const v1x=p1.x-p0.x, v1y=p1.y-p0.y, v2x=p2.x-p1.x, v2y=p2.y-p1.y;
      const l1=Math.hypot(v1x,v1y)||1e-6, l2=Math.hypot(v2x,v2y)||1e-6;
      const dot=Math.max(-1,Math.min(1,(v1x*v2x+v1y*v2y)/(l1*l2)));
      return Math.acos(dot)*180/Math.PI;
    }
    const out=[];
    for(let i=0;i<n;i++){
      out.push(pts[i]);
      const j=(i+1)%n, segLen=segLens[i];
      if(segLen>median*2.5 && segLen>20 && turnAngle(i)<18 && turnAngle(j)<18){
        const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[j], p3=pts[(j+1)%n];
        for(let step=1; step<4; step++){
          const t=step/4, t2=t*t, t3=t2*t;
          out.push({
            x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
            y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
          });
        }
      }
    }
    s.pts = out;
  }
  return subs;
}
// normalise into a 1000-box, y-down, centred — effect params only mean the
// same thing at a fixed scale, same convention as Living Path's normGlyph
function normGlyph(subs){
  const bb=bboxOf(subs), pad=120, span=1000-pad*2;
  const k=span/Math.max(bb.w, bb.h||1);
  const ox=500-(bb.minX+bb.w/2)*k, oy=500-(bb.minY+bb.h/2)*k;
  const norm=subs.map(s=>({closed:s.closed, pts:s.pts.map(p=>({x:p.x*k+ox, y:1000-(p.y*k+oy)}))}));
  return {norm,k,ox,oy};
}
function denormGlyph(subs,k,ox,oy){
  return subs.map(s=>({closed:s.closed, pts:s.pts.map(p=>({x:(p.x-ox)/k, y:((1000-p.y)-oy)/k}))}));
}
// tiny local coherent noise — a hash + smoothstep, NOT Organica.noise
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function smoothNoise2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y), xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function mulberry32(a){ return function(){ let t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
// real-corner detection — genuine direction-change, not every Nth point
function findCorners(pts, angleDeg){
  const n=pts.length, cornerCos=Math.cos(angleDeg*Math.PI/180), out=[];
  for(let i=0;i<n;i++){
    const a=pts[(i-1+n)%n], b=pts[i], c=pts[(i+1)%n];
    const d1x=b.x-a.x, d1y=b.y-a.y, L1=Math.hypot(d1x,d1y)||1;
    const d2x=c.x-b.x, d2y=c.y-b.y, L2=Math.hypot(d2x,d2y)||1;
    const dot=(d1x/L1)*(d2x/L2)+(d1y/L1)*(d2y/L2);
    if(dot<cornerCos) out.push(i);
  }
  return out;
}

/* ============================================================
   THE 27-SLIDER PIPELINE — independently re-derived from typoclast.com
   (this session — live slider manipulation on the real site, isolating
   each parameter). Fixed order, fixed slots — no add/remove/reorder,
   matching typoclast's own architecture (not Living Path's layer stack).
   Ranges below are the EXACT min/max read off typoclast's live
   input[type=range] elements.
   ============================================================ */
const FX = [
  // ── mild heresy — one combined affine, applied first ──
  {key:'rotate',    cat:'mild', label:'rotate',    min:-360, max:360, step:1,    def:0,   unit:'°'},
  {key:'slant',     cat:'mild', label:'slant',     min:-15,  max:15,  step:1,    def:0,   unit:'°'},
  {key:'stretchX',  cat:'mild', label:'stretch x', min:0.1,  max:3,   step:0.01, def:1,   unit:''},

// r' = r*(1 + amp*cos(lobes*theta + phase)) around a shared centre — the
// angular-harmonic family confirmed live for bulge/wave/ripple/inflate.
function angularHarmonic(subs, cx, cy, lobes, amp, phaseDeg){

    const dx=p.x-cx, dy=p.y-cy, th=Math.atan2(dy,dx);
    const f=1+amp*Math.cos(lobes*th+phase);

// superellipse "squareify" — blends each point's radius (in bbox-normalised
// space) toward the Chebyshev/superellipse radius for its own angle. Shared
// family for pull (soft, low exponent) and crush (hard, high exponent) —
// confirmed live both circularise into a rounded-square/stadium shape, not
// a directional drag or a simple vertical squash.
function squareify(subs, cx, cy, amt, nExp){
  // each subpath squareifies toward ITS OWN bbox-half-extent, sharing only
  // the glyph's centre — normalising every subpath by the OUTER contour's
  // extent (the first version) pulled the small inner counter out toward
  // the same absolute radius as the outer ring, ballooning it until it
  // nearly swallowed the ring gap. Per-subpath extent keeps outer/inner at
  // their own relative scale, the way typoclast's own crush/pull visibly
  // do (a clear black ring survives at max crush, not a near-solid square).
  return subs.map(s=>{
    const sb=bboxOf([s]), hx=sb.w/2||1, hy=sb.h/2||1;
    return {closed:s.closed, pts:s.pts.map(p=>{
      const u=(p.x-cx)/hx, v=(p.y-cy)/hy;
      const au=Math.abs(u)||1e-6, av=Math.abs(v)||1e-6;
      const r=Math.hypot(u,v)||1e-6;
      const cheb=1/Math.pow(Math.pow(au,nExp)+Math.pow(av,nExp), 1/nExp);
      const newR=r+(cheb-r)*amt, k=newR/r;
      return {x:cx+u*hx*k, y:cy+v*hy*k};

// bubbles — resample a subpath at ~BUBBLE.size spacing, then replace each
// resampled segment with a TRUE semicircle (centre = segment midpoint,
// radius = half the segment length — mathematically exact, sampled at K
// points, not a bezier approximation). rawAmt's SIGN picks which of the two
// possible arc sides to sweep (outward reference vs its mirror = inward),
// its magnitude blends between the untouched chord (0) and the full
// semicircle (1) so partial values still make sense while ±100 always gives
// a "perfect" round bulge — exactly what was asked for.
// circumradius of the triangle a-b-c — the standard discrete estimate of
// the base path's own local radius of curvature at b. Large (or Infinity,
// clamped) on a near-straight run; small on a tight curl.
function circumradius(a,b,c){
  const ab=Math.hypot(b.x-a.x,b.y-a.y), bc=Math.hypot(c.x-b.x,c.y-b.y), ca=Math.hypot(a.x-c.x,a.y-c.y);
  const sp=(ab+bc+ca)/2;
  const area=Math.sqrt(Math.max(0, sp*(sp-ab)*(sp-bc)*(sp-ca)));
  if(area<1e-6) return 1e6;
  return (ab*bc*ca)/(4*area);
}
function bubbleSubpath(s, rawAmt, amt, size){
  const n = s.pts.length; if(n<2) return s;
  const rp = resampleArcLength(s.pts, s.closed, size);
  const m = rp.length; if(m<2) return s;
  // outward reference via the subpath's own WINDING (shoelace signed area),
  // not "away from this subpath's bbox centre" — the bbox-centre heuristic
  // (used in the first version) breaks down on a tight CONCAVE curve, e.g.
  // "J"'s hook: a point on that curl can sit close to (or past) the bbox
  // centre, so "away from centre" stops meaning "away from the glyph" and
  // flips sign mid-curve, producing a tangled, self-intersecting mess right
  // at the hook instead of a clean scallop (confirmed live, Diego's own
  // screenshot). A single winding-derived sign per subpath is correct at
  // EVERY point along the contour, convex or concave alike, as long as the
  // subpath itself doesn't self-intersect — confirmed empirically: every
  // outer contour in this font has positive signed area, every counter/hole
  // negative, consistently, so this also preserves the already-verified
  // outer-vs-hole behaviour (pushes a hole into its own open space) without
  // needing bbox math at all.
  let area2=0; const rawSegs = s.closed ? n : n-1;
  for(let i=0;i<rawSegs;i++){ const a=s.pts[i], b=s.pts[(i+1)%n]; area2 += a.x*b.y - b.x*a.y; }
  const windingSign = area2>=0 ? 1 : -1;
  const segs = s.closed ? m : m-1;

  // Pass 1 — per segment: base radius, and a raw safety factor comparing
  // that radius to the base path's own LOCAL curvature radius at each of
  // the segment's two endpoints (circumradius of the point + its two
  // neighbours). A fixed turn-ANGLE threshold (the first version of this
  // fix) ignored bubble size entirely — the same gentle curve that's
  // harmless at a small bubble size becomes overlap-prone at a large one,
  // and the angle cutoff either didn't fire (still overlapping) or fired
  // too hard on curves that never risked overlapping at all, flattening
  // bumps into sharp horn-like cusps right next to untouched full ones
  // (Diego's own screenshot). Comparing radius to the ACTUAL local
  // curvature only kicks in when the bump truly would outrun the curve.
  const radii=[], rawSafety=[];
  for(let i=0;i<segs;i++){
    const A=rp[i], B=rp[(i+1)%m];
    const r=Math.hypot(B.x-A.x,B.y-A.y)/2;
    radii.push(r);
    const prevPt = s.closed ? rp[(i-1+m)%m] : (i>0 ? rp[i-1] : A);
    const nextPt = s.closed ? rp[(i+2)%m] : (i<segs-1 ? rp[i+2] : B);
    const localCurv = Math.min(circumradius(prevPt,A,B), circumradius(A,B,nextPt));
    rawSafety.push(Math.max(0.35, Math.min(1, localCurv/((r||1)*1.3))));
  }
  // Pass 2 — smooth the safety factor across immediate neighbours (a light
  // 3-tap average) so a clamped bump blends gradually into a full one
  // instead of meeting it at a hard seam — that abrupt jump is exactly
  // what read as a pointed "horn" where a flattened segment sat right next
  // to an untouched one.
  const safety = rawSafety.map((v,i)=>{
    const p = s.closed ? rawSafety[(i-1+segs)%segs] : rawSafety[Math.max(0,i-1)];
    const nx = s.closed ? rawSafety[(i+1)%segs] : rawSafety[Math.min(segs-1,i+1)];
    return (p + v*2 + nx)/4;
  });

  const out = [];
  for(let i=0;i<segs;i++){
    const A=rp[i], B=rp[(i+1)%m];
    out.push(A);
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const radius=radii[i];
    const theta0=Math.atan2(A.y-my, A.x-mx);
    const dirSign = windingSign * (rawAmt<0 ? -1 : 1);
    // sample count PER SEGMENT, not a fixed constant: a fixed K faceted
    // visibly at large bubble sizes (radius grows with BUBBLE.size, so the
    // same K covers a much longer arc — Diego's own report, "sono segmenti
    // non curve"). Smooth mode scales K with the arc's own radius so every
    // straight sub-chord stays short (~8 units) regardless of bubble size —
    // reads as a genuine curve at any zoom. Faceted mode keeps a small fixed
    // K instead, for a deliberate low-poly/cut-gem look — both variants use
    // the exact same underlying true-semicircle geometry, only the sampling
    // density differs.
    const K = BUBBLE.faceted ? 5 : Math.max(10, Math.min(48, Math.round(radius*Math.PI/8)));
    const localAmt = amt*safety[i];
    for(let k=1;k<K;k++){
      const t=k/K;
      const phi=theta0+dirSign*Math.PI*t;
      const arcX=mx+radius*Math.cos(phi), arcY=my+radius*Math.sin(phi);
      const chX=A.x+(B.x-A.x)*t, chY=A.y+(B.y-A.y)*t;
      out.push({x: chX+(arcX-chX)*localAmt, y: chY+(arcY-chY)*localAmt});
    }
  }
  if(!s.closed) out.push(rp[m-1]);
  return {closed:s.closed, pts: out};
}

function applyTransform(subs){
  const {rotate,slant,stretchX,stretchY}=STATE;
  if(!rotate && !slant && stretchX===1 && stretchY===1) return subs;
  const bb=bboxOf(subs), cx=bb.minX+bb.w/2, cy=bb.minY+bb.h/2;
  const a=rotate*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a), sh=Math.tan(slant*Math.PI/180);

    x=x+y*sh;
    return {x:cx+x*ca-y*sa, y:cy+x*sa+y*ca};
  })}));
}

function applyEffect(key, subs){

      // 3/5/7-harmonic sum read as a bumpy multi-lobed "flower" next to
      // typoclast's own single clean asymmetric lean — dropped to one
      // dominant low harmonic (n=1) plus a much weaker n=2 term, so the
      // dominant character is one smooth lean/offset, not several lobes.

        const dx=p.x-cx, dy=p.y-cy, th=Math.atan2(dy,dx);

    case 'pinch': {
      // a radial power-law, not an angular bump: confirmed live the INNER
      // counter crushes toward a point while the OUTER contour barely
      // moves. The power law alone (r/R)^power isn't enough to keep the
      // outer contour fixed, though: R is a single scalar (half the glyph's
      // bbox), which only equals a round contour's TRUE per-point radius at
      // the bbox's own extremes — everywhere else (e.g. 45° on a circle,
      // r≈0.71R) the same high power exaggerates that gap into a lumpy,
      // scalloped outer boundary instead of leaving it be (caught live:
      // typoclast's outer ring stays a clean circle under pinch, Apostate's
      // was turning into a bumpy octagon). Fixed by only pinching the
      // smaller subpath(s) — the counter(s)/holes — toward the glyph's own
      // centre, and leaving the largest-area subpath (the outer contour)
      // untouched, matching the live reference.
      const amt=v/100;
      const areas = subs.map(s=>{ const b=bboxOf([s]); return b.w*b.h; });

          const dx=p.x-cx, dy=p.y-cy, r=Math.hypot(dx,dy)||0.001;

        const total = segLen.reduce((a,b)=>a+b,0) || 1;

        const t = s.pts.map((p,i)=>{ const tt=acc/total; acc+=segLen[i]; return tt; });
        return {closed:s.closed, pts: s.pts.map((p,i)=>{
          const a=s.pts[(i-1+n)%n], b=s.pts[(i+1)%n];
          let dx=b.x-a.x, dy=b.y-a.y; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
          const off = Math.sin(t[i]*WOBBLE.freq*Math.PI*2 + ph) * amt;
          return {x:p.x - dy*off, y:p.y + dx*off};
        })};
      });
    }
    case 'scatter': {
      // per-subpath explode — each contour drifts outward from the glyph's
      // own centre by its own random amount, fragmenting multi-contour
      // glyphs (e.g. "R"'s bowl vs stem, "A"'s counter vs outer ring).
      const amt = v;
      const r = mulberry32(SCATTER.seed);
      return subs.map(s=>{
        const ox=(r()*2-1), oy=(r()*2-1);
        return {closed:s.closed, pts: s.pts.map(p=>{
          let dx=p.x-cx, dy=p.y-cy, L=Math.hypot(dx,dy)||1;
          return {x:p.x + dx/L*amt*Math.abs(ox), y:p.y + dy/L*amt*Math.abs(oy)};
        })};
      });
    }
    case 'bubbles': {
      // outer contour only — the subpath with the largest bbox area, same
      // classification pinch/refraction/flip/crush already use to tell the
      // outer ring apart from a counter/hole. BUBBLE.allOuter overrides this
      // to treat EVERY subpath as outer (a single-contour letter like "J"/
      // "L" already gets this for free, since its lone subpath is always
      // its own max area — the override matters for a multi-subpath glyph
      // where the smaller piece isn't a real hole).
      const areas = subs.map(s=>{ const b=bboxOf([s]); return b.w*b.h; });
      const maxArea = Math.max(...areas);
      const rawAmt=v/100, amt=Math.abs(rawAmt);
      return subs.map((s,i)=> (BUBBLE.allOuter || areas[i]===maxArea) ? bubbleSubpath(s,rawAmt,amt,BUBBLE.size) : s);
    }
    case 'bubblesInner': {
      // every subpath EXCEPT the largest — counters/holes (the triangle of
      // "A", the ring of "O", both bowls of "8") — bulges independently of
      // whatever `bubbles` (outer) is doing, with its own size sub-param.
      // Inert whenever BUBBLE.allOuter is on (outer already claims everything).
      if(BUBBLE.allOuter) return subs;
      const areas = subs.map(s=>{ const b=bboxOf([s]); return b.w*b.h; });
      const maxArea = Math.max(...areas);
      const rawAmt=v/100, amt=Math.abs(rawAmt);
      return subs.map((s,i)=> areas[i]!==maxArea ? bubbleSubpath(s,rawAmt,amt,BUBBLE.sizeInner) : s);
    }
    default: return subs;
  }
}
function applyPipeline(rawSubs){
  const {norm,k,ox,oy} = normGlyph(rawSubs);
  let s = applyTransform(norm);
  for(const f of FX){ if(f.cat==='blasphemy') s = applyEffect(f.key, s); }
  for(const f of FX){ if(f.cat==='damnation') s = applyEffect(f.key, s); }
  for(const f of FX){ if(f.cat==='texture') s = applyEffect(f.key, s); }
  return {subs:s, k, ox, oy};
}

/* ============================================================
   FONT / GLYPH
   ============================================================ */
let FONT=null, CHARSET=[], SELECTED='A';
function loadFontBuffer(buf, name){
  let font; try{ font=opentype.parse(buf); }catch(e){ setStatus('','✗ could not parse font'); return; }
  FONT=font;
  CHARSET=[];
  for(let i=0;i<font.glyphs.length;i++){
    const g=font.glyphs.get(i);
    if(g.unicode && g.unicode>32 && g.unicode<0x250) CHARSET.push(g.unicode);
  }
  CHARSET=[...new Set(CHARSET)].sort((a,b)=>a-b);
  if(!CHARSET.includes(SELECTED.codePointAt(0))) SELECTED=String.fromCodePoint(CHARSET[0]||65);
  renderCharset();
  $('board').style.display='';
  $('empty-hint').style.display='none';
  setStatus('','font loaded: '+(name||'custom'));
  render();
}
function renderCharset(){
  const host=$('charset'); host.innerHTML='';
  CHARSET.forEach(u=>{
    const ch=String.fromCodePoint(u);
    const b=document.createElement('button');
    b.textContent=ch; b.className = ch===SELECTED?'active':'';
    b.onclick=()=>{ SELECTED=ch; renderCharset(); render(); };
    host.appendChild(b);
  });
}

/* ============================================================
   RENDER — the single source of truth for preview and export
   ============================================================ */
let zoom=1;
function render(){
  if(!FONT) return;
  const gl = FONT.charToGlyph(SELECTED);
  const raw = fromOTCommands((gl.path&&gl.path.commands)||[]);
  if(!raw.length){ $('board').innerHTML=''; return; }
  const {subs} = applyPipeline(raw);
  const board=$('board');
  board.setAttribute('viewBox', `0 0 1000 1000`);
  const outlineOn = $('ck-outline').checked;
  let markup = `<path class="glyph${outlineOn?' outline-mode':''}" fill-rule="${currentFillRule()}" d="${dFromSubs(subs)}"/>`;
  if($('ck-handles').checked){
    subs.forEach(s=>s.pts.forEach((p,i)=>{
      if(i% Math.max(1,Math.round(s.pts.length/28)) !== 0) return;
      markup += `<circle class="handle" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9"/>`;
    }));
  }
  board.innerHTML = markup;
  board.style.transform = `scale(${zoom})`;
}
function zoomBy(d){ zoom=Math.max(0.2, Math.min(4, +(zoom+d).toFixed(2))); $('zoom-level').textContent=zoom.toFixed(2)+'x'; render(); }

function rdpOpen(pts,eps){

    let maxd=-1, idx=-1;
    for(let i=a+1;i<b;i++){ const d=Math.abs((pts[i].x-ax)*dy-(pts[i].y-ay)*dx)/len; if(d>maxd){maxd=d;idx=i;} }
    if(maxd>eps && idx>0){ keep[idx]=1; stack.push([a,idx],[idx,b]); }
  }
  const out=[]; for(let i=0;i<n;i++) if(keep[i]) out.push(pts[i]);

function rdpClosed(pts,eps){
  const n=pts.length; if(n<=5) return pts.slice();

  for(let i=1;i<n;i++){ const d=(pts[i].x-pts[0].x)**2+(pts[i].y-pts[0].y)**2; if(d>fd){fd=d;far=i;} }

    manufacturer:'Organica / Apostate', version:'Version 1.0',
    description:'A vector-deformed typeface made in Apostate — an independent, Organica-native reimplementation of typoclast.com\'s effect list.',
    license:'All rights reserved.'});
  const buf=font.toArrayBuffer();
  Organica.download(new Blob([buf],{type:'font/otf'}), name.replace(/\s+/g,'-')+'.otf');
  setStatus('','✓ exported .otf');
}
function exportSVG(){
  if(!FONT){ setStatus('','✗ load a font first'); return; }
  const gl=FONT.charToGlyph(SELECTED);
  const raw=fromOTCommands((gl.path&&gl.path.commands)||[]);
  const {subs}=applyPipeline(raw);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><path fill="#0a0a0a" fill-rule="${currentFillRule()}" d="${dFromSubs(subs)}"/></svg>`;
  Organica.download(new Blob([svg],{type:'image/svg+xml'}), 'apostate-'+SELECTED+'.svg');
}

/* ============================================================
   INIT — auto-load a default face (Living Path's own convention: never
   show an empty state), font drag/drop anywhere on the page
   ============================================================ */
function onFilePicked(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>loadFontBuffer(reader.result, file.name.replace(/\.(otf|ttf)$/i,''));
  reader.readAsArrayBuffer(file);
}
window.addEventListener('dragover', e=>{ e.preventDefault(); $('stage').classList.add('drag'); });
window.addEventListener('dragleave', ()=>{ $('stage').classList.remove('drag'); });
window.addEventListener('drop', e=>{
  e.preventDefault(); $('stage').classList.remove('drag');
  const file=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>loadFontBuffer(reader.result, file.name.replace(/\.(otf|ttf)$/i,''));
  reader.readAsArrayBuffer(file);
});

Organica.popover($('btn-export'), $('export-popover'));
buildPanel();
syncBubbleInnerDisabled();
fetch('/shared/vendor/archivo-black.ttf').then(r=>r.arrayBuffer()).then(buf=>loadFontBuffer(buf,'Archivo Black'))
  .catch(()=>setStatus('','drop a font to begin'));
</script>
</body>
</html>
