<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spore — Organica</title>
<link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/header.css">
  <link rel="stylesheet" href="/shared/panel.css">
  <link rel="stylesheet" href="/shared/floatbar.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="stylesheet" href="/shared/palette.css">
  <style>
  :root {
    --tool: #5a7a96;   /* header focus ring */
    --active: #1a1a1a;
  }

  /* Reset, body, #app, #canvas-wrap, #drop-hint, .drop-icon, #zoom-hud, the
     .org-stage base and .panel-section all come from the shared sheets.
     Spore's own deltas: */
  #canvas-wrap { padding: 0; }        /* canvas reaches the letterbox edge */
  #main-canvas:not(.visible) { display: none; }
  #main-canvas { box-shadow: 0 4px 40px rgba(0,0,0,0.12); }   /* lighter than the shared stage */

  /* Color inputs */

  /* input[type=color] hider now in shared/panel.css */

  /* Mark library */
  #mark-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-1);
    margin-bottom: var(--space-4);
  }

  .mark-thumb {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--panel);
    transition: border-color 0.12s, background 0.12s;
    padding: var(--space-1);
    position: relative;
    overflow: hidden;
  }

  .mark-thumb:hover { border-color: var(--accent); }
  .mark-thumb.selected { border-color: var(--ink); background: #e8e4dc; }
  .mark-thumb .thumb-num {
    position: absolute; top: 1px; right: 2px;
    font-size: var(--fs-micro); line-height: 1; color: var(--mid); pointer-events: none;
  }

  .mark-thumb svg, .mark-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .mark-name {
    font-size: var(--fs-micro);
    letter-spacing: 0.04em;
    color: var(--mid);
    text-align: center;
    margin-top: var(--space-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mark-item { display: flex; flex-direction: column; }

  /* 400% symbol preview (aligned with Pollen) */
  .preview-wrap { display: flex; justify-content: center; margin-bottom: var(--space-5); }
  #symbol-preview {
    width: 100%; max-width: 208px; aspect-ratio: 1;
    border: 1px solid rgba(10,10,10,0.2); background: var(--panel); display: block;
  }

  /* .upload-btn base is in panel.css; Spore's delta (same as Pollen's): */
  .upload-btn { font-size: var(--fs-micro); letter-spacing: 0.1em; }

  /* Color mode */
  .color-mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-1);
  }

  /* RMX chip CSS now in shared/palette.css. Spore's strip has no bottom gap. */
  #rmx-palette { --rmx-palette-mb: 0; }
  #sel-rmx-map { font-family: var(--font); font-size: var(--fs-small); background: var(--panel); border: 1px solid var(--border); color: var(--ink); padding: var(--space-1) var(--space-2); accent-color: var(--ink); }

  .cm-btn {
    font-family: var(--font);
    font-size: var(--fs-micro);
    letter-spacing: 0.06em;
    padding: var(--space-2) 0;
    border: 1px solid var(--border);
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }

  .cm-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Progress bar */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--ink);
    width: 0%;
    transition: width 0.1s;
    pointer-events: none;
  }


  /* scrollbar */

  /* hidden file inputs use the shared .org-file-input class now */

  /* ── ON-CANVAS COMPUTE CONTROLS ── */
  /* #compute-bar + .hud-btn are in shell.css now. */
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="org-header org-header--tool" role="banner">
  <a class="org-header__logo" href="/"><b>Organica</b><span>/ Spore</span></a>

  <div class="org-header__spacer"></div>

  <output class="org-header__status" aria-live="polite" aria-atomic="true">
    <span class="org-header__dot" id="status-dot"></span>
    <span class="org-header__state" id="status-text">Drop an image to begin</span>
  </output>

</header>

<input type="file" id="file-input" class="org-file-input" accept="image/*" onchange="loadImage(this)">
<input type="file" id="mark-upload-input" class="org-file-input" accept=".svg,image/svg+xml" onchange="uploadMark(this)">

<!-- FLOATING TOOLBAR — Open / Export / Figma, fixed bottom-centre over the canvas -->
<div class="org-floatbar" role="toolbar" aria-label="Actions">
  <button class="org-floatbar__btn" aria-label="Open image" onclick="document.getElementById('file-input').click()">
    <svg class="ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 4A1 1 0 0 1 2.5 3h2.8l1 1.3H13.5a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </button>

  <div class="org-floatbar__sep"></div>

  <div class="org-popover-wrap">
    <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-export" disabled aria-label="Export">
      <svg class="ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v7.2M5.3 6.7 8 9.4l2.7-2.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg class="chev" viewBox="0 0 8 5" fill="none" aria-hidden="true"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="org-popover" id="export-popover" aria-label="Export options">
      <div class="org-popover__title">Format</div>
      <div class="org-formats">
        <button class="org-btn" id="btn-save-png" onclick="exportPNG()">PNG</button>
        <button class="org-btn" id="btn-save-jpg" onclick="exportJPG()">JPG</button>
        <button class="org-btn" id="btn-save-svg" onclick="exportSVG()">SVG</button>
      </div>

      <div class="org-popover__divider"></div>

      <div class="org-popover__row">
        <label class="org-popover__label" for="sel-scale">Scale</label>
        <select class="org-select" id="sel-scale" onchange="updateSizeReadout()">
          <option value="1">&times;1</option>
          <option value="2" selected>&times;2</option>
          <option value="3">&times;3</option>
        </select>
      </div>
      <div class="org-popover__row">
        <span class="org-popover__label">Output</span>
        <span class="org-out" id="vl-out-size">&mdash;</span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- CANVAS -->
  <div id="canvas-wrap" id="drop-zone">
    <div id="drop-hint">
      <div class="drop-icon">+</div>
      <p>Drop an image here<br>or click Open</p>
    </div>
    <canvas id="main-canvas" class="org-stage"></canvas>
    <!-- Compute controls sit ON the canvas: they drive the render whose
         progress overlay is already here. Keeps the header at three actions
         — see docs/UI-SHELL.md §4b. -->
    <div id="compute-bar" role="group" aria-label="Render">
      <button class="hud-btn" id="btn-refresh" onclick="triggerRender()" disabled>&#8635; Render</button>
      <button class="hud-btn" id="btn-stop" onclick="stopRender()" disabled>&#9632; Stop</button>
    </div>
    <div id="zoom-hud">
      <span id="zoom-level">100%</span>
      <span class="zoom-reset" onclick="resetZoom()">Reset</span>
    </div>
    <div id="progress-bar"></div>
  </div>

  <!-- PANEL -->
  <div id="panel">

    <!-- SYMBOLS -->
    <div class="panel-section">
      <h3>Symbols</h3>
      <div class="preview-wrap"><canvas id="symbol-preview" width="200" height="200"></canvas></div>
      <div id="mark-grid"></div>
      <button class="upload-btn" onclick="document.getElementById('mark-upload-input').click()">+ Upload SVG mark</button>
    </div>

    <!-- STIPPLING -->
    <div class="panel-section">
      <h3>Stippling</h3>

      <div class="ctrl-row">
        <span class="ctrl-label">Spacing</span>
        <input type="range" id="sl-spacing" min="4" max="40" value="12" oninput="syncVal(this,'vl-spacing');liveUpdate()">
        <span class="ctrl-val" id="vl-spacing">12</span>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-label">Size</span>
        <input type="range" id="sl-size" min="2" max="28" value="7" oninput="syncVal(this,'vl-size');liveUpdate()">
        <span class="ctrl-val" id="vl-size">7</span>
      </div>

      <label class="check-row">
        <input type="checkbox" id="ck-size-range" checked onchange="liveUpdate()">
        <span>Size by brightness</span>
      </label>

      <div class="ctrl-row">
        <span class="ctrl-label">Density</span>
        <div class="seg-ctrl">
          <button class="seg-btn active" onclick="setDensity('light',this)">Light</button>
          <button class="seg-btn" onclick="setDensity('medium',this)">Med</button>
          <button class="seg-btn" onclick="setDensity('dense',this)">Dense</button>
        </div>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-label">Phases</span>
        <input type="range" id="sl-phases" min="2" max="12" value="5" oninput="syncVal(this,'vl-phases')">
        <span class="ctrl-val" id="vl-phases">5</span>
      </div>

      <label class="check-row">
        <input type="checkbox" id="ck-invert" onchange="triggerRender()">
        <span>Invert image</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="ck-aa" checked onchange="liveUpdate()">
        <span>Antialiasing</span>
      </label>
    </div>

    <!-- MARK TRANSFORM -->
    <div class="panel-section">
      <h3>Transform</h3>

      <div class="ctrl-row">
        <span class="ctrl-label">Angle</span>
        <input type="range" id="sl-angle" min="0" max="360" value="0" oninput="syncVal(this,'vl-angle');liveUpdate()">
        <span class="ctrl-val" id="vl-angle">0°</span>
      </div>

      <label class="check-row">
        <input type="checkbox" id="ck-angle-range" onchange="liveUpdate()">
        <span>Angle by brightness</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="ck-angle-random" onchange="liveUpdate()">
        <span>Random angle</span>
      </label>

      <div class="ctrl-row">
        <span class="ctrl-label">Warp</span>
        <input type="range" id="sl-warp" min="0" max="1" step="0.05" value="0" oninput="syncVal(this,'vl-warp');liveUpdate()">
        <span class="ctrl-val" id="vl-warp">0</span>
      </div>
    </div>

    <!-- COLOR -->
    <div class="panel-section">
      <h3>Color</h3>

      <div class="color-mode-grid" style="margin-bottom: var(--space-5)">
        <button class="cm-btn active" onclick="setColorMode('solid',this)">Solid</button>
        <button class="cm-btn" onclick="setColorMode('adaptive',this)">Adaptive</button>
        <button class="cm-btn" onclick="setColorMode('image',this)">Image</button>
        <button class="cm-btn" onclick="setColorMode('multi',this)">Multi</button>
        <button class="cm-btn" onclick="setColorMode('rmx',this)">RMX</button>
      </div>

      <!-- RMX palette: up to 5 colours assigned by a chosen mapping (by tone) -->
      <div id="rmx-color-block" style="display:none; margin-bottom: var(--space-5)">
        <div class="ctrl-row mb-2">
          <span class="ctrl-label">Palette</span>
          <span class="ctrl-label" style="min-width:auto; color:var(--mid)">dark → bright</span>
        </div>
        <div id="rmx-palette" class="rmx-palette"></div>
        <div class="ctrl-row mt-3">
          <span class="ctrl-label">Mapping</span>
          <select class="panel-select u-flex1" id="sel-rmx-map" onchange="rmxColorMap=this.value;liveUpdate()">
            <option value="tone">Tone (gradient)</option>
            <option value="posterize">Posterize</option>
            <option value="random">Random</option>
            <option value="tonernd">Tone + Random</option>
          </select>
        </div>
      </div>

      <div class="color-row" id="row-mark">
        <span class="color-swatch-wrap">
          <button class="color-swatch" id="sw-mark" style="background:#0a0a0a"></button>
          <input type="color" id="cp-mark" value="#0a0a0a">
        </span>
        <input class="color-hex" id="hex-mark" value="#0a0a0a" maxlength="7">
        <span class="ctrl-label" style="min-width:auto">Mark</span>
      </div>

      <div class="color-row">
        <span class="color-swatch-wrap">
          <button class="color-swatch" id="sw-bg" style="background:#f5f2ec"></button>
          <input type="color" id="cp-bg" value="#f5f2ec">
        </span>
        <input class="color-hex" id="hex-bg" value="#f5f2ec" maxlength="7">
        <span class="ctrl-label" style="min-width:auto">BG</span>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-label">Opacity</span>
        <input type="range" id="sl-opacity" min="0.1" max="1" step="0.05" value="1" oninput="syncVal(this,'vl-opacity');liveUpdate()">
        <span class="ctrl-val" id="vl-opacity">1</span>
      </div>
    </div>

  </div><!-- /panel -->
</div><!-- /app -->

<!-- Centralized Organica shape library (window.ORGANIC_FORMS), shared with Genesis/Pollen -->
<script src="/shared/core.js"></script>
<script src="/shared/palette.js"></script>
<script src="/genesis/forms.js"></script>
<script>
// ─────────────────────────────────────────────
// MARK LIBRARY — primordial subset of the centralized Genesis forms
// (window.ORGANIC_FORMS): the base primitives for the Organica visual system.
// ─────────────────────────────────────────────
const GFORMS = window.ORGANIC_FORMS || {};
const GLABELS = window.ORGANIC_LABELS || {};
//          drop, line, circle, teardrop, ring, leaf, petal, seed, spiral, crescent, dew, iris, mushroom
const PRIMORDIAL = ['seed-breath','seed-heartbeat','seed-metaballs','seed-drop-fall','seed-lava-detach','seed-flower-bloom','seed-petal-turn','seed-caterpillar','seed-amoeba','seed-mitosis','seed-sun','seed-bubble-cluster','seed-line'];  // Genesis Base Seeds — keep in sync with shared/seeds-panel.js
const BUILT_IN_MARKS = PRIMORDIAL.filter(id => GFORMS[id]).map(id => ({
  id, name: GLABELS[id] || id, svg: GFORMS[id]
}));

// Custom uploaded marks
let customMarks = [];
let allMarks = [...BUILT_IN_MARKS];
let selectedMarkId = 'seed-breath';

// ── RMX COLORS: palette of up to 5 colours, assigned by a chosen mapping ──
let rmxColors = ['#1a1a2e', '#e94f37', '#f6e8c3'];   // default palette (dark→bright)
let rmxColorMap = 'tone';            // 'tone' | 'posterize' | 'random' | 'tonernd'
const RMX_COLORS_MAX = 5;
// Colour math now lives in shared/palette.js (Organica.palette.colorAt) —
// see the 'rmx'/'adaptive' branch in drawBatch().
function buildRmxPalette() {
  Organica.palette.swatch(document.getElementById('rmx-palette'), {
    colors: rmxColors,
    min: 2,
    max: RMX_COLORS_MAX,
    onChange: (colors) => { rmxColors = colors; liveUpdate(); },
  });
}

// Rendering state
let sourceImage = null;
let renderWorkerTimeout = null;
let isRendering = false;
let shouldStop = false;
let colorMode = 'solid';
let density = 'light';
const densityMap = { light: 1.6, medium: 1.0, dense: 0.6 };

// Canvas
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');

// ─────────────────────────────────────────────
// MARK GRID
// ─────────────────────────────────────────────
function buildMarkGrid() {
  const grid = document.getElementById('mark-grid');
  grid.innerHTML = '';
  allMarks.forEach(mark => {
    const thumb = document.createElement('div');
    thumb.className = 'mark-thumb' + (mark.id === selectedMarkId ? ' selected' : '');
    thumb.title = mark.name || '';
    thumb.onclick = () => selectMark(mark.id);
    // Render SVG in thumb + small reference number (Genesis form id)
    thumb.innerHTML = '<span class="thumb-num">' + (mark.name || '') + '</span>' + mark.svg.replace(/currentColor/g, '#0a0a0a');
    grid.appendChild(thumb);
  });
}

function selectMark(id) {
  selectedMarkId = id;
  document.querySelectorAll('.mark-thumb').forEach((t,i) => {
    t.classList.toggle('selected', allMarks[i].id === id);
  });
  updateSymbolPreview();
  liveUpdate();
}

// 400% preview of the selected symbol (central + ring of neighbours) — aligned with Pollen.
function updateSymbolPreview() {
  const pc = document.getElementById('symbol-preview');
  if (!pc) return;
  const g = pc.getContext('2d');
  const PW = pc.width, PH = pc.height, cx = PW / 2, cy = PH / 2;
  const ink = (document.getElementById('hex-mark') || {}).value || '#0a0a0a';
  const bg  = (document.getElementById('hex-bg') || {}).value || '#f5f2ec';
  const sizeBase = parseFloat((document.getElementById('sl-size') || {}).value || 7);

  g.clearRect(0, 0, PW, PH);
  g.fillStyle = bg; g.fillRect(0, 0, PW, PH);
  g.imageSmoothingEnabled = true;

  const mark = allMarks.find(m => m.id === selectedMarkId) || allMarks[0];
  if (!mark) return;
  const svgEl = new DOMParser().parseFromString(mark.svg, 'image/svg+xml').querySelector('svg');
  const vb = (svgEl.getAttribute('viewBox') || '0 0 20 20').split(/\s+/).map(Number);
  const vbW = vb[2] || 20, vbH = vb[3] || 20;

  const centerSize = 60 + sizeBase * 2;
  const satSize = centerSize * 0.42;
  const reach = 66;
  function stamp(x, y, size) {
    g.save(); g.translate(x, y);
    drawMark(g, svgEl, size, vbW, vbH, ink);
    g.restore();
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    stamp(cx + Math.cos(a) * reach, cy + Math.sin(a) * reach, satSize);
  }
  stamp(cx, cy, centerSize);
}

function uploadMark(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const svgText = e.target.result;
    const name = file.name.replace('.svg','').replace(/-_/g,' ').slice(0,12);
    const id = 'custom_' + Date.now();
    const mark = { id, name, svg: svgText };
    customMarks.push(mark);
    allMarks = [...BUILT_IN_MARKS, ...customMarks];
    buildMarkGrid();
    selectMark(id);
  };
  reader.readAsText(file);
  input.value = '';
}

// ─────────────────────────────────────────────
// IMAGE LOAD
// ─────────────────────────────────────────────
function loadImage(input) {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    sourceImage = img;
    resetZoom();
    setStatus('active', 'Image loaded — ' + img.width + '×' + img.height);
    document.getElementById('drop-hint').classList.add('hidden');
    document.getElementById('btn-refresh').disabled = false;
    triggerRender();
    URL.revokeObjectURL(url);
  };
  img.src = url;
  input.value = '';
}

// Drag & drop on canvas wrap
const canvasWrap = document.getElementById('canvas-wrap');
// Click the "+" circle to open the file picker.
document.querySelector('.drop-icon').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('file-input').click();
});
canvasWrap.addEventListener('dragover', e => { e.preventDefault(); canvasWrap.classList.add('drag-over'); });
canvasWrap.addEventListener('dragleave', () => canvasWrap.classList.remove('drag-over'));
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  canvasWrap.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById('file-input').files = dt.files;
    loadImage(document.getElementById('file-input'));
  }
});

// ─────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────
function syncVal(slider, valId) {
  const v = slider.value;
  const el = document.getElementById(valId);
  if (valId === 'vl-angle') el.textContent = v + '°';
  else el.textContent = v;
}

function setDensity(d, btn) {
  density = d;
  document.querySelectorAll('#panel .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  liveUpdate();
}

function setColorMode(mode, btn) {
  colorMode = mode;
  document.querySelectorAll('.cm-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const rmx = mode === 'rmx';
  document.getElementById('rmx-color-block').style.display = rmx ? '' : 'none';
  document.getElementById('row-mark').style.display = rmx ? 'none' : '';
  if (rmx) buildRmxPalette();
  liveUpdate();
}

// Mark / BG — the shared Palette component (attach mode). Populated in INIT
// (after liveUpdate is defined).
const swatches = {};

// ─────────────────────────────────────────────
// RENDER ENGINE
// ─────────────────────────────────────────────
function liveUpdate() {
  updateSymbolPreview();          // 400% preview always reflects size/colour, image or not
  if (!sourceImage) return;
  clearTimeout(renderWorkerTimeout);
  renderWorkerTimeout = setTimeout(triggerRender, 350);
}

function triggerRender() {
  if (!sourceImage) return;
  if (isRendering) { shouldStop = true; setTimeout(triggerRender, 100); return; }
  doRender();
}

function stopRender() {
  shouldStop = true;
  setStatus('active', 'Stopped');
  document.getElementById('btn-stop').disabled = true;
}

async function doRender() {
  isRendering = true;
  shouldStop = false;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-export', 'btn-save-png').disabled = true;
  document.getElementById('btn-save-jpg').disabled = true;
  document.getElementById('btn-save-svg').disabled = true;

  // Read controls
  const spacing = parseInt(document.getElementById('sl-spacing').value);
  const sizeBase = parseInt(document.getElementById('sl-size').value);
  const sizeByBrightness = document.getElementById('ck-size-range').checked;
  const phases = parseInt(document.getElementById('sl-phases').value);
  const invert = document.getElementById('ck-invert').checked;
  const aa = document.getElementById('ck-aa').checked;
  const angleBase = parseInt(document.getElementById('sl-angle').value) * Math.PI / 180;
  const angleByBrightness = document.getElementById('ck-angle-range').checked;
  const angleRandom = document.getElementById('ck-angle-random').checked;
  const warp = parseFloat(document.getElementById('sl-warp').value);
  const opacity = parseFloat(document.getElementById('sl-opacity').value);
  const markColor = document.getElementById('hex-mark').value;
  const bgColor = document.getElementById('hex-bg').value;
  const densityMult = densityMap[density];
  const spacingAdj = spacing * densityMult;

  // Set canvas size (max 1200px wide for perf)
  const maxW = 1200;
  const scale = sourceImage.width > maxW ? maxW / sourceImage.width : 1;
  const W = Math.floor(sourceImage.width * scale);
  const H = Math.floor(sourceImage.height * scale);

  canvas.width = W;
  canvas.height = H;
  canvas.classList.add('visible');

  // Get pixel data
  const offscreen = document.createElement('canvas');
  offscreen.width = W; offscreen.height = H;
  const octx = offscreen.getContext('2d');
  octx.drawImage(sourceImage, 0, 0, W, H);
  const imgData = octx.getImageData(0, 0, W, H).data;

  function getLuma(x, y) {
    const i = (Math.floor(y) * W + Math.floor(x)) * 4;
    const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
    let l = (0.299*r + 0.587*g + 0.114*b) / 255;
    return invert ? 1 - l : l;
  }

  function getColor(x, y) {
    const i = (Math.floor(y) * W + Math.floor(x)) * 4;
    return `rgb(${imgData[i]},${imgData[i+1]},${imgData[i+2]})`;
  }

  // Get current mark SVG — parse it
  const mark = allMarks.find(m => m.id === selectedMarkId) || allMarks[0];

  // Parse SVG to extract path/shape data
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(mark.svg, 'image/svg+xml');
  const svgEl = svgDoc.querySelector('svg');
  const vb = svgEl.getAttribute('viewBox')?.split(' ').map(Number) || [0,0,20,20];
  const vbW = vb[2], vbH = vb[3];

  // Fill background
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  if (aa) ctx.imageSmoothingEnabled = true;

  // Collect placement points sorted by phase (luminosity band)
  const points = [];
  const xSpacing = spacingAdj;
  const ySpacing = spacingAdj * 0.866; // slight hex offset
  let row = 0;

  for (let y = 0; y < H; y += ySpacing) {
    const xOffset = row % 2 === 0 ? 0 : xSpacing * 0.5;
    for (let x = xOffset; x < W; x += xSpacing) {
      const luma = getLuma(x, y);
      points.push({ x, y, luma, rnd: Math.random() });
    }
    row++;
  }

  // Sort by luminosity phase (dark first)
  points.sort((a, b) => a.luma - b.luma);

  setStatus('rendering', 'Rendering…');
  document.getElementById('progress-bar').style.width = '0%';

  const total = points.length;
  let drawn = 0;
  const BATCH = 200;

  // Store for SVG export
  window._lastRenderData = { W, H, bgColor, marks: [], markSvgVb: [vbW, vbH], markSvg: mark.svg };

  async function drawBatch(start) {
    if (shouldStop) { finishRender(true); return; }

    const end = Math.min(start + BATCH, total);
    for (let i = start; i < end; i++) {
      const { x, y, luma, rnd } = points[i];

      // Skip very bright areas (nothing to draw)
      if (luma > 0.92) continue;

      // Size mapped to darkness
      const darkness = 1 - luma;
      const sz = sizeByBrightness
        ? sizeBase * 0.4 + sizeBase * 0.6 * darkness
        : sizeBase;

      // Angle
      let angle = angleBase;
      if (angleRandom) angle = Math.random() * Math.PI * 2;
      else if (angleByBrightness) angle = angleBase * darkness * 2;
      // Add warp
      if (warp > 0) angle += (Math.random() - 0.5) * warp * Math.PI;

      // Color
      let fillColor;
      if (colorMode === 'image') fillColor = getColor(x, y);
      else if (colorMode === 'rmx' || colorMode === 'adaptive') {
        fillColor = Organica.palette.colorAt(luma, {
          mode: colorMode, ink: markColor, paper: bgColor,
          colors: rmxColors, submode: rmxColorMap, rnd,
        });
      }
      else if (colorMode === 'multi') fillColor = `hsl(${Math.random()*360},60%,40%)`;
      else fillColor = markColor;

      // Draw mark
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = opacity * (0.6 + 0.4 * darkness);
      drawMark(ctx, svgEl, sz, vbW, vbH, fillColor);
      ctx.restore();

      // Store for SVG export
      window._lastRenderData.marks.push({ x, y, angle, sz, color: fillColor, opacity: opacity * (0.6 + 0.4 * darkness) });
    }

    drawn += (end - start);
    document.getElementById('progress-bar').style.width = (drawn/total*100) + '%';

    if (end < total) {
      await new Promise(r => setTimeout(r, 0));
      drawBatch(end);
    } else {
      finishRender(false);
    }
  }

  drawBatch(0);
}

// Measure the real content bounding box of a mark via a hidden SVG (cached).
// Genesis forms fill only a fraction of their viewBox and are often off-centre;
// sizing/centring on the content (not the viewBox) renders every symbol at the
// intended marker size, centred.
const _markBBoxCache = {};
let _markMeasureSvg = null;
function markBBox(svgEl) {
  const key = (svgEl.getAttribute('viewBox') || '') + '|' + svgEl.innerHTML;
  if (key in _markBBoxCache) return _markBBoxCache[key];
  try {
    if (!_markMeasureSvg) {
      _markMeasureSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      _markMeasureSvg.setAttribute('style', 'position:absolute;left:-9999px;top:-9999px;width:200px;height:200px;overflow:visible;');
      document.body.appendChild(_markMeasureSvg);
    }
    _markMeasureSvg.setAttribute('viewBox', svgEl.getAttribute('viewBox') || '0 0 20 20');
    _markMeasureSvg.innerHTML = svgEl.innerHTML;
    const bb = _markMeasureSvg.getBBox();
    _markBBoxCache[key] = (bb && bb.width > 0.01 && bb.height > 0.01)
      ? { x: bb.x, y: bb.y, w: bb.width, h: bb.height } : null;
  } catch (e) { _markBBoxCache[key] = null; }
  return _markBBoxCache[key];
}

function drawMark(ctx, svgEl, size, vbW, vbH, color) {
  const bb = markBBox(svgEl) || { x: 0, y: 0, w: vbW, h: vbH };
  const scale = size / Math.max(bb.w, bb.h);

  ctx.save();
  ctx.translate(-(bb.x + bb.w / 2) * scale, -(bb.y + bb.h / 2) * scale);
  ctx.scale(scale, scale);
  ctx.fillStyle = color;
  ctx.strokeStyle = color;

  // Draw each child element
  Array.from(svgEl.children).forEach(el => drawSvgElement(ctx, el, color, scale));
  ctx.restore();
}

function drawSvgElement(ctx, el, color, scale) {
  const tag = el.tagName.toLowerCase();
  const fill = el.getAttribute('fill');
  const stroke = el.getAttribute('stroke');

  if (fill !== 'none') ctx.fillStyle = (fill && fill !== 'currentColor') ? fill : color;
  if (stroke) {
    ctx.strokeStyle = (stroke !== 'currentColor') ? stroke : color;
    const sw = el.getAttribute('stroke-width'); let lw = sw ? parseFloat(sw) : 1;
    if (scale) lw = Math.max(lw, 1.1 / scale);   // keep strokes visible at marker scale
    ctx.lineWidth = lw;
    const lc = el.getAttribute('stroke-linecap'); if (lc) ctx.lineCap = lc;
    ctx.lineJoin = 'round';
  }

  if (tag === 'circle') {
    const cx = +el.getAttribute('cx')||0, cy = +el.getAttribute('cy')||0, r = +el.getAttribute('r')||5;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    if (fill !== 'none') ctx.fill();
    if (stroke && stroke !== 'none') ctx.stroke();
  }
  else if (tag === 'rect') {
    const x = +el.getAttribute('x')||0, y = +el.getAttribute('y')||0;
    const w = +el.getAttribute('width')||10, h = +el.getAttribute('height')||10;
    if (fill !== 'none') ctx.fillRect(x,y,w,h);
    if (stroke) ctx.strokeRect(x,y,w,h);
  }
  else if (tag === 'polygon' || tag === 'polyline') {
    const pts = (el.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
    ctx.beginPath();
    for (let i=0; i<pts.length; i+=2) i===0 ? ctx.moveTo(pts[i],pts[i+1]) : ctx.lineTo(pts[i],pts[i+1]);
    if (tag === 'polygon') ctx.closePath();
    if (fill !== 'none') ctx.fill();
    if (stroke) ctx.stroke();
  }
  else if (tag === 'path') {
    const d = el.getAttribute('d')||'';
    const p = new Path2D(d);
    if (fill !== 'none') ctx.fill(p);
    if (stroke && stroke !== 'none') ctx.stroke(p);
  }
  else if (tag === 'ellipse') {
    const cx = +el.getAttribute('cx')||0, cy = +el.getAttribute('cy')||0;
    const rx = +el.getAttribute('rx')||5, ry = +el.getAttribute('ry')||5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
    if (fill !== 'none') ctx.fill();
    if (stroke) ctx.stroke();
  }
  else if (tag === 'line') {
    const x1 = +el.getAttribute('x1')||0, y1 = +el.getAttribute('y1')||0;
    const x2 = +el.getAttribute('x2')||0, y2 = +el.getAttribute('y2')||0;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  // Groups/nested
  else if (tag === 'g') {
    Array.from(el.children).forEach(child => drawSvgElement(ctx, child, color, scale));
  }
}

function finishRender(stopped) {
  isRendering = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('progress-bar').style.width = '100%';
  setTimeout(() => { document.getElementById('progress-bar').style.width = '0%'; }, 600);

  if (!stopped) {
    const count = window._lastRenderData?.marks?.length || 0;
    setStatus('active', count.toLocaleString() + ' marks placed');
    document.getElementById('btn-export', 'btn-save-png').disabled = false;
    document.getElementById('btn-save-jpg').disabled = false;
    document.getElementById('btn-save-svg').disabled = false;
  }
}

// ─────────────────────────────────────────────
// STATUS
// ─────────────────────────────────────────────
// Announced via the header's <output> live region — see core.js.
const setStatus = Organica.status();

// ─────────────────────────────────────────────
// EXPORT PNG
// ─────────────────────────────────────────────
function exportPNG() {
  const a = document.createElement('a');
  a.download = 'spore-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// ─────────────────────────────────────────────
// EXPORT JPG — high definition
// Re-renders the stored marks onto an upscaled offscreen canvas
// (the preview canvas is capped at 1200px; this restores full quality)
// ─────────────────────────────────────────────
function exportJPG() {
  const d = window._lastRenderData;
  if (!d) { alert('Render first.'); return; }
  const { W, H, bgColor, marks, markSvg } = d;

  // Target: native source resolution, then push further for print.
  // Cap the longest side to avoid browser canvas limits.
  const MAX_SIDE = 8000;
  const nativeScale = sourceImage ? Math.max(1, sourceImage.width / W) : 1;
  let scale = nativeScale * 2;            // 2× over native for crisp print
  const longest = Math.max(W, H) * scale;
  if (longest > MAX_SIDE) scale = MAX_SIDE / Math.max(W, H);

  const oc = document.createElement('canvas');
  oc.width = Math.round(W * scale);
  oc.height = Math.round(H * scale);
  const octx = oc.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';

  // Background (JPG has no alpha — always paint a solid bg)
  octx.fillStyle = bgColor;
  octx.fillRect(0, 0, oc.width, oc.height);

  // Re-parse the mark once
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(markSvg, 'image/svg+xml');
  const svgEl = svgDoc.querySelector('svg');
  const vb = svgEl.getAttribute('viewBox')?.split(' ').map(Number) || [0,0,20,20];
  const vbW = vb[2], vbH = vb[3];

  // Replay every stored mark at the upscaled coordinates
  marks.forEach(m => {
    octx.save();
    octx.translate(m.x * scale, m.y * scale);
    octx.rotate(m.angle);
    octx.globalAlpha = m.opacity;
    drawMark(octx, svgEl, m.sz * scale, vbW, vbH, m.color);
    octx.restore();
  });

  setStatus('active', 'JPG exported — ' + oc.width + '×' + oc.height);

  oc.toBlob(blob => {
    const a = document.createElement('a');
    a.download = 'spore-' + Date.now() + '.jpg';
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/jpeg', 0.95);
}

// ─────────────────────────────────────────────
// BUILD SVG (shared)
// Inlines each mark's real geometry with an explicit transform that
// mirrors the canvas draw exactly — so the vector matches the raster
// pixel-for-pixel and imports correctly into Figma. No <symbol>/<use>,
// no currentColor (which importers fail to resolve).
// ─────────────────────────────────────────────
function buildSporeSVG() {
  const d = window._lastRenderData;
  if (!d) return null;
  const { W, H, bgColor, marks, markSvg, markSvgVb } = d;
  const vbW = markSvgVb[0], vbH = markSvgVb[1];

  const parser = new DOMParser();
  const parsed = parser.parseFromString(markSvg, 'image/svg+xml');
  const parsedSvg = parsed.querySelector('svg');
  const innerSVG = parsedSvg.innerHTML;
  // Size/centre on the real content bbox (matches the canvas renderer).
  const bb = markBBox(parsedSvg) || { x: 0, y: 0, w: vbW, h: vbH };
  const bbMax = Math.max(bb.w, bb.h);

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  svg += `<rect width="${W}" height="${H}" fill="${bgColor}"/>`;

  marks.forEach(m => {
    const deg = (m.angle * 180 / Math.PI).toFixed(2);
    const s = m.sz / bbMax;
    const minSW = 1.1 / s;   // mirror the canvas stroke-width floor
    // Same composition the canvas applies in drawMark():
    // translate(center) → rotate → scale → translate(-bboxCenter)
    const tf = `translate(${m.x.toFixed(2)} ${m.y.toFixed(2)}) rotate(${deg}) `
             + `scale(${s.toFixed(4)}) translate(${(-(bb.x + bb.w/2)).toFixed(2)} ${(-(bb.y + bb.h/2)).toFixed(2)})`;
    // Genesis forms colour via CSS classes (no inline fill) → set fill on the
    // group; the Line's inline stroke="currentColor" is resolved here too.
    let shapes = innerSVG.replace(/currentColor/g, m.color).replace(/ xmlns="[^"]*"/g, '');
    shapes = shapes.replace(/stroke-width="([\d.]+)"/g, (mm, w) => `stroke-width="${Math.max(parseFloat(w), minSW).toFixed(2)}"`);
    svg += `<g transform="${tf}" fill="${m.color}" opacity="${m.opacity.toFixed(2)}">${shapes}</g>`;
  });

  svg += '</svg>';
  return svg;
}

// ─────────────────────────────────────────────
// EXPORT SVG
// ─────────────────────────────────────────────
function exportSVG() {
  const svg = buildSporeSVG();
  if (!svg) return;

  // Store for Figma
  window._lastSVG = svg;

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.download = 'spore-' + Date.now() + '.svg';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─────────────────────────────────────────────
// SEND TO FIGMA
// Uses the same Figma plugin approach as Strata
// Plugin listens for window.postMessage with { type: 'organica-svg', svg: '...' }
// ─────────────────────────────────────────────
function sendToFigma() {
  const d = window._lastRenderData;
  if (!d) { alert('Render first.'); return; }

  // Build SVG if not already built
  if (!window._lastSVG) exportSVGString();

  // Post message to Figma plugin (same protocol as Strata)
  window.parent.postMessage({
    pluginMessage: {
      type: 'organica-svg',
      svg: window._lastSVG,
      name: 'Spore — ' + new Date().toLocaleTimeString()
    }
  }, '*');

  setStatus('active', 'Sent to Figma plugin ↗');
}

function exportSVGString() {
  const svg = buildSporeSVG();
  if (svg) window._lastSVG = svg;
}

// ─────────────────────────────────────────────
// ZOOM & PAN (preview only — does not affect render/export)
//
// Shared maths: Organica.createZoomPan (core.js). This was an
// inline copy until 2026-08-30; adopting the shared one also picks up two
// behaviours the copy never had — the ⌘+/⌘-/⌘0 shortcuts, and the blur of
// a still-focused panel slider before wheel-zooming (without it, scrolling
// over the canvas silently nudges the last slider you dragged).
// The tool still owns its own HUD.
// ─────────────────────────────────────────────
const zoomPan = Organica.createZoomPan({
  canvas,
  wrap: canvasWrap,
  isReady: () => canvas.classList.contains('visible'),
  onChange: ({ zoom, zoomed }) => {
    document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
    document.getElementById('zoom-hud')
      .classList.toggle('visible', zoomed && canvas.classList.contains('visible'));
    canvas.classList.toggle('zoomed', zoomed);
  },
});
// Kept as a global function — the HUD's own `onclick="resetZoom()"` calls it,
// as does the image-load path.
function resetZoom() { zoomPan.reset(); }

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
buildMarkGrid();
updateSymbolPreview();
setStatus('', '—');

['mark', 'bg'].forEach(c => {
  swatches[c] = Organica.palette.swatch(c, { initial: document.getElementById('hex-' + c).value, onChange: liveUpdate });
});

Organica.popover(document.getElementById('btn-export'), document.getElementById('export-popover'));
Organica.autoLabelPanel(document);   // accessible names for row controls
Organica.enhanceSliders(document);   // filled track + click-to-edit value

// ── Rhizome bridge (Tier 2 node graph) ──
// Spore is fully image-gated — doRender()'s own callers all bail with
// no output if sourceImage is unset (confirmed by reading every call
// site before writing this, not assumed), and there's no window-scoped
// access to `sourceImage` itself (a plain top-level `let`, not a
// window property, in this classic-but-not-window-exported sense —
// only FUNCTION declarations land on window automatically). So the
// bridge fakes a real file upload via DataTransfer into the existing
// #file-input, the same path a real drag-drop would take, rather than
// trying to reach into the tool's private state directly.
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || msg.type !== 'rhizome-set-input') return;
  (async () => {
    try {
      const payload = msg.payload || {};
      if (!payload.dataURL) { e.source.postMessage({ type: 'rhizome-output-ready', payload: null, nodeId: msg.nodeId }, '*'); return; }
      const blob = await (await fetch(payload.dataURL)).blob();
      const file = new File([blob], 'rhizome-input.png', { type: blob.type || 'image/png' });
      const dt = new DataTransfer();
      dt.items.add(file);
      const input = document.getElementById('file-input');
      input.files = dt.files;
      loadImage(input);
      // Real bug, found by testing: loadImage()'s own img.onload is
      // ASYNC (even for a data: URL, image decode isn't synchronous) —
      // #btn-save-svg starts un-disabled in the HTML (only doRender()
      // itself sets disabled=true, once decoding has already finished),
      // so polling "while disabled" immediately after calling loadImage()
      // exits on the FIRST check, before the image has even decoded,
      // let alone before doRender() started. Fixed with a two-phase
      // wait: first for the image to actually finish loading (#drop-hint
      // gains .hidden inside loadImage()'s own onload, a reliable
      // load-complete signal), then for the render itself to finish.
      const dropHint = document.getElementById('drop-hint');
      let start = Date.now();
      while (!dropHint.classList.contains('hidden') && Date.now() - start < 5000) await new Promise(r => setTimeout(r, 30));
      const btn = document.getElementById('btn-save-svg');
      start = Date.now();
      while (btn.disabled && Date.now() - start < 8000) await new Promise(r => setTimeout(r, 60));
      const svg = buildSporeSVG();
      e.source.postMessage({ type: 'rhizome-output-ready', payload: svg, nodeId: msg.nodeId }, '*');
    } catch (err) {
      console.error('Rhizome bridge:', err);
    }
  })();
});
</script>
