<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tool — Organica</title>

<!-- THE TOOL TEMPLATE — /design-system/#template-tool. scripts/check.py lints this file with the
     same skeleton rules as every tool, so it cannot go stale again.
     Shared sheets, in load-bearing order (docs/UI-SHELL.md §2):
     tokens → icons → header → panel → floatbar → shell → palette → seeds-panel → mobile-gate.
     Each later sheet can override the one before without !important.
     Drop palette.css if this tool has no colour picker. data-theme-support on <html> opts the
     page into dark mode: build from tokens only and check both themes. -->
<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/shared/vendor/ibm-plex-mono-regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/panel.css">
<link rel="stylesheet" href="/shared/floatbar.css">
<link rel="stylesheet" href="/shared/shell.css">
<link rel="stylesheet" href="/shared/palette.css">
<link rel="stylesheet" href="/shared/mobile-gate.css">
<style>
  :root {
    /* The surface palette (--ink/--paper/--mid/--accent/--panel/--border)
       and color-scheme are defaults in tokens.css. Declare only
       --tool — this tool's identity hue, which drives the header focus
       ring. Pick an unclaimed hue: check the accent table in
       docs/DESIGN-SYSTEM.md §5 (and add yours to it) before choosing. Override --ink here only
       for a genuine reason (the warm-black trio uses #241b14). */
    --tool: #8aa054;
  }

  /* The shell (reset, body, #app, #canvas-wrap, .org-stage + zoom-cursor
     states, #zoom-hud, #drop-hint), the panel and the floatbar all come
     from the shared sheets. Put ONLY this tool's own visual content here.

     Common deltas a tool keeps local:
       #canvas-wrap { padding: 0; }              canvas reaches the edge
       #main-canvas { box-shadow: … 0.12); }     a lighter stage shadow
       #main-canvas:not(.visible) { display: none; }   starts hidden */
  #main-canvas:not(.visible) { display: none; }
</style>
<script src="/shared/pattern-init.js"></script>
</head>
<body>

<!-- First child of <body>: every tool assumes desktop width and a mouse. -->
<div class="mobile-gate"><p>Organica is designed for desktop. Please open this link on a laptop or desktop browser for the full experience.</p></div>

<!-- ══ HEADER — identity only ══
     The nav button, the logo, the status line and the account badge. No actions here: Open,
     playback and Export live in the floatbar, next to the canvas they act on (docs/UI-SHELL.md §4b). -->
<header class="org-header" role="banner">
  <button type="button" class="org-header__nav" aria-label="All tools" aria-controls="org-mega"><menu-icon state="menu" size="20" line-cap="square"></menu-icon></button>
  <a class="org-header__logo" href="/"><span class="org-header__mark" aria-hidden="true"></span><b>Organica</b><span>/ New Tool</span></a>
  <div class="org-header__spacer"></div>
</header>

<!-- ══ FLOATBAR — Open · (playback) · Export, fixed bottom-centre over the canvas ══
     A direct child of <body>. Icon-only buttons: an aria-label, never a title. Icons are the
     registry's drawings (shared/icons.js) — paste the markup with data-icon, or build it with
     Organica.icons.get(name). Canonical order: /design-system/#floatbar. -->
<div class="org-floatbar" role="toolbar" aria-label="Actions">
  <button class="org-floatbar__btn" id="btn-open" aria-label="Open an image" onclick="document.getElementById('file-input').click()">
    <svg class="ico" data-icon="folder-open" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4A1 1 0 0 1 2.5 3h2.8l1 1.3H13.5a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4Z"/></svg>
  </button>

  <span class="org-floatbar__sep" aria-hidden="true"></span>

  <div class="org-popover-wrap">
    <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-export" aria-label="Export">
      <svg class="ico" data-icon="download" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.2M5.3 6.7 8 9.4l2.7-2.7"/><path d="M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></svg>
      <svg class="ico chev" data-icon="chevron-down" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div class="org-popover" id="export-popover" aria-label="Export options">
      <div class="org-popover__title">Format</div>
      <div class="org-formats">
        <button class="org-btn" onclick="exportPNG()">PNG</button>
        <button class="org-btn" onclick="exportSVG()">SVG</button>
        <button class="org-btn" onclick="sendToFigma()">Figma</button>
      </div>

      <div class="org-popover__divider"></div>

      <div class="org-popover__row">
        <label class="org-popover__label" for="sel-scale">Scale</label>
        <select class="org-select" id="sel-scale" onchange="updateSizeReadout()">
          <option value="1">&times;1</option>
          <option value="2" selected>&times;2</option>
          <option value="4">&times;4</option>
        </select>
      </div>
      <div class="org-popover__row">
        <span class="org-popover__label">Output</span>
        <span class="org-out" id="out-size">&mdash;</span>
      </div>
    </div>
  </div>
</div>

<div id="app">

  <!-- ══ CANVAS — drop target, zoom/pan, HUD ══ -->
  <div id="canvas-wrap">
    <div id="drop-hint">
      <div class="drop-icon" role="button" tabindex="0" aria-label="Open a file"><svg class="ico ico--xl" data-icon="plus" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></div>
      <p>Drop an image<br>or click to open</p>
    </div>
    <canvas id="main-canvas" class="org-stage"></canvas>
    <div id="zoom-hud"><span id="zoom-level">100%</span><span class="zoom-reset" onclick="resetZoom()">reset</span></div>
  </div>

  <!-- ══ PANEL — one .panel-section per control group ══ -->
  <div id="panel">

    <div class="panel-section">
      <h3>Preset</h3>
      <!-- The thumbnail picker (Organica.selectPicker) renders into the host and hides the
           native <select>, which stays the source of truth for the value. -->
      <div id="preset-picker"></div>
      <select class="panel-select" id="sel-preset" aria-label="Preset" onchange="applyPreset(this.value)"></select>
      <div class="row-btns">
        <button class="mini-btn" onclick="savePreset()">Save</button>
        <button class="mini-btn" onclick="deletePreset()" data-armed="Confirm?">Delete</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>Controls <span class="hint">what this group does</span></h3>

      <div class="ctrl-row">
        <div class="seg-ctrl" id="seg-mode">
          <button class="seg-btn active" data-v="a" onclick="setSeg('seg-mode', this)">Mode A</button>
          <button class="seg-btn" data-v="b" onclick="setSeg('seg-mode', this)">Mode B</button>
        </div>
      </div>

      <div class="ctrl-row">
        <div class="ctrl-label">Amount</div>
        <input type="range" id="rg-amount" min="0" max="1" step="0.01" value="0.5"
               oninput="syncVal(this,'v-amount')">
        <span class="ctrl-val" id="v-amount">0.5</span>
      </div>

      <label class="check-row"><input type="checkbox" id="ck-flag" checked><span>A toggle</span></label>

      <!-- Colour row — wired by Organica.palette.swatch (palette.js).
           The component keeps #sw-ink / #cp-ink / #hex-ink in sync; the tool
           only supplies the repaint side effect via onChange. -->
      <div class="color-row">
        <span class="color-name">Ink</span>
        <div class="color-swatch-wrap">
          <button class="color-swatch" id="sw-ink" aria-label="Ink colour"></button>
          <input type="color" id="cp-ink" value="#0a0a0a">
        </div>
        <input class="color-hex" maxlength="7" id="hex-ink" value="#0a0a0a">
      </div>
    </div>

  </div><!-- /panel -->
</div>

<input type="file" id="file-input" class="org-file-input" accept="image/*" onchange="loadImage(this)">

<!-- Core BEFORE the tool script so Organica.* exists at parse time.
     palette.js only if this tool has a colour picker.
     recorder.js only if this tool records the canvas to video
     (Organica.recorder — see pulsar/vortex/membrane/camo-turing). -->
<script src="/shared/vendor/supabase-js.min.js"></script>
<script src="/shared/core.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/canvas.js"></script>
<script src="/shared/supabase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/auth-badge.js"></script>
<script src="/shared/store.js"></script>
<script src="/shared/palette.js"></script>
<script src="/shared/select-picker.js"></script>
<!-- <script src="/shared/recorder.js"></script> -->
<!-- <script src="/shared/seeds-panel.js"></script>  (+ its CSS above) -->

<script>
// ─────────────────────────────────────────────
// NEW TOOL — see docs/UI-SHELL.md §5 for the behaviour contract.
//
// THE ONE RULE: a single render function serves the preview AND every
// export. Only the resolution differs. If an export can disagree with
// what is on screen, the tool is broken.
// ─────────────────────────────────────────────

function ctrl(id) { return document.getElementById(id); }
function val(id)  { return parseFloat(ctrl(id).value); }

// Announced via the header's <output> live region.
const setStatus = Organica.status();

// ── RENDER — the single source of truth (declared early: the Palette
//    swatch below fires onChange during init, and it calls render()). ──
const canvas = ctrl('main-canvas');
function renderFrame(w, h) { /* draw at w×h — resolution-independent */ }
function render() { renderFrame(canvas.width, canvas.height); }

function syncVal(slider, valId) { ctrl(valId).textContent = slider.value; }
function setSeg(group, btn) {
  ctrl(group).querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
}
function seg(group) { return ctrl(group).querySelector('.seg-btn.active').dataset.v; }

// ── COLOUR — the shared Palette component owns the swatch/hex/picker trio ──
const swInk = Organica.palette.swatch('ink', {
  initial: '#0a0a0a',
  onChange: () => render(),
});

// ── PRESETS — per-user cloud storage (shared/store.js), localStorage cache,
//    legacy-key migration, first-login upsert. read()/write() stay sync. ──
const PRESETS = Organica.store('newtool');
function userPresets() { return PRESETS.read(); }
// Never window.prompt()/alert()/confirm(): use Organica.prompt / Organica.confirm (async) and setStatus('error', …).
async function savePreset() {
  const name = await Organica.prompt({ title: 'Save preset', label: 'Preset name' }); if (!name) return;
  const all = userPresets(); all[name] = readState();
  PRESETS.write(all); populatePresets(name);
}
function deletePreset() { /* … */ }
// The picker keeps a reference to `registry`: refill it in place, then refresh().
// Each entry is { name, thumb() } — the thumbnail comes from this tool's OWN renderer
// (size:'preview'), or omit thumb for a plain list. Rule: /design-system/#select-picker.
let presetPicker = null;
const registry = {};
function populatePresets(select) {
  const sel = ctrl('sel-preset'), names = Object.keys(userPresets()).sort();
  Object.keys(registry).forEach(k => delete registry[k]);
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');   // names are user text
  names.forEach(n => { registry[n] = { name: esc(n) }; });
  sel.innerHTML = names.length
    ? names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
    : '<option value="" disabled selected>No saved presets yet</option>';
  if (select) sel.value = select;
  if (!presetPicker) presetPicker = Organica.selectPicker(sel, ctrl('preset-picker'), { registry, ariaLabel: 'Preset' });
  else presetPicker.refresh();
}
function applyPreset(name) { /* … */ }
function readState() { return {}; }

// After init: hydrate from Supabase and re-render the list on pull / background flush.
// (auth.js auto-gates the page — no requireAuth() call needed here.)
PRESETS.pull().then(() => populatePresets());
PRESETS.onSync(() => populatePresets());

// ── EXPORT ──
function updateSizeReadout() { /* … */ }
function exportPNG() {
  // toDataURL, not toBlob — toBlob is async and races the canvas resize-back.
  const url = canvas.toDataURL('image/png');
  Organica.download(Organica.dataURLToBlob(url), Organica.stamp('newtool', 'png'));
}
function exportSVG() { /* … */ }
function sendToFigma() { Organica.sendToFigma(buildSVG(), 'New Tool'); }
function buildSVG() { return '<svg xmlns="http://www.w3.org/2000/svg"></svg>'; }

function loadImage(input) { /* … */ }

// ── DROP ZONE — click-to-open + dragover/dragleave/drop (Organica.
//    canvasDropZone, shared/canvas.js). Drop it and wire the three
//    listeners by hand only if this tool's drop behaviour genuinely
//    diverges (e.g. Colornet's multi-file batch drop). ──
Organica.canvasDropZone({
  wrap: ctrl('canvas-wrap'), dropIcon: '.drop-icon', fileInput: 'file-input',
  onFile: (input) => loadImage(input),
});

// ── ZOOM & PAN — shared maths AND the #zoom-hud DOM wiring
//    (Organica.canvasZoomHud, shared/canvas.js — built on createZoomPan).
//    No #zoom-hud in this tool? Pass hud: null, level: null instead. ──
const zoomPan = Organica.canvasZoomHud({
  canvas,
  wrap: ctrl('canvas-wrap'),
  isReady: () => canvas.classList.contains('visible'),
});
function resetZoom() { zoomPan.reset(); }

// ── INIT ──
Organica.popover(ctrl('btn-export'), ctrl('export-popover'));
setStatus('', 'Drop an image to begin');
populatePresets();
Organica.autoLabelPanel(document);
Organica.enhanceSliders(document);
</script>
<script src="/shared/tools.js"></script>
<script src="/shared/menu-icon.js"></script>
<script src="/shared/header.js"></script>
</body>
</html>
