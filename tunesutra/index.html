<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Organic Palette — Organica</title>

<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/panel.css">
<link rel="stylesheet" href="/shared/floatbar.css">
<link rel="stylesheet" href="/shared/shell.css">
<link rel="stylesheet" href="/shared/palette.css">
<link rel="stylesheet" href="/shared/shade-editor.css">
<link rel="stylesheet" href="/shared/colour-picker.css">
<link rel="stylesheet" href="/shared/mobile-gate.css">
<style>
  :root {
    /* Only --tool. The surface palette comes from tokens.css; redeclaring it
       here at its own default values was pure noise. See docs/CSS-RULES.md (a). */
    --tool: #c93ed6;   /* identity colour — vivid orchid/magenta, see index.html's own hue-gap note */
  }


  /* Reset, body, #app and the canvas region come from shell.css (.org-canvas-wrap).
     Deltas: the area scrolls, and is NOT align-items:center — a sheet taller than the area
     would overflow upward, where scrolling cannot reach. margin:auto on the sheet centres it
     when there is room and starts it at the top when there is not. */
  #stage-wrap { align-items: flex-start; justify-content: flex-start; padding: var(--space-8); overflow: auto; }
  /* The sheet + the house carousel laid over it (Nov 18, 2026): HTML on top of the SVG, so
     the arrows are never part of an export. The wrapper takes the sheet's margin:auto. */
  .ts-column { margin: auto; width: 100%; }   /* the palette bar + the sheet: max-width = the sheet's own size (renderStage) */
  .ts-sheet { position: relative; width: 100%; }   /* full width up to the sheet's own size: a shrink-to-fit box would collapse it */
  .ts-palbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    padding: var(--space-2) var(--space-3);   /* attached to the sheet below it: no gap, square bottom */
    background: var(--paper); border: 0; border-radius: var(--radius-md) var(--radius-md) 0 0;   /* the sheet's own paper, light in both themes; no border — one piece with the sheet (Diego, Nov 18, 2026) */
    position: relative; z-index: 1;   /* above the sheet's own shadow (--stage-shadow), which otherwise greys its bottom */
  }
  .ts-palbar .org-btn { flex: none; }
  .ts-palbar__crumb { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }   /* ← ‹the view it came from› ☆ — the name is on the sheet (Nov 20, 2026) */
  .ts-palbar__end { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .ts-palbar__title { margin: 0; font-size: var(--fs-small); color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* full width up to the sheet's own size (max-width set by renderStage): a shrink-to-fit box would collapse it */
  .ts-house-nav { position: absolute; inset: 0; pointer-events: none; }
  .ts-house-nav .org-btn { position: absolute; top: var(--house-cy, 30%); transform: translateY(-50%); pointer-events: auto; }
  .ts-house-nav #house-prev { left: var(--space-4); }
  .ts-house-nav #house-next { right: var(--space-4); }
  /* the + circle and the remove buttons, over the card row */
  .ts-sheet-ctrls { position: absolute; inset: 0; pointer-events: none; }
  .ts-sheet-ctrls > * { position: absolute; pointer-events: auto; }
  /* Add a colour: the shared on-content circle on the last card's right edge, at the card's middle (Diego, Nov 20, 2026 —
     option B; the dashed + card had only what was left of the row: a sliver at 5 colours, nothing from 6 on) */
  .ts-add { translate: -50% -50%; }
  /* the remove button sits on the colour itself: the shared on-content circle (.org-btn--on-content, Nov 20, 2026 —
     a paper chip since Nov 18: a bare ink icon vanished on dark colours); shown while the pointer is on its card */
  .ts-remove { opacity: 0; }   /* fades with the shared circle's own transition */
  .ts-remove.is-shown, .ts-remove:hover, .ts-remove:focus-visible { opacity: 1; }
  @media (hover: none) { .ts-remove { opacity: 1; } }
  /* the Colour section, right of the Contrast pairs: drawn at the sheet's own scale (renderStage) */
  .ts-colour-dock { position: absolute; transform-origin: 0 0; }   /* the six value tiles alone (Diego, Nov 18, 2026: "leave only the 6 boxes") */
  .ts-colour-dock .panel-section { border-bottom: 0; padding: 0; }
  .ts-colour-dock .org-tiles { margin: 0; }
  .ts-colour-dock :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--radius-sm); }   /* the panel's ring is scoped to #panel */
  .ts-tint { cursor: pointer; }
  .ts-tint:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ts-house-nav__live { position: absolute; clip-path: inset(50%); white-space: nowrap; }   /* read aloud, never seen */
  #stage-svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--paper);
    box-shadow: var(--stage-shadow);
  }
  /* Everything drawn on the sheet carries its own fill / stroke / font as
     attributes (see buildScene) so the export is self-contained. Only the
     on-screen selection state lives here. */
  .bar-seg { cursor: pointer; }
  .bar-seg.role-active { stroke: var(--ink); stroke-width: 3; }
  .bar-seg:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  #stage-svg text { pointer-events: none; }

  /* ── HOME — the palette library: every saved palette and built-in
     collection as a card. The page opens here; a card opens the editor. ── */
  #home {
    flex: 1;
    overflow: auto;
    background: var(--canvas-grid), var(--canvas-bg);
    padding: var(--space-8);
  }
  .ts-group { margin-bottom: var(--space-8); }
  .ts-group__title { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: var(--w-medium); margin-bottom: var(--space-2); }
  .ts-group__note { font-size: var(--fs-small); color: var(--mid); margin-bottom: var(--space-5); }
  .ts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-8) * 5), 1fr)); gap: var(--space-5); }
  .ts-card {
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--panel); color: var(--ink); text-decoration: none;
  }
  .ts-card:hover { border-color: var(--ink); }
  .ts-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* A card with a Star button (Nov 19, 2026, design-system CONSULT): the card is an <article>, its name the one link,
     stretched over the whole card by ::after; the star sits above that layer. Hover and focus belong to the card. */
  article.ts-card { position: relative; }
  .ts-card__link { color: inherit; text-decoration: none; outline: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-card__link::after { content: ''; position: absolute; inset: 0; }
  .ts-card:has(.ts-card__link:hover) { border-color: var(--ink); }
  .ts-card:has(.ts-card__link:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* the star sits on the house, top right, on a paper chip so it reads on any colour (Diego, Nov 20, 2026) */
  /* the star sits on the house, top right: the shared on-content circle (.org-btn--on-content, header.css; Nov 20, 2026) */
  .ts-card .ts-card__star { position: absolute; top: var(--space-2); right: var(--space-2); z-index: 1; }

  /* The three tabs (Nov 19, 2026, Diego: Your palettes · Make · Explore). Local until a second tool needs them;
     the current-page marker is the design system nav's (.ds-nav a.current), turned to sit under the word. */
  .ts-nav { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-5); margin-bottom: var(--space-6); border-bottom: 1px solid var(--border); }
  .ts-tabs { display: flex; gap: var(--space-6); }
  .ts-tabs a {
    font-family: var(--font-display); font-size: var(--fs-medium); color: var(--mid); text-decoration: none;
    padding-block: var(--space-3); border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
  }
  .ts-tabs a:hover { color: var(--ink); }
  .ts-tabs a[aria-current="page"] { color: var(--ink); font-weight: var(--w-medium); border-bottom-color: var(--accent-warm); }
  .ts-tabs a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ts-subnav { margin-bottom: var(--space-6); }   /* .seg-ctrl--fit: its own width */
  .ts-subnav .seg-btn { padding: 0 var(--space-4); text-decoration: none; display: inline-flex; align-items: center; }
  .ts-filter { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-5); }
  .ts-filter .seg-btn { padding: 0 var(--space-4); }
  .ts-filter__count { font-size: var(--fs-small); color: var(--mid); }
  .ts-empty { font-size: var(--fs-small); color: var(--mid); max-width: 60ch; }
  /* Explore › Palettes (Nov 19, 2026, design-system CONSULT): the results on the left, the filters in a panel on the
     right — the editor's #panel, in the same place. Only this view splits #home; the panel scrolls on its own. */
  #home.ts-home--split { display: flex; padding: 0; overflow: hidden; }
  .ts-explore { flex: 1; min-width: 0; overflow: auto; padding: var(--space-8); }
  .ts-filters { flex: none; overflow: auto; }
  .ts-find { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-6); }
  .ts-search { flex: 1 1 calc(var(--space-8) * 6); max-width: calc(var(--space-8) * 10); }
  .ts-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .ts-find .ts-filter__count { margin-left: auto; }
  .ts-group__head { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-5); }
  .ts-group__head .ts-group__title { margin-bottom: 0; }
  .ts-group__head .org-btn { margin-left: auto; }
  .ts-group__head .org-btn + .org-btn { margin-left: 0; }   /* two actions stay together on the right */
  .ts-keys { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .ts-key { width: var(--row-h); height: var(--row-h); padding: 0; border-radius: 50%; border: 1px solid var(--border-strong); cursor: pointer; }   /* a circle (the stadium exception); the fill is the key colour, data */
  .ts-key[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }   /* a ring, not a colour change */
  .ts-key:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .ts-filters .seg-ctrl--multi .seg-btn { padding: 0 var(--space-3); }
  .ts-filters .panel-select { width: 100%; }
  .ts-filters .sub-label { display: block; }   /* on a span / label its margins would not apply */
  .ts-mi-thumb { display: block; width: 100%; height: auto; margin-bottom: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .ts-mi-thumb[hidden] { display: none; }
  /* Explore › Moods: the image scale, on light paper; the words are buttons laid over the square */
  .ts-moodmap { position: relative; max-width: calc(var(--space-8) * 16); margin-bottom: var(--space-6); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); }
  .ts-moodmap svg { display: block; width: 100%; height: auto; }
  .ts-moodmap text { font-family: var(--font-display); font-size: var(--fs-small); fill: var(--mid); }
  .ts-mood { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
  /* Explore › Swatches: the hue × tone grid — the fills are the model's colours (data), on light paper in dark mode */
  .ts-swatches { display: grid; grid-template-columns: max-content repeat(10, minmax(0, 1fr)); gap: var(--space-1); max-width: calc(var(--space-8) * 22); padding: var(--space-4); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); }
  .ts-sw-row { display: contents; }
  .ts-sw-hue { font-size: var(--fs-small); color: var(--mid); text-align: center; align-self: end; overflow-wrap: anywhere; hyphens: auto; }
  .ts-sw-tone { font-size: var(--fs-small); color: var(--mid); padding-right: var(--space-3); align-self: center; white-space: nowrap; }
  .ts-sw-fam { grid-column: 1 / -1; font-family: var(--font-display); font-size: var(--fs-small); margin-top: var(--space-4); }
  .ts-cell { display: flex; align-items: flex-end; justify-content: flex-end; width: 100%; aspect-ratio: 1 / 1; padding: var(--space-1); border: 0; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
  .ts-cell.is-empty { opacity: 0.35; }
  .ts-cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--ink); opacity: 1; }   /* inside: the focus ring stays outside */
  .ts-sw-hex { color: var(--mid); font-family: var(--font-mono); }
  .ts-cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ts-sw-big { display: block; height: calc(var(--space-8) * 2); margin: var(--space-3) 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
  .ts-sw-list { list-style: none; margin: 0 0 var(--space-3); padding: 0; display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--fs-small); }
  .ts-sw-actions { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-3); }
  .ts-sw-list .ts-role { display: flex; }
  .ts-sw-list .ts-sw-hex { margin-left: auto; }
  .ts-roles { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin-bottom: var(--space-5); font-size: var(--fs-small); }
  .ts-role { display: inline-flex; align-items: center; gap: var(--space-2); }
  .ts-role__sw { width: var(--space-4); height: var(--space-4); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }   /* the fill is the palette colour, data */
  /* The art is the palette itself — content, so it stays on light paper in dark mode. */
  .ts-card__art { display: flex; aspect-ratio: 1 / 1; overflow: hidden; background: var(--paper); }   /* overflow: a tall house must not stretch the square */
  .ts-card__art svg { width: 100%; height: 100%; }
  .ts-card--new .ts-card__art svg { width: var(--icon-xl); height: var(--icon-xl); }
  .ts-card__label { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3) var(--space-4); }
  .ts-card__name { font-family: var(--font-display); font-size: var(--fs-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-card__meta { font-size: var(--fs-micro); color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* the New card's line */
  .ts-card__bars { display: flex; height: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--paper); }
  .ts-card__bars > span { flex: 1; }   /* the fill is the palette colour, data */
  .ts-card--new { border-style: dashed; background: none; }
  .ts-card--new .ts-card__art { background: none; align-items: center; justify-content: center; font-size: var(--fs-xl); color: var(--mid); }

  .role-name { font-size: var(--fs-small); color: var(--mid); margin-bottom: var(--space-2); }

  /* The stop bar (Gradient › Stops) is shared since Nov 20, 2026: shared/shade-editor.css (.org-stopbar). */
</style>
<script src="/shared/pattern-init.js"></script>
</head>
<body>
<div class="mobile-gate"><p>Organica is designed for desktop. Please open this link on a laptop or desktop browser for the full experience.</p></div>

<header class="org-header" role="banner">
  <button type="button" class="org-header__nav" aria-label="All tools" aria-controls="org-mega"><menu-icon state="menu" size="20" line-cap="square"></menu-icon></button>
  <a class="org-header__logo" href="/"><span class="org-header__mark" aria-hidden="true"></span><b>Organica</b><span>/ Organic Palette</span></a>
  <div class="org-header__spacer"></div>
</header>

<main id="home" hidden aria-label="Palettes"></main>

<div id="app">
  <div id="stage-wrap" class="org-canvas-wrap">
    <!-- the column: the palette bar over the sheet, both the sheet's width (Diego, Nov 18, 2026: "sposta il back … sopra
         a Example — house no. … con una barra che lo racchiude della stessa larghezza della canvas") -->
    <div class="ts-column" id="ts-column">
      <div class="ts-palbar" data-theme="light">
        <div class="ts-palbar__crumb">
          <button type="button" class="org-btn org-btn--ghost" id="btn-home"><i data-icon="arrow-left"></i><span id="btn-home-label">Your palettes</span></button>
          <button type="button" class="org-btn org-btn--icon org-btn--icon-toggle ts-star" id="btn-star" aria-pressed="false" aria-label="Star"></button>
        </div>
        <div class="ts-palbar__end">
          <p class="ts-palbar__title" id="palette-title"></p>
          <a class="org-btn" id="btn-variations" href="#make">Make variations</a>
        </div>
      </div>
      <div class="ts-sheet" data-theme="light">
        <svg id="stage-svg" data-theme="light" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="ts-house-nav" id="house-nav" role="group" aria-label="House" hidden>
          <button type="button" class="org-btn org-btn--icon org-btn--lg" id="house-prev" aria-label="Previous house"></button>
          <button type="button" class="org-btn org-btn--icon org-btn--lg" id="house-next" aria-label="Next house"></button>
          <span class="ts-house-nav__live" id="house-no" aria-live="polite"></span>
        </div>
        <!-- On-sheet controls (Nov 18, 2026: Diego, "togliere Colours 3 4 5 … un più su una scheda vuota" ·
             "metti la parte colour al fianco destro di dove è ora contrast"): HTML laid over the SVG
             like the house arrows, placed by scene coordinates, so none of it reaches an export. -->
        <div class="ts-sheet-ctrls" id="sheet-ctrls"></div>
        <div class="ts-colour-dock" id="colour-dock" hidden>
          <div class="panel-section">
            <div class="org-tiles" id="value-tiles" role="group" aria-label="Values"></div>
        
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel" class="org-panel">
    <!-- Palette section removed (Diego, Nov 18, 2026, night): Harmony, Lightness spread, Generate went once the
         Shadow's Free inks took the harmony rules; a new colour follows Complementary; Undo is in the floatbar. -->

    <!-- Gradient · Shadow (Nov 18, 2026: Diego, "dobbiamo far capire bene cosa è per gradient, cosa è per grain, e cosa
         è shadow"; mockup A): one definition (G()) behind both sections. Since Nov 20, 2026 the controls are the shared
         Organica.shadeEditor (shared/shade-editor.js) — the same ones every tool shows for a palette colour — mounted
         here by initGradient(), editing G() in place. -->
    <!-- The Colour mode left TuneSutra (Diego, Nov 21, 2026: "eliminiamo il colour mode da tunesutra perché non è il suo
         posto"): it is the tone tools' own (Pollen first). A palette's saved mapping is kept as it was (mappingFromRecord →
         mappingRecord), never shown or changed here. -->
    <div id="ts-shade"></div>

  </div>
</div>

<!-- ══ FLOATBAR — export only. No Figma button: removed product-wide
     (see camo-turing/index.html's own note), coming back as an Export-
     popover tab once that's rebuilt. sendToFigma() stays defined below,
     ready to reuse, same convention as Loom/Camo Turing/FVS. ══ -->
<div class="org-floatbar" role="toolbar" aria-label="Actions">
  <button class="org-floatbar__btn" id="btn-undo" aria-label="Undo (⌘Z)" disabled>
    <svg class="ico" data-icon="undo" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M3 6h6.5a3.5 3.5 0 0 1 0 7H6"/></svg>
  </button>
  <button class="org-floatbar__btn" id="btn-reset" aria-label="Reset palette">
    <svg class="ico" data-icon="reset" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.65"/><path d="M3 2.3V6h3.7"/></svg>
  </button>
  <div class="org-floatbar__sep"></div>
  <div class="org-popover-wrap">
    <button class="org-floatbar__btn" id="btn-save-open" aria-label="Save palette">
      <svg class="ico" data-icon="save" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h8l2 2v8a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M5 2.5V6h5V2.5M5.5 10.5h5"/></svg>
    </button>
    <div class="org-popover" id="save-popover" aria-label="Save palette">
      <div class="org-popover__title">Save palette</div>
      <div class="org-popover__row">
        <label class="org-popover__label" for="txt-preset-name">Name</label>
        <input type="text" class="panel-input panel-input--full" id="txt-preset-name">
      </div>
      <div class="org-popover__row">
        <button class="org-btn" id="btn-preset-confirm">Save</button>
        <button class="org-btn" id="btn-preset-delete" data-armed="Delete?" hidden>Delete palette</button>
      </div>
    </div>
  </div>
  <div class="org-floatbar__sep"></div>
  <div class="org-popover-wrap">
    <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-export" aria-label="Export">
      <svg class="ico" data-icon="download" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.2M5.3 6.7 8 9.4l2.7-2.7"/><path d="M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></svg>
      <svg class="ico chev" data-icon="chevron-down" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div class="org-popover" id="export-popover" aria-label="Export options">
      <div class="org-popover__title">Format</div>
      <div class="org-formats">
        <button class="org-btn" id="btn-export-png">PNG</button>
        <button class="org-btn" id="btn-export-svg">SVG</button>
        <button class="org-btn" id="btn-export-css">CSS</button>
        <button class="org-btn" id="btn-export-json">JSON</button>
      </div>
      <div class="org-popover__divider"></div>
      <label class="check-row org-switch" title="No paper behind the drawing: transparent stops stay empty in the file."><input type="checkbox" id="ck-export-clear"><span>Transparent paper</span></label>
      <div class="org-popover__row">
        <label class="org-popover__label" for="sel-export-scale">Scale</label>
        <select class="org-select" id="sel-export-scale">
          <option value="1">&times;1</option>
          <option value="2" selected>&times;2</option>
          <option value="4">&times;4</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script src="/shared/vendor/supabase-js.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
// TuneSutra — colour-harmony palette generator.
//
// WYSIWYG rule: buildScene() returns one list of plain shapes and text;
// the on-screen SVG, the exported SVG and the PNG are all drawn from that
// list (sceneMarkup / drawScene). Every item carries its own paint and font,
// so an exported file needs nothing from this page's CSS. If an export can
// disagree with the on-screen stage, the tool is broken.
//
// Colour-space conversions (rgbToHsb/hsbToRgb/rgbToCmyk/cmykToRgb/
// rgbToHsl/hslToRgb) were all written here first: the repo had hex<->RGB
// shared already, but no RGB->HSB, no HSL either direction, no CMYK
// anywhere. All of them have since been PROMOTED — CMYK to core.js
// (2026-08-27, Colornet the second consumer), HSB/HSL to shared/color.js
// (2026-10-01, Membrane the second consumer) — and the functions below are
// thin aliases, so every call site here is untouched.
// ─────────────────────────────────────────────────────────────

function ctrl(id) { return document.getElementById(id); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function round(v) { return Math.round(v); }

// ── COLOUR CONVERSIONS — aliases onto the shared implementations ──
function rgbToHsb(r, g, b) { return Organica.color.rgbToHsb(r, g, b); }
function hsbToRgb(h, s, v) { return Organica.color.hsbToRgb(h, s, v); }
function rgbToCmyk(r, g, b) { return Organica.rgbToCmyk(r, g, b); }
function cmykToRgb(c, m, y, k) { return Organica.cmykToRgb(c, m, y, k); }
function rgbToHsl(r, g, b) { return Organica.color.rgbToHsl(r, g, b); }
function hslToRgb(h, s, l) { return Organica.color.hslToRgb(h, s, l); }
function hexFromRgb(r, g, b) { return Organica.rgbToHex(r, g, b); }

// ── STATE ──
// One item per colour. `id` is stable for the colour's whole life (reordering never changes it).
// `name` and `lock` are still saved but unread since Nov 18, 2026: a colour is named by its ROLE,
// and only the base is kept through Generate.
const C = Organica.color;
// The roles — semantic, one word each, largest share first (Diego, Nov 18, 2026: "each color has a
// token name that is built correctly … go with more colours and variants"). The set follows the
// count, so the smallest colour is always the Accent (and at 5 the Highlight below it); a 6th or
// 7th (palettes saved before) is Extra 1, Extra 2.
const FIG = window.TUNESUTRA_FIG, ROLE_SETS = FIG.ROLE_SETS;   // tunesutra/palette-figures.js (shared with the colour guide)
// The lightest tint is called 50 in TuneSutra (Diego, Nov 18, 2026 — the shared scale keeps 0 for FVS).
const stepName = st => st.step || 50;
const DISTINCT_MIN = C.DISTINCT_MIN;   // OKLab ΔE×100 — below this two swatches read as one colour at a glance
const state = {
  harmony: 'complementary',   // the default rule (Diego, Nov 18, 2026; was Analogous)
  spread: 0,          // lightness spread, in OKLCH L points (0–30)
  activeIndex: 0,
  view: 'garment',    // the house + the share tubes; 'gradient' (a view off it) was removed Nov 18, 2026 — read as 'garment'
  house: 1,           // the figure's seed (tunesutra/house.js): saved with the palette, stepped by the carousel
  zone: null,         // the house shape selected (its index in the figure), or null — a colour card / chip selects the colour
  zoneShades: {},     // a shape's own shading, keyed 'house/count/shape' (saved with the palette)
  // The Mapping (Diego, Nov 21, 2026): how a tool lays the palette on a value 0..1 — Colour Mode, RMX Mapping, Blend,
  // the order (colour ids, dark → bright; null = by lightness, following every edit) and the Adaptive pair (ids;
  // null = the darkest and the lightest). Saved as indices (Organica.palettes.mappingFor). Since Nov 21, 2026 (evening) no
  // control here (the Colour mode is the tone tools' own): a palette's mapping is carried through as it was saved.
  mapping: { mode: 'rmx', submode: 'tone', space: 'oklab', order: null, pair: null },
  shading: 'none',    // flat by default, as the home shows it (Diego, Nov 18, 2026) — the figure's shadow: 'none' | 'soft' | 'speckle' ('print', the old Stipple, reads as Soft)
  items: [],
  // The gradient: stops are colours in their own right (picked from this
  // palette or any saved one), so reordering the palette never reorders them.
  grad: {
    type: 'linear',   // 'flat' (the first stop only) | 'linear' | 'radial'
    angle: 90,        // CSS convention: 0 = to top, 90 = to right
    stops: ['#c93ed6', '#c9863e'],
    pos: null,        // a 0..1 position per stop, ascending; null = evenly spaced (palettes saved before Nov 2, 2026)
    paper: false,     // fade to paper: the sheet's paper as a last, plate-less stop
    // Every grain is one pure ink — the drawing is vector everywhere (Nov 18, 2026).
    size: 0,          // GRAIN size in sheet units, 0–12 (0 = no grain: a smooth blend)
    pattern: 'noise', // the grain: 'noise' (square cells at random) | 'dots' (round dots, evenly spread)
    // SHADOW — its own switch, speck size, specks and seed since Nov 18, 2026 (Diego: Gradient · Grain · Shadow)
    shadow: false,    // on / off
    amount: 70,       // how strong, 1–100
    speck: 2,         // speck / dot size, when the shadow has its own grid (Flat, or grain 0); on a grained blend it follows the grain
    specks: 'specks', // RENDER: 'specks' (square cells) | 'dots' (a halftone screen) | 'bands' (hard steps)
    sseed: 1,         // the shadow's own seed
    // the painter's shadow (Nov 18, 2026 — the Shadow lab): two inks made by these rules, snapped to the palette
    hue: 'same',      // on the palette: 'same' | 'cool' | 'warm' | 'complement'; free: the harmony rules — 'same' (Monochromatic) | 'analogous' | 'complement' | 'split' | 'triadic' | 'tetradic'
    shift: 60,        // how far toward that hue, 0–100
    depth: 35,        // how dark the core gets, in OKLCH lightness ×100
    lose: 0,          // chroma lost in the shadow, 0–100
    glow: 0,          // chroma gained at the turning edge (in the halftone ink), 0–100
    parts: { half: true, term: false, core: true, refl: false, high: false },
    snap: true,       // each ink → the nearest of the palette's own tints
    inkMid: null, inkCore: null,   // a hand-picked ink (null = the rule's)
    dist: 'light',    // the shadow's spread: 'light' (away from a light) | 'even' (everywhere)
    light: 315,       // Light from, degrees (0 = the top)
    falloff: 50,      // 50 = straight; higher keeps the shadow to the far side
    seed: 1,
  },
};

function newId() { return 'c-' + Math.random().toString(36).slice(2, 8); }
function roleName(i, n) { return FIG.roleName(i, n || count()); }
// A new colour takes the first role name nobody is using — after a removal,
// position i's own role name may already belong to a colour further along.
function makeItem(hex) { return { id: newId(), name: '', hex: hex, lock: false }; }
// Each colour keeps the PART of the house it paints (Nov 19, 2026, redesign step 3): background · ground · middle (the hill) ·
// far · main (the wall) · sub (the roof) · accent (the door) · accent2 (the windows) · accent3 (the path) — the order is
// Organica.hueTone.ROLE_PARTS[n], largest share first, the same as house.js's roles. Adding or removing a colour keeps the
// others on their part; the new colour takes the part that appears, a colour whose part has no place at the new count
// takes one that is free. The list stays sorted by part, so items[i] is still the i-th role everywhere else.
const PARTS = Organica.hueTone.ROLE_PARTS;
function placeParts() {
  const P = PARTS[count()] || PARTS[5], used = {}, keep = state.items.map(it => {
    if (it.part && P.indexOf(it.part) >= 0 && !used[it.part]) { used[it.part] = 1; return true; }
    return false;
  });
  const free = P.filter(k => !used[k]);
  state.items.forEach((it, i) => { if (!keep[i]) it.part = free.shift(); });
  const activeId = state.items[state.activeIndex] && state.items[state.activeIndex].id;
  state.items.sort((a, b) => P.indexOf(a.part) - P.indexOf(b.part));
  if (activeId) state.activeIndex = Math.max(0, state.items.findIndex(it => it.id === activeId));
}
function colors() { return state.items.map(it => it.hex); }
function count() { return state.items.length; }
// A colour's name is its role (Diego, Nov 18, 2026: the name is semantic and tokenized, not edited) —
// a name saved before is kept in the data, unread.
function dispName(i) { return roleName(i); }
// The share each colour takes in the Bar, on the home cards and on the figure = HOUSE.SHARES
// (tunesutra/house.js): 3 colours 52 / 32.2 / 15.8, 4 colours 52.0 / 32.2 / 10.9 / 4.9 — the
// Garment's measured proportions (Diego, Nov 17, 2026: "align the bar"; Base : Secondary is the
// golden ratio) — and 5 colours 71.6 / 20.0 / 4.6 / 2.8 / 1.0, the book page's (the Scene's 71.8
// less the rounding). 6–7 were dropped on Nov 17, 2026 and are back since Nov 19, 2026, on their own house: 6 = the 5-colour scene with windows
// (71.6 / 20.0 / 3.8 / 2.8 / 1.0 / 0.8), 7 = plus a hill (57.6 / 20.0 / 14.0 / 3.8 / 2.8 / 1.0 / 0.8) —
// the Hue × tone lab's rule. The 0.6 split below is the fallback past 7. TuneSutra only —
// C.roleShares (the 0.6 rule) also drives FVS Suggest and stays as it is.
function roleWeights(n) {
  const g = HOUSE.SHARES[4];   // [base, secondary, accent, trim], sums to 100
  if (n >= 2 && n <= 9) return HOUSE.SHARES[n].slice();   // the house is generated on these (tunesutra/house.js; 6–7, then 2 · 8 · 9 since Nov 19, 2026)
  if (n < 2) return C.roleShares(n);
  const tail = g[2] + g[3], k = n - 2, raw = [];
  for (let i = 0; i < k; i++) raw.push(Math.pow(0.6, i));
  const sum = raw.reduce((a, b) => a + b, 0);
  return [g[0], g[1]].concat(raw.map(v => v / sum * tail));
}
state.items = ['#c93ed6', '#c9863e', '#3ec9a8'].map(makeItem);
state.items.forEach((it, i) => { it.part = PARTS[3][i]; });

// ── TOKEN SCALE (0–900) — Organica.color.scale: fixed perceptual lightness
//    per step, the picked colour kept on its nearest step (the anchor). ──
const scaleCache = new Map();
// A colour moved onto one of its own tints keeps the column it was picked from (Diego, Nov 19, 2026: "quando
// cambio shade non deve ricalcolare gli altri"): the item remembers `scaleFrom`, the colour the column was built
// from, and its scale is that column with the anchor on the picked step.
function tokenScale(hex) {
  const it = typeof state !== 'undefined' && state.items ? state.items.find(x => x.hex === hex && x.scaleFrom && x.scaleFrom !== hex) : null;
  const key = it ? hex + '<' + it.scaleFrom : hex;
  if (!scaleCache.has(key)) {
    const from = it ? C.scale(it.scaleFrom) : null, at = from ? from.findIndex(st => st.hex === hex) : -1;
    scaleCache.set(key, at >= 0 ? from.map((st, j) => Object.assign({}, st, { anchor: j === at })) : C.scale(hex));
  }
  return scaleCache.get(key);
}
// Scale indices ordered by distance from the anchor — the "next shade of
// this colour" sequence used for extra roles and for Monochromatic.
function around(anchor, lighterFirst) {
  const out = [];
  for (let d = 1; d <= 9; d++) {
    const lighter = anchor - d, darker = anchor + d;
    (lighterFirst ? [lighter, darker] : [darker, lighter]).forEach(i => { if (i >= 0 && i <= 9) out.push(i); });
  }
  return out;
}
function derive(hex, k, lighterFirst) {
  const sc = tokenScale(hex), order = around(sc.findIndex(s => s.anchor), lighterFirst);
  return sc[order[k % order.length]].hex;
}
function nextColour() {
  const cols = colors(), last = cols[cols.length - 1];
  for (let k = 0; k < 9; k++) { const hex = derive(last, k, false); if (cols.indexOf(hex) < 0) return hex; }
  return derive(last, 0, false);
}

// ── HARMONY GENERATION — hue rotated in OKLCH, so every generated colour has
//    the base colour's perceived lightness (plus the Lightness spread, if any)
//    and as much of its chroma as that hue can hold. The first colour is the
//    seed and is never rewritten: pressing Generate twice gives the same set. ──
const HARMONY_HUES = {
  complementary: [0, 180],
  splitComplementary: [0, 150, 210],
  triadic: [0, 120, 240],
  tetradic: [0, 90, 180, 270],
};
function generateHarmony() {
  const n = count(), baseHex = state.items[0].hex, base = C.hexToOklch(baseHex);
  if (state.harmony === 'monochromatic') {
    return Array.from({ length: n }, (_, i) => i === 0 ? baseHex : derive(baseHex, i - 1, true));
  }
  // Analogous fans out either side of the base (0, +15, −15, +30, −30 …).
  const offs = state.harmony === 'analogous'
    ? Array.from({ length: n }, (_, i) => (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 15)
    : (HARMONY_HUES[state.harmony] || [0]);
  const m = offs.length, kmax = Math.max(1, Math.ceil((m - 1) / 2)), dir = base.l > 0.6 ? -1 : 1;
  const hueAt = i => (base.h + offs[i] + 360) % 360;
  const natural = offs.map((off, i) => {
    if (i === 0) return baseHex;
    const k = Math.ceil(i / 2) / kmax, sign = (i % 2 ? 1 : -1) * dir;
    const l = state.spread ? clamp(base.l + sign * k * state.spread / 100, 0.25, 0.95) : base.l;
    return C.oklchToHex(l, base.c, hueAt(i));
  });
  // Roles beyond the rule's own hue count reuse those hues in turn, each one
  // a further step along that hue's scale, so no two come out identical.
  return Array.from({ length: n }, (_, i) => {
    if (i < m) return natural[i];
    const extra = i - m, hi = extra % m;
    const seed = hi === 0 ? baseHex : C.oklchToHex(base.l, base.c, hueAt(hi));
    return derive(seed, Math.floor(extra / m), false);
  });
}

// ── UNDO — JSON snapshots, checkpoints only. Bursts of the same continuous
//    edit (dragging the picker, typing a name, the spread slider) coalesce. ──
const undoStack = [];
let lastUndo = { kind: '', t: 0 };
function snapshot() {
  return JSON.stringify({ items: state.items, harmony: state.harmony, spread: state.spread, view: state.view, house: state.house, shading: state.shading, mapping: state.mapping, activeIndex: state.activeIndex, zone: state.zone, zoneAt: state.zoneAt, zoneShades: state.zoneShades, grad: state.grad });
}
function pushUndo(kind) {
  const now = Date.now();
  const burst = (kind === 'edit' || kind === 'name' || kind === 'spread' || kind === 'grad' || kind === 'sys') && lastUndo.kind === kind && now - lastUndo.t < 1200;
  lastUndo = { kind: kind, t: now };
  if (!burst) {
    undoStack.push(snapshot());
    if (undoStack.length > 60) undoStack.shift();
    if (!dirty) { setDirty(true); refreshTitle(); }
    syncUndo();
  }
  if (kind.indexOf('grad') === 0) keepEdit();   // an edit in Gradient & grain: on the house it becomes the colour's own
}
// Reset (floatbar; Diego, Nov 18, 2026: "back to preset nella floatbar come se fosse un reset alla palette
// iniziale"): the palette as it was opened — colours, every shading of its own, the house. One undo step.
let initialSnap = null;
function resetPalette() {
  if (!initialSnap || initialSnap === snapshot()) return;
  pushUndo('reset');
  Object.assign(state, JSON.parse(initialSnap));
  tintSel = null;
  syncControls();
  commit(true);
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  Object.assign(state, JSON.parse(s));
  lastUndo = { kind: '', t: 0 };
  syncControls();
  commit(true);
}
function syncUndo() { ctrl('btn-undo').disabled = !undoStack.length; }

// One refresh path for every change. rebuildChips=false only while a chip's
// own native picker is the thing being dragged.
function commit(rebuildChips) {
  scaleCache.clear();
  syncViewSeg();
  refreshFieldEditor();
  syncGradControls();   // what Gradient & grain edits can change with the colours (a shape lapses, a stop is the colour)
  renderStage();
  refreshHints();
  syncUndo();
}
function syncControls() {
  syncGradControls();
}

// ── DISTINCTNESS — which pairs are too close to tell apart ──
function closePairs() {
  const cols = colors(), out = [];
  for (let i = 0; i < cols.length; i++) for (let j = i + 1; j < cols.length; j++) {
    const d = C.deltaE(cols[i], cols[j]);
    if (d < DISTINCT_MIN) out.push({ i: i, j: j, d: d });
  }
  return out;
}
function refreshHints() {
  const pairs = closePairs(), el = ctrl('distinct-hint');
  if (!el) return;   // the Palette section and its hint went (Nov 18, 2026, night)
  el.textContent = pairs.length
    ? 'Hard to tell apart: ' + pairs.map(p => dispName(p.i) + ' and ' + dispName(p.j)).join('; ') + '.'
    : 'Every colour is distinct from the others.';
}

// ── ACTIVE-COLOUR FIELD EDITOR ──
function setActiveColor(hex) {
  hex = Organica.normalizeHex(hex, state.items[state.activeIndex].hex);
  pushUndo('edit');
  state.items[state.activeIndex].hex = hex;
  delete state.items[state.activeIndex].scaleFrom;   // a colour picked anew gets its own column
  commit(true);
}
// Hex · RGB · HSB · CMYK · Nearest RAL are read-only tiles (Diego, Nov 17, 2026) — values are typed in the picker.
// The six tiles' markup, for the editor's dock and the Swatches panel (one builder, one set of words).
const TILE_KINDS = [['hex', 'Hex'], ['rgb', 'RGB'], ['hsb', 'HSB'], ['cmyk', 'CMYK'], ['oklch', 'OKLCH'], ['ral', 'Nearest RAL']];
function tilesInner() { return TILE_KINDS.map(([k, t]) => `<button type="button" class="org-tile" data-v="${k}"><span class="org-tile__label">${t}</span><span class="org-tile__value"></span>${k === 'ral' ? '<span class="org-tile__note"></span>' : ''}</button>`).join(''); }
function tilesHTML(id) { return `<div class="org-tiles" id="${id}" role="group" aria-label="Values">${tilesInner()}</div>`; }
ctrl('value-tiles').innerHTML = tilesInner();
function refreshTiles(hex, box) {
  const P = Organica.colorPicker, ral = P.nearestRal(hex);
  (box || ctrl('value-tiles')).querySelectorAll('.org-tile').forEach(t => {
    const k = t.dataset.v;
    const text = k === 'ral' ? (ral ? ral.code : '—') : P.valueText(hex, k);
    t.querySelector('.org-tile__value').textContent = text;
    if (k === 'ral') t.querySelector('.org-tile__note').textContent = ral ? ral.name : '';
    // OKLCH copies as CSS, ready for code: oklch(42% 0.15 312)
    t.dataset.copy = k === 'ral' ? (ral ? ral.code + ' ' + ral.name : '') : k === 'oklch' ? 'oklch(' + text.replace(/,/g, '') + ')' : text;
    if (!t.classList.contains('is-copied')) t.setAttribute('aria-label', 'Copy ' + t.querySelector('.org-tile__label').textContent + ' ' + t.dataset.copy);
  });
}
// The tiles show the selected tint, else the colour itself.
function refreshFieldEditor() {
  const hex = state.items[state.activeIndex].hex, tint = tintSel != null ? tokenScale(hex)[tintSel] : null;
  refreshTiles(tint ? tint.hex : hex);
}
// a tile copies its value; its name says "Copied" for a moment, then refresh() puts the values back
function bindTiles(box, refresh) {
  box.addEventListener('click', e => {
    const t = e.target.closest('.org-tile');
    if (!t || !t.dataset.copy || !navigator.clipboard) return;
    navigator.clipboard.writeText(t.dataset.copy).then(() => {
      t.classList.add('is-copied'); t.setAttribute('aria-label', 'Copied');
      setTimeout(() => { t.classList.remove('is-copied'); refresh(); }, 1200);
    }, () => {});
  });
}
function bindFieldEditor() { bindTiles(ctrl('value-tiles'), refreshFieldEditor); }

// ── STAGE — one scene list feeds the preview and every export (WYSIWYG) ──
// Top: one card per colour with its 0–900 scale beneath it. Then an example
// of the palette in use — the proportional bar (any N) or the figure (a house
// generated from a seed; 3 to 5 colours) — then the contrast grid. In the Gradient view the
// gradient comes first and there is no example.
const VB_W = 900, BAR_Y = 24, BAR_H = 44, BAR_X0 = 20, BAR_X1 = 880;
const CARD_MAX_W = 150, CARD_GAP = 14, CARD_COLOUR_H = 96, CARD_H = 134, CARD_R = 14, STEP_H = 20, STEP_GAP = 2;
const TUBE_H = 10, TUBE_ROW = 40;   // the share tube over each card, and the row it takes
const PAIR_W = 180, PAIR_H = 96, PAIR_MIN = 3, PAIR_MAX = 4;   // the contrast pairs: tile size, how many at least / at most

// The figure — the palette shown IN PROPORTION on a house generated from a seed
// (tunesutra/house.js, Nov 18, 2026: it replaces the Garment, the House and the
// 5-colour Scene). Each role covers exactly its share (HOUSE.SHARES, the Bar's
// weights); 3 and 4 colours draw the house alone, 5 a house in a landscape
// (background, ground, wall, roof, door). A palette keeps its house by keeping
// state.house; the carousel steps it. The view's stored id stays 'garment'.
const HOUSE = window.TUNESUTRA_HOUSE, FIG_H = 360;   // the house's height on the sheet (Diego, Nov 18, 2026: 360 — was 502.5)
const houseFig = FIG.houseFig;
function currentFigure() { return houseFig(state.house, count()); }
// A palette saved before the house (or a built-in one) gets a seed from its colours, so it keeps one house.
function seedOf(text) { let h = 2166136261; for (const ch of String(text)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h >>> 0) % 9999) + 1; }
function newSeed() { return 1 + Math.floor(Math.random() * 9999); }
function garmentFits(n) { return n >= 2 && n <= 9; }   // Nov 19, 2026: 6–7 (windows, a hill), then 2 (wall · roof), 8 (a far band), 9 (a path)
// A zone too pale to see on the paper gets a hairline, as the book draws it.
const paleOnPaper = FIG.paleOnPaper;
function isGarmentView() { return state.view === 'garment' && garmentFits(count()); }

// ── GRADIENT + SHADOW — the engine is shared/shading.js (Organica.shading), promoted Nov 20, 2026 at its
// second consumer (FVS) so a saved palette draws the same in every tool. TuneSutra passes its context:
// the palette's tints (the pool a shadow ink snaps to) and its own token scale (a moved colour keeps its
// column, scaleFrom). scripts/test-shading.mjs keeps the shared engine byte-identical to what was here.
const SH = Organica.shading;
function paletteTints() { return [].concat.apply([], state.items.map(it => tokenScale(it.hex).map(st => st.hex))); }
const TS_CTX = { tints: paletteTints, scale: hex => tokenScale(hex) };
const SHADE_MODES = SH.SHADE_MODES, SHADE_NAME = SH.SHADE_NAME;
function shadeDefs(hex) { return SH.defs(hex, TS_CTX); }
// A Shading's definition on a colour: a preset of the engine, or a Pollen preset's copied marks (Nov 22, 2026 —

// ── SYSTEM — archived Nov 18, 2026 (Diego: "il system per ora togliamolo ma teniamolo in un

// The sheet is always drawn in the light theme's colours, whatever the
// chrome theme (Organica.contentColor), and its text in the page's own font
// resolved to a literal family list so an exported file carries it.
function sheetTheme() {
  return {
    ink: Organica.contentColor('--ink'),
    mid: Organica.contentColor('--mid'),
    paper: Organica.contentColor('--paper'),
    panel: Organica.contentColor('--panel'),
    border: Organica.contentColor('--border'),

function readableOn(hex, T) { return C.contrast(hex, T.ink) >= C.contrast(hex, T.paper) ? T.ink : T.paper; }

// → { W, H, paper, font, items[] }. Items are plain data:
//   { t:'rect', x, y, w, h, fill, r?, stroke?, sw?, role?, title? }   (r = corner radius)
//   { t:'path', d, tf:{x,y,s}, fill, stroke?, sw?, role?, quiet?, title? }
//   { t:'text', x, y, s, size, fill, anchor }
// `role` marks a shape that selects a colour when clicked on screen.
// screen=true: the on-screen sheet — it also reserves room for the controls laid over it (the +

const DOCK_W = 280;   // the Colour section on the sheet, right of the Contrast pairs (sheet units)
let dockH = 200;      // its height, measured after each render (renderStage)
function buildScene(screen) {
  const T = sheetTheme(), n = count(), cols = colors(), items = [], removeAt = [];
  let addAt = null, dockAt = null;
  const rect = (x, y, w, h, fill, extra) => items.push(Object.assign({ t: 'rect', x: x, y: y, w: w, h: h, fill: fill }, extra));
  const text = (x, y, s, size, fill, anchor) => items.push({ t: 'text', x: x, y: y, s: String(s), size: size, fill: fill, anchor: anchor || 'start' });
  const weights = roleWeights(n);
  let houseBand = null, tubeY = null;
  const garment = isGarmentView();
  let y = BAR_Y;

  // An example of the palette in use: in proportion, or on a figure — first, above the
  // colour cards (Diego, Nov 17, 2026: "sposta la figura sopra e … i colori sotto").
  {
    const fig = currentFigure();
    // The house (3–5 colours; Diego, Nov 18, 2026: "elimina bar e figure … sempre … sotto
    // l'illustrazione della casa"), then the share tubes over the cards. 6–7 colours: tubes only.
    if (garment) {
      text(BAR_X0, y, paletteName() + ' — house no. ' + state.house, 11, T.mid);   // the palette's name where 'Example' was (Diego, Nov 18, 2026) — in the export too
      y += 12;
      houseBand = [y, y + FIG_H];   // where the carousel arrows sit (renderStage)
      // Same height for every figure; strokes are set in the figure's own units
      // so they come out the same weight on the sheet whatever its scale.
      const k = FIG_H / fig.h, fx = (VB_W - fig.w * k) / 2, shares = fig.shares, sheet = { x: fx, y: y, w: fig.w * k, h: FIG_H };
      houseSheet = sheet;   // a Wash over All the shapes: one wash over the whole house, cut by its shapes
      fig.zones.forEach((z, zi) => {
        const r = z.role, pale = n < 5 && paleOnPaper(cols[r]);   // 5 colours: the background frames the house
        // Fade to paper ends TRANSPARENT (Diego, Nov 18, 2026: "dovrebbe essere sul trasparente non bianco"): the
        // shape then has no solid fill under it — its inks are all drawn, the paper's share left empty.
        const def = z.bb && houseDef(r, zi), clear = !!def && fadesToPaper(def);

        // No outline between zones (Diego, Nov 17, 2026) — only a near-white zone keeps a hairline, or it vanishes on the paper.
        items.push(Object.assign({
          t: 'path', d: z.d, tf: { x: fx, y: y, s: k }, fill: clear ? 'none' : cols[r], hit: clear, zone: zi,
          role: r, quiet: true, title: `${dispName(r)}, shape ${zi + 1}, ${shares[r].toFixed(1)}% of the house, ${cols[r]}`,
        }, pale ? { stroke: T.border, sw: 1.125 / k } : null));

        }

        items.push({ t: 'path', d: sel.d, tf: { x: fx, y: y, s: k }, fill: 'none', stroke: T.ink, sw: 2 / k, dash: [6 / k, 4 / k], screenOnly: true });

    tubeY = y;

  // each card that colour's own 0–900 scale. Clicking a card selects it.

  cols.forEach((hex, i) => {

      d: `M${num(x)} ${y + CARD_COLOUR_H}V${y + r}Q${num(x)} ${y} ${num(x + r)} ${y}H${num(x + cw - r)}Q${num(x + cw)} ${y} ${num(x + cw)} ${y + r}V${y + CARD_COLOUR_H}Z`,
    });
    if (tubeY != null) {
      const w = weights[i];
      items.push({ t: 'text', x: x + cw, y: tubeY + 10, s: w.toFixed(1) + '%', size: 11, fill: T.ink, anchor: 'end', pourText: w });
      rect(x, tubeY + 16, cw, TUBE_H, T.panel, { r: TUBE_H / 2, title: `${dispName(i)}, ${w.toFixed(1)}% of the house` });   // the title on the track: the fill is 0 wide mid-pour
      rect(x, tubeY + 16, cw * w / 100, TUBE_H, hex, Object.assign({ r: TUBE_H / 2, pour: w }, paleOnPaper(hex) ? { stroke: T.border, sw: 1 } : null));
    }
    // every card can go while there are more than 3 (Diego, Nov 18, 2026); the button at its top-right corner, `box` its hover area
    if (n > COUNT_MIN) removeAt.push({ i: i, x: x + cw - 8, y: y + 8, box: [x, y, cw, CARD_H] });
    text(x + 12, y + CARD_COLOUR_H + 16, fit(dispName(i), cw - 24, 11), 11, T.ink);
    text(x + 12, y + CARD_COLOUR_H + 29, hex, 10, T.mid);

  const pairs = [];

  // The pairs take the left of the row; its right is the Colour section's (on screen), so the export
  // keeps the same places.
  const pairsX1 = BAR_X1 - DOCK_W - CARD_GAP;

  dockAt = [BAR_X1 - DOCK_W, y];   // the value tiles, level with the pairs
  {
    const k = best.length, pw = Math.min(PAIR_W, (pairsX1 - BAR_X0 - (k - 1) * CARD_GAP) / k), px0 = BAR_X0;
    best.forEach((p, m) => {
      const x = px0 + m * (pw + CARD_GAP), bg = cols[p.bg], fg = cols[p.fg];
      rect(x, y, pw, PAIR_H, bg, Object.assign({ r: CARD_R, title: `${dispName(p.fg)} on ${dispName(p.bg)} — ${p.r.toFixed(2)}:1, ${grade(p.r)}` }, paleOnPaper(bg) ? { stroke: T.border, sw: 1 } : null));
      text(x + 14, y + 40, 'Aa', 28, fg);
      text(x + 14, y + PAIR_H - 14, fit(dispName(p.fg), pw - 28, 11), 11, fg);
      text(x, y + PAIR_H + 16, fit(dispName(p.fg) + ' on ' + dispName(p.bg), pw, 10), 10, T.ink);
      text(x, y + PAIR_H + 30, p.r.toFixed(1) + ':1 · ' + grade(p.r), 10, T.mid);
    });
    y += PAIR_H + 30;
  }

  if (screen) y = Math.max(y, dockAt[1] + dockH);
  return { W: VB_W, H: y + 16, paper: T.paper, font: T.font, items: items, houseBand: houseBand, addAt: addAt, removeAt: removeAt, dockAt: dockAt };
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    }

    const first = ctrl('md-main').querySelector('[data-mood-pick]'); if (first) first.focus();
  } else if (more) {
    const k = more.dataset.mdMore; if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
    renderMoods(); const again = ctrl('md-main').querySelector(`[data-md-more="${CSS.escape(k)}"]`); if (again) again.focus();
  }
});
function renderHome() {
  const v = view, id = v.sub ? v.tab + '/' + v.sub : v.tab, split = id === 'explore/palettes' || id === 'make/colour' || id === 'make/image' || id === 'explore/swatches' || id === 'explore/moods';
  ctrl('home').classList.toggle('ts-home--split', split);
  if (id === 'explore/palettes') {   // built once per visit; a filter change redraws the results only
    if (!ctrl('ts-results')) { ctrl('home').innerHTML = exploreHTML(); mountExplore(); }
    else renderResults();
    return;
  }
  if (id === 'make/colour') {
    if (!ctrl('mk-results')) { ctrl('home').innerHTML = makeHTML(); mountMake(); }
    else renderMake();
    return;
  }
  if (id === 'explore/moods') {
    if (!ctrl('md-main')) { ctrl('home').innerHTML = moodsHTML(); mountMoods(); }
    else renderMoods();
    return;
  }
  if (id === 'explore/swatches') {
    if (!ctrl('sw-main')) { ctrl('home').innerHTML = swatchesHTML(); mountSwatches(); }
    else renderSwatches();
    return;
  }
  if (id === 'make/image') {
    if (!ctrl('mi-results')) { ctrl('home').innerHTML = makeImageHTML(); mountImage(); }
    else renderImage();
    return;
  }
  ctrl('home').innerHTML = navHTML(v) + yourPalettesHTML();   // Your palettes (every other view returned above)
}
// Star and Show work in place: the view redraws, the focus goes back to the control that was used.
ctrl('home').addEventListener('click', e => {
  const star = e.target.closest('.ts-card__star'), show = e.target.closest('[data-show]');
  if (star) {
    const key = star.dataset.key, card = star.closest('.ts-card'), name = card.querySelector('.ts-card__name').textContent;
    const ent = exploreAll().find(x => x.key === key) || {}, fav = favs()[key] || {};   // starred from the grid: the palette as it is
    const colors = ent.colors || fav.colors || card.querySelector('.ts-card__bars').dataset.colors.split(' ');
    toggleStar(key, { name, colors, house: ent.house != null ? ent.house : fav.house != null ? fav.house : (key.indexOf('m:') === 0 ? +key.split('~')[1] : undefined) });
    renderHome();
    const again = [...ctrl('home').querySelectorAll('.ts-card__star')].find(b => b.dataset.key === key);
    if (again) again.focus(); else { const s = ctrl('home').querySelector('[data-show].active'); if (s) s.focus(); }
  } else if (show) {
    homeShow = show.dataset.show;
    try { localStorage.setItem('organica.tunesutra.home-show', homeShow); } catch (err) {}
    renderHome();
    const again = ctrl('home').querySelector(`[data-show="${homeShow}"]`); if (again) again.focus();
  }
});
function showHome(home) {
  ctrl('home').hidden = !home;
  ctrl('app').hidden = !!(home);
  document.querySelector('.org-floatbar').hidden = !!(home);
}
function route() {
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
  if (h === 'learn') { location.replace('/design-system/colour/'); return; }
  let p = null, name = '', suggest = '', key = '';
  if (h === 'new') p = { colors: ['#ffffff', '#ffffff', '#ffffff'], house: newSeed() };   // a blank start: three white colours (Diego, Nov 17, 2026)
  else if (h.indexOf('p=') === 0) { name = h.slice(2); p = userPresets()[name]; key = 'p:' + name; }
  else if (h.indexOf('c=') === 0) {
    const parts = h.slice(2).split('/'), col = (window.TUNESUTRA_COLLECTIONS || []).find(c => c.id === parts[0]);
    const pal = col && col.palettes.find(x => x.id === parts[1]);
    if (pal) { p = { colors: pal.colors, names: pal.names, view: col.view, house: seedOf(col.id + '/' + pal.id) }; suggest = pal.name; key = 'c:' + col.id + '/' + pal.id; }
  }
  else if (h.indexOf('m=') === 0) {   // a palette from Make: #m=<hex>-<hex>…~<house>, in ROLE_PARTS order
    const [c, hs] = h.slice(2).split('~'), cols = (c || '').split('-').filter(x => /^[0-9a-f]{6}$/i.test(x)).map(x => '#' + x.toLowerCase());
    if (cols.length >= 2 && cols.length <= 9) { p = { colors: cols, parts: HT.ROLE_PARTS[cols.length], house: +hs || newSeed() }; key = 'm:' + h.slice(2); suggest = IMG_NAMES[h.slice(2)] || (favs()[key] && favs()[key].name) || makeName(cols, +hs || 0); }
  }
  else if (h.indexOf('l=') === 0) {   // a library palette: it may be on its way (the bundle loads once)
    const id = h.slice(2), e = LIB && LIB.find(x => x.id === id);
    if (e) { p = { colors: e.colors.slice(), parts: e.parts, house: e.house }; suggest = e.name; key = 'l:' + id; }
    else if (!LIB) { loadLibrary().then(() => { if (LIB && location.hash.indexOf('#l=') === 0) route(); }); }
  }
  if (!p || !Array.isArray(p.colors) || p.colors.length < 2) {
    if (h.indexOf('make') === 0 && h.indexOf('?') > 0) {   // Make variations: #make?k=<hex>&n=<count>
      const q = new URLSearchParams(h.slice(h.indexOf('?') + 1)), k = q.get('k'), n = +q.get('n');
      if (k && /^[0-9a-f]{6}$/i.test(k)) MK.key = '#' + k.toLowerCase();
      if (n >= 2 && n <= 9) MK.n = n;
      saveMake(); h = h.slice(0, h.indexOf('?'));
      history.replaceState(null, '', '#' + h);   // applied once: a reload keeps what was changed since
      if (ctrl('mk-results')) ctrl('home').innerHTML = '';   // rebuild the panel with the new key colour
    }
    view = VIEWS[h] || VIEWS.explore;   // no hash (a first visit) opens on Explore (Diego, Nov 20, 2026)
    backTo = { hash: VIEWS[h] ? h : 'explore', label: backLabel(view) };   // the editor's back button returns here
    showHome(true); renderHome(); return;
  }
  loadPaletteData(p);
  pourNext = true;
  undoStack.length = 0;
  lastUndo = { kind: '', t: 0 };
  initialSnap = snapshot();
  currentName = name; suggestedName = suggest; currentKey = key; setDirty(false);
  showHome(false);
  ctrl('panel').scrollTop = 0;
  ctrl('stage-wrap').scrollTop = 0;
  syncControls();
  commit(true);
  refreshTitle();
}
// Leaving with unsaved changes takes two clicks: the first one says so (on the control that was used).
function leaveTo(hash, labelEl, label) {
  if (dirty && Date.now() - leaveArmed > 4000) { leaveArmed = Date.now(); labelEl.textContent = 'Unsaved changes — click again to leave'; setTimeout(() => { labelEl.textContent = label; }, 4000); return; }
  setDirty(false);
  location.hash = hash;
}
// The back button names the view the palette was opened from, in the tabs' own words (Nov 20, 2026, CONSULT);
// a reload or a direct link has no origin and goes back to Explore › Palettes, TuneSutra's first view.
let backTo = { hash: 'explore', label: 'Palettes' };
function backLabel(v) {
  const sub = SUBS[v.tab] && SUBS[v.tab].find(x => x[0] === v.sub);
  return sub ? sub[2] : 'Your palettes';
}
function goHome() { leaveTo(backTo.hash, ctrl('btn-home-label'), backTo.label); }

// ── INIT ──
initGradient();
Organica.enhanceSliders(document);   // the Slosh fill on every slider, liquid switches, click-to-edit values
initHouseCarousel();
bindFieldEditor();
Organica.popover(ctrl('btn-export'), ctrl('export-popover'));

if (Organica.shadeMarks) Organica.shadeMarks.warm(7);   // Camo's simulations, ahead of the first pick
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if ([...document.querySelectorAll('[role=dialog], .org-popover')].some(d => d.offsetParent !== null)) return;   // Esc closes an open picker / popover first
  clearShapeSelection();
});
ctrl('stage-svg').addEventListener('click', e => { if (!e.target.closest('.bar-seg, .ts-tint')) clearShapeSelection(); });
Organica.shortcuts.add({ keys: '⌘Z', label: 'Undo', group: 'Edit' });
ctrl('btn-undo').addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;   // let a text field undo its own typing
  e.preventDefault();
  undo();
});

ctrl('btn-reset').addEventListener('click', resetPalette);
ctrl('btn-export-png').addEventListener('click', exportPNG);
ctrl('btn-export-svg').addEventListener('click', exportSVG);
ctrl('btn-export-css').addEventListener('click', exportCSS);
ctrl('btn-export-json').addEventListener('click', exportJSON);

ctrl('btn-save-open').addEventListener('click', beginSavePreset, true);   // capture: the name is filled before the popover opens and focuses it
savePopover = Organica.popover(ctrl('btn-save-open'), ctrl('save-popover'));
ctrl('btn-preset-delete').addEventListener('click', deletePreset);
ctrl('btn-preset-confirm').addEventListener('click', confirmSavePreset);
ctrl('txt-preset-name').addEventListener('input', syncSaveArm);
ctrl('txt-preset-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ctrl('btn-preset-confirm').click(); } });   // through the button, so "Replace?" still asks

ctrl('btn-home').addEventListener('click', goHome);
ctrl('btn-star').addEventListener('click', starCurrent);
ctrl('btn-variations').addEventListener('click', e => {   // Make, seeded with this palette's main colour and its count
  e.preventDefault();
  const main = state.items.find(it => it.part === 'main') || state.items[0];
  leaveTo('make?k=' + main.hex.slice(1) + '&n=' + count(), ctrl('btn-variations'), 'Make variations');
});   // seeded with this palette in step 6
window.addEventListener('hashchange', route);
syncControls();
commit(false);
route();
Organica.autoLabelPanel(document);

// Cloud sync (shared/store.js): auth.js auto-gates the page; here we just
// hydrate presets from Supabase and re-render the list whenever a pull /
// background flush lands.
// A palette opened by link may not be in this device's cache yet: once the
// pull lands, try the route again if we fell back to the library.
const onLibrary = () => !ctrl('home').hidden;
PRESETS.pull().then(() => { if (onLibrary()) route(); });
PRESETS.onSync(() => { if (onLibrary()) renderHome(); });
FAVS.pull().then(() => { if (onLibrary()) renderHome(); else refreshEditorStar(); });
FAVS.onSync(() => { if (onLibrary()) renderHome(); else refreshEditorStar(); });
</script>
