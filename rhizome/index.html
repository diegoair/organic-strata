<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhizome — Organica</title>

<!-- Tokens → header → floatbar → panel, in this order (load-bearing —
     UI-SHELL.md §2/§4b/§4c). core.js + kiwi.min.js are plain
     scripts, loaded before this tool's own <script type="module">, so
     Organica.* and the global `kiwi` (needed by loom/js/constraint-
     engine.js's solveTracksKiwi) both exist at import time. -->
<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/panel.css">
<link rel="stylesheet" href="/shared/floatbar.css">
<link rel="stylesheet" href="/shared/mobile-gate.css">
<script src="/shared/vendor/supabase-js.min.js"></script>
<script src="/shared/core.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/supabase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/auth-badge.js"></script>
<script src="/shared/store.js"></script>

<script src="/shared/motion.js"></script>
<script src="/shared/vendor/kiwi.min.js"></script>
<style>
  :root {
    /* color-scheme:light + the surface palette are shared defaults in
       tokens.css now. Rhizome keeps its own node-graph shell. */
    --tool: #7a9c5e;   /* identity colour — rhizome green, unclaimed hue
                          between FVS's emerald and Komorebi's olive */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--fs-base); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  #app { display: flex; flex: 1; overflow: hidden; height: calc(100vh - var(--header-h, 40px)); }

  #canvas-wrap {
    flex: 1; position: relative; overflow: hidden; cursor: grab;
    background: var(--canvas-grid), var(--canvas-bg);   /* the shared canvas dot grid (tokens.css) */
  }
  #graph { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  #wire-layer { position: absolute; top: 0; left: 0; width: 4000px; height: 4000px; overflow: visible; pointer-events: none; }
  .rz-wire { fill: none; stroke: var(--tool); stroke-width: 2; }
  .rz-wire--pending { stroke-dasharray: 4 4; opacity: .7; }

  .rz-node {
    position: absolute; width: 240px;
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 4px 16px rgba(0,0,0,.18); user-select: none; z-index: 2;
  }
  .rz-node.is-selected { outline: 2px solid var(--tool); outline-offset: 1px; }
  .rz-node.is-multi-selected { outline: 2px dashed var(--tool); outline-offset: 1px; }
  /* Selected wire must contrast with an unselected one, which is --tool.
     --accent-warm is the system's "this one is highlighted" colour (it is
     also the slider fill). Was #c93ed6 — TuneSutra's identity hue, copy-pasted. */
  .rz-wire.is-selected { stroke: var(--accent-warm); stroke-width: 3; }
  #marquee-rect { fill: rgba(122,156,94,.12); stroke: var(--tool); stroke-width: 1; stroke-dasharray: 3 3; display: none; }
  .rz-node__header {
    padding: var(--space-3) var(--space-4); cursor: grab; font-weight: var(--w-medium);
    background: color-mix(in srgb, var(--tool) 12%, var(--panel)); border-bottom: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; font-size: var(--fs-small);
  }
  .rz-node__ports { padding: var(--space-2) 0; }
  .rz-port-row { display: flex; align-items: center; gap: var(--space-2); padding: 2px var(--space-4); font-size: var(--fs-small); color: var(--mid); position: relative; }
  .rz-port-row--in { justify-content: flex-start; }
  .rz-port-row--out { justify-content: flex-end; }
  .rz-port-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--mid); flex-shrink: 0; cursor: crosshair; }
  .rz-node__preview {
    margin: var(--space-2) var(--space-4); min-height: 60px; max-height: 100px;
    border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--paper);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: var(--fs-small); color: var(--mid);
  }
  .rz-node__preview svg { width: 100%; height: 100%; }
  .rz-node__empty { opacity: .4; }
  .rz-node__status { padding: 0 var(--space-4) var(--space-2); font-size: var(--fs-small); color: var(--danger); }
  .rz-node__status:empty { display: none; }

  #add-node-menu .org-popover { min-width: 180px; }
  #add-node-menu .org-formats { flex-direction: column; }
  #add-node-menu .org-btn { justify-content: flex-start; }
</style>
<script src="/shared/pattern-init.js"></script>
</head>
<body>
<div class="mobile-gate"><p>Organica is designed for desktop. Please open this link on a laptop or desktop browser for the full experience.</p></div>

<header class="org-header" role="banner">
  <button type="button" class="org-header__nav" aria-label="All tools" aria-controls="org-mega"><menu-icon state="menu" size="20" line-cap="square"></menu-icon></button>
  <a class="org-header__logo" href="/"><span class="org-header__mark" aria-hidden="true"></span><b>Organica</b><span>/ Rhizome</span></a>
  <div class="org-header__spacer"></div>
</header>

<div class="org-floatbar" role="toolbar" aria-label="Actions">
  <div class="org-popover-wrap" id="add-node-menu">
    <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-add-node" aria-label="Add node">
      <svg class="ico" data-icon="plus" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <svg class="ico chev" data-icon="chevron-down" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div class="org-popover" id="add-node-popover" aria-label="Node types">
      <div class="org-popover__title">Add node</div>
      <div class="org-formats" id="add-node-list"></div>
    </div>
  </div>
  <div class="org-floatbar__sep"></div>
  <button class="org-floatbar__btn" id="btn-undo" aria-label="Undo (Cmd/Ctrl+Z)">
    <svg class="ico" data-icon="undo" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M3 6h6.5a3.5 3.5 0 0 1 0 7H6"/></svg>
  </button>
  <button class="org-floatbar__btn" id="btn-redo" aria-label="Redo (Cmd/Ctrl+Shift+Z)">
    <svg class="ico" data-icon="redo" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l3 3-3 3"/><path d="M13 6H6.5a3.5 3.5 0 0 0 0 7H10"/></svg>
  </button>
  <div class="org-floatbar__sep"></div>
  <button class="org-floatbar__btn" id="btn-delete-selected" aria-label="Delete selected (Del)">
    <svg class="ico" data-icon="trash" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/><path d="M6.7 7v4M9.3 7v4"/></svg>
  </button>
  <div class="org-floatbar__sep"></div>
  <div class="org-popover-wrap">
    <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-graph-menu" aria-label="Graph">
      <span style="font-size:var(--fs-small)">Graph</span>
    </button>
    <div class="org-popover" id="graph-popover" aria-label="Graph options">
      <div class="org-popover__title">Preset</div>
      <select class="panel-select" id="sel-preset" aria-label="Preset"></select>
      <!-- Inline name field, not window.prompt() — a bare prompt() throws
           "prompt() is not supported" in some embedding contexts (found
           and fixed the same way in FVS, Aug 25 session), and every
           Organica tool with a preset-name field already uses this
           inline-row pattern rather than a native dialog. -->
      <div class="ctrl-row" style="margin-top:var(--space-2)">
        <input type="text" class="panel-select" id="txt-preset-name" placeholder="Name this graph" aria-label="Name this graph" style="flex:1">
      </div>
      <div class="row-btns" style="margin-top:var(--space-2)">
        <button class="mini-btn" id="btn-save-preset">Save</button>
        <button class="mini-btn" id="btn-delete-preset" data-armed="Confirm?">Delete</button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <div id="canvas-wrap">
    <div id="graph">
      <svg id="wire-layer"><rect id="marquee-rect" x="0" y="0" width="0" height="0"></rect></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>
  <div id="panel"></div>
</div>

<script type="module" src="/rhizome/js/main.js"></script>
<script src="/shared/tools.js"></script>
<script src="/shared/menu-icon.js"></script>
<script src="/shared/header.js"></script>
</body>
</html>
