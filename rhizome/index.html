<!DOCTYPE html>
<html lang="en" data-theme-support>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhizome — Organica</title>

<!-- Tokens → header → floatbar → panel, in this order (load-bearing —
     UI-SHELL.md §2/§4b/§4c). core.js + kiwi.min.js are plain
     scripts, loaded before this tool's own <script type="module">, so
     Organica.* and the global `kiwi` (needed by loom/js/constraint-
     engine.js's solveTracksKiwi) both exist at import time. -->
<link rel="preload" href="/shared/vendor/space-grotesk-variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/icons.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/panel.css">
<link rel="stylesheet" href="/shared/floatbar.css">
<link rel="stylesheet" href="/shared/node-canvas.css">
<link rel="stylesheet" href="/shared/mobile-gate.css">
<script src="/shared/vendor/supabase-js.min.js"></script>
<script src="/shared/core.js"></script>
<script src="/shared/node-canvas.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/supabase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/auth-badge.js"></script>
<script src="/shared/store.js"></script>

<script src="/shared/motion.js"></script>
<script src="/shared/vendor/kiwi.min.js"></script>
<style>
  :root {
    --tool: #7a9c5e;   /* identity colour — rhizome green, unclaimed hue between FVS's emerald and Komorebi's olive */
  }
  /* The board, cards, ports, wires, node bar and node search are shared/node-canvas.css. Rhizome adds: */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--fs-base); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  #app { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  /* Rhizome's port types on the seven port colours (ledger O-34): SVG → content, Image → figure, Grid → grid,
     Color → palette, Number → rule, Points → composition */
  .nc-port__dot[data-type="svg"] { --port-c: var(--port-content); }     .nc-wire--svg { --wire-c: var(--port-content); }
  .nc-port__dot[data-type="image"] { --port-c: var(--port-figure); }    .nc-wire--image { --wire-c: var(--port-figure); }
  .nc-port__dot[data-type="color"] { --port-c: var(--port-palette); }   .nc-wire--color { --wire-c: var(--port-palette); }
  .nc-port__dot[data-type="number"] { --port-c: var(--port-rule); }     .nc-wire--number { --wire-c: var(--port-rule); }
  .nc-port__dot[data-type="points"] { --port-c: var(--port-composition); } .nc-wire--points { --wire-c: var(--port-composition); }
  /* the card body: a preview of the node's output, a light work surface in both themes */
  .rz-preview { display: flex; align-items: center; justify-content: center; min-height: 3rem; max-height: 8rem; overflow: hidden; background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .rz-preview img { display: block; max-width: 100%; max-height: 8rem; object-fit: contain; }
  .rz-preview__caption { padding: var(--space-2); font-size: var(--t-caption-size); color: var(--mid); }
  .rz-graph-pop { width: 18rem; }
  .rz-graph-btn__label { font-family: var(--font-display); font-size: var(--t-control-size); }
  .rz-graph-btn__chev { display: inline-flex; }
  #btn-rz-graph.is-unsaved .rz-graph-btn__label::after { content: ''; display: inline-block; width: var(--space-1); height: var(--space-1); margin-left: var(--space-1); border-radius: 50%; background: var(--mid); vertical-align: middle; }
</style>
<script src="/shared/pattern-init.js"></script>
</head>
<body>
<div class="mobile-gate"><p>Organica is designed for desktop. Please open this link on a laptop or desktop browser for the full experience.</p></div>

<header class="org-header" role="banner">
  <button type="button" class="org-header__nav" aria-label="All tools" aria-controls="org-mega"><menu-icon state="menu" size="20" line-cap="square"></menu-icon></button>
  <a class="org-header__logo" href="/"><span class="org-header__mark" aria-hidden="true"></span><b>Organica</b><span>/ Rhizome</span></a>
  <div class="org-header__spacer"></div>
</header>

<div class="org-floatbar" role="toolbar" aria-label="Actions">
  <span class="org-floatbar__group" role="group" aria-label="Graph">
    <span class="org-popover-wrap">
      <button class="org-floatbar__btn org-floatbar__btn--wide" id="btn-rz-graph" aria-label="Graph"><span class="rz-graph-btn__label">Graph</span><span class="rz-graph-btn__chev" data-icon-slot></span></button>
      <div class="org-popover rz-graph-pop" id="rz-graph-popover" aria-label="Graph">
        <div class="org-popover__title">Graph</div>
        <div class="ctrl-row"><span class="ctrl-label">Saved graphs</span><select class="panel-select" id="rz-graph-saved" aria-label="Saved graphs"></select></div>
        <div class="ctrl-row"><span class="ctrl-label">Graph name</span><input type="text" class="panel-input" id="rz-graph-name" aria-label="Graph name" autocomplete="off"></div>
        <div class="row-btns"><button type="button" class="mini-btn" id="rz-graph-save">Save</button><button type="button" class="mini-btn" id="rz-graph-delete" data-armed="Delete — click again to confirm">Delete</button></div>
        <div class="row-btns"><button type="button" class="mini-btn" id="rz-graph-new">New graph</button><button type="button" class="mini-btn" id="rz-graph-open">Open file…</button><button type="button" class="mini-btn" id="rz-graph-file">Save as file</button></div>
        <input type="file" id="rz-graph-input" accept=".json,application/json" aria-label="Open a graph file" class="org-file-input">
      </div>
    </span>
  </span>
  <span class="org-floatbar__sep" aria-hidden="true"></span>
  <span class="org-floatbar__group" role="group" aria-label="History">
    <button class="org-floatbar__btn" id="btn-undo" aria-label="Undo" aria-keyshortcuts="Meta+Z Control+Z" disabled data-icon-slot></button>
    <button class="org-floatbar__btn" id="btn-redo" aria-label="Redo" aria-keyshortcuts="Meta+Shift+Z Control+Shift+Z" disabled data-icon-slot></button>
  </span>
  <span class="org-floatbar__sep" aria-hidden="true"></span>
  <span class="org-floatbar__group" role="group" aria-label="Edit">
    <button class="org-floatbar__btn" id="btn-delete-selected" aria-label="Delete" aria-keyshortcuts="Delete Backspace" data-icon-slot></button>
    <span class="nc-sr" id="rz-delete-why"></span>
  </span>
  <span class="org-floatbar__sep" aria-hidden="true"></span>
  <span class="org-floatbar__group" role="group" aria-label="View">
    <button class="org-floatbar__btn" id="btn-fit" aria-label="Fit all" aria-keyshortcuts="Shift+1" data-icon-slot></button>
    <button class="org-floatbar__btn" id="btn-fit-sel" aria-label="Fit selection" aria-keyshortcuts="Shift+2" data-icon-slot></button>
  </span>
</div>

<div id="rz-nodebar-dock" class="org-dock" role="group" aria-label="Nodes">
  <div class="org-floatbar org-dock__bar" id="rz-nodebar" role="toolbar" aria-label="Nodes" aria-orientation="vertical">
    <button class="org-floatbar__btn" data-cat="Source" aria-label="Source nodes" aria-expanded="false" aria-controls="rz-nodebar-panel" data-icon-slot></button>
    <button class="org-floatbar__btn" data-cat="Process" aria-label="Process nodes" aria-expanded="false" aria-controls="rz-nodebar-panel" data-icon-slot></button>
    <button class="org-floatbar__btn" data-cat="Output" aria-label="Output nodes" aria-expanded="false" aria-controls="rz-nodebar-panel" data-icon-slot></button>
  </div>
  <div class="org-floatbar org-dock__panel nc-nodebar__panel" id="rz-nodebar-panel" role="region" aria-label="Source" inert></div>
</div>

<div id="app">
  <div id="canvas-wrap"></div>
  <div id="panel"></div>
</div>

<script type="module" src="/rhizome/js/main.js"></script>
<script src="/shared/tools.js"></script>
<script src="/shared/menu-icon.js"></script>
<script src="/shared/header.js"></script>
</body>
</html>
