<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loom — regression test</title>
<!--
  Phase 6's "tests" item, in a codebase with zero build step and zero
  existing test framework (vanilla HTML/CSS/JS throughout Organica, per
  CLAUDE.md's own tech-stack table) — a plain page that imports the real
  generator modules directly and exercises every one of them, rather
  than a framework this project has no other use for. Formalises the
  same regression sweep that's been run by hand from the browser
  console every session Loom shipped a change (see CLAUDE.md's own
  session notes) into something that runs itself and reports clearly.

  Three checks per generator, run at its own registry.js defaults:
  1. generate() doesn't throw
  2. cells.length > 0
  3. rect-cellShape generators only: tracks sum to the exact inner
     size (width minus gaps for cols, height minus gaps for rows) —
     the same invariant every rect generator's own header already
     documents ("no leftover unaccounted space"), checked here
     automatically instead of by hand.
  Polygon-cellShape generators have no equivalent track-sum invariant
  (arbitrary point lists, not a linear track lattice), so only 1/2
  apply to them — disclosed in the report, not silently skipped.

  Needs a local server, same as the rest of the tool — the `/shared/`
  script tags below are absolute paths and Bento/Modular/Noise genuinely
  depend on them (Kiwi's solver, Organica.noise.fbm), so file:// won't
  resolve them. Any static server rooted at the repo (the same one
  `docs/UI-SHELL.md`/CLAUDE.md's own dev notes already describe) works:
  open http://localhost:<port>/loom/_test-regression.html.
-->
<style>
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, 'SF Mono', Menlo, monospace; background: #141210; color: #e8e4dc; padding: 32px; font-size: 13px; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #948c7c; margin-bottom: 24px; }
  table { border-collapse: collapse; width: 100%; max-width: 780px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a2620; }
  th { color: #948c7c; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .pass { color: #7bc47f; }
  .fail { color: #e05c5c; font-weight: 600; }
  .skip { color: #948c7c; }
  #summary { margin-top: 20px; font-size: 14px; }
  #summary.ok { color: #7bc47f; }
  #summary.bad { color: #e05c5c; }
</style>
</head>
<body>
<h1>Loom — generator regression test</h1>
<p class="sub">Runs every registered generator at its own default params against a fixed 1000×1000 inner rect. No build step — needs a local static server (same as the tool itself), not file://.</p>
<table id="results">
  <thead><tr><th>Generator</th><th>generate()</th><th>Cells</th><th>Track sum</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="summary"></div>

<!-- Same load order as index.html: core → noise → kiwi (classic globals)
     before the ES module that reads them unqualified — Bento/Modular's
     own `kiwi.Solver()` and Noise's own `Organica.noise.fbm` both throw
     ReferenceError without this, a real first version of this test
     caught it immediately (3 of 21 "failing" — actually a missing-script
     gap in the harness itself, not a generator bug, confirmed by the
     exact error text: "kiwi is not defined" / "Organica is not
     defined", not any assertion this file makes). -->
<script src="/shared/core.js"></script>
<script src="/shared/noise.js"></script>
<script src="/shared/vendor/kiwi.min.js"></script>
<script type="module">
import { GENERATORS } from './js/generators/registry.js';

const inner = { x: 0, y: 0, width: 1000, height: 1000 };
const EPS = 0.01;

function trackSumCheck(grid) {
  if (grid.cellShape === 'polygon') return { status: 'skip', detail: 'polygon — no track lattice' };
  const { cols, rows } = grid.tracks;
  const colSum = cols.reduce((a, b) => a + b, 0) + grid.gap * (cols.length - 1);
  const rowSum = rows.reduce((a, b) => a + b, 0) + grid.gap * (rows.length - 1);
  const colOk = Math.abs(colSum - inner.width) < EPS;
  const rowOk = Math.abs(rowSum - inner.height) < EPS;
  return {
    status: colOk && rowOk ? 'pass' : 'fail',
    detail: `cols=${colSum.toFixed(2)}/${inner.width}  rows=${rowSum.toFixed(2)}/${inner.height}`,
  };
}

const rowsEl = document.getElementById('rows');
let passCount = 0, failCount = 0;

for (const [type, g] of Object.entries(GENERATORS)) {
  const tr = document.createElement('tr');
  let genStatus = 'pass', genDetail = 'ok', cellCount = 0, trackResult = { status: 'skip', detail: '—' };

  try {
    const { grid, cells } = g.generate(g.defaults, inner);
    cellCount = cells.length;
    if (cellCount === 0) { genStatus = 'fail'; genDetail = 'zero cells'; }
    trackResult = trackSumCheck(grid);
  } catch (e) {
    genStatus = 'fail';
    genDetail = e.message;
  }

  const overallFail = genStatus === 'fail' || trackResult.status === 'fail';
  if (overallFail) failCount++; else passCount++;

  tr.innerHTML = `
    <td>${g.label} <span class="skip">(${type})</span></td>
    <td class="${genStatus}">${genStatus === 'pass' ? 'ok' : genDetail}</td>
    <td class="${cellCount > 0 ? 'pass' : 'fail'}">${cellCount}</td>
    <td class="${trackResult.status}">${trackResult.detail}</td>
  `;
  rowsEl.appendChild(tr);
}

const summary = document.getElementById('summary');
summary.className = failCount === 0 ? 'ok' : 'bad';
summary.textContent = failCount === 0
  ? `All ${passCount} generators passed.`
  : `${failCount} of ${passCount + failCount} generators FAILED — see table above.`;
</script>
</body>
</html>
