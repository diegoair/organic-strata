<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flexible Visual System regression</title>
<link rel="stylesheet" href="/shared/tokens.css">
<style>
  /* Dev-only page (underscore prefix, like _test-scanline-relief.html): loads
     /fvs/ in a hidden frame, runs a fixed battery of builds inside it, hashes
     every SVG and diffs the hashes against fvs/_regression-baseline.json.
     Open it on the dev server and press Run. Record → paste the printed JSON
     into fvs/_regression-baseline.json when a change is intentional. */
  body { margin: var(--space-6); font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper); }
  h1 { font-size: var(--fs-large); margin: 0 0 var(--space-4); }
  button { font: inherit; padding: var(--space-2) var(--space-4); border: 1px solid var(--border-strong); background: var(--panel); color: var(--ink); cursor: pointer; margin-right: var(--space-2); }
  #summary { margin: var(--space-4) 0; font-size: var(--fs-medium); }
  .ok { color: var(--tool, var(--ink)); }
  .bad { color: var(--danger); }
  table { border-collapse: collapse; margin-top: var(--space-3); }
  td, th { text-align: left; padding: var(--space-1) var(--space-4) var(--space-1) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-small); }
  textarea { width: 100%; height: 160px; margin-top: var(--space-4); font-size: var(--fs-small); }
  iframe { position: absolute; left: -9999px; width: 1200px; height: 900px; }
</style>
</head>
<body>
<h1>Flexible Visual System regression</h1>
<button id="run">Run</button><button id="record">Show JSON to record</button>
<div id="summary">Press Run.</div>
<table id="rows"></table>
<textarea id="json" readonly hidden aria-label="Recorded results"></textarea>
<iframe id="frame" src="/fvs/" title="Flexible Visual System under test"></iframe>

<script>
// Executed INSIDE the Flexible Visual System page (via eval in the frame, inside `with (window.__fvs)`), so its
// bare names resolve to the tool's module exports — fvs/js/test-surface.js puts every one on window.__fvs.
async function battery() {
  await loadFigureTestRunners();   // the Figure tier (lazy.js) + the old runners this battery replays — Figure loads on demand (fvs/js/lazy.js); the battery checks it like every other tier
  const H = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); };
  // <metadata> carries a timestamp and the last-selected rule name (module state) — neither is geometry.
  // …and the per-drawing suffix of a stack's clip/mask ids (stk<hash>-<seq>-<layer>), which depends on render order
  const norm = s => s.replace(/"exportedAt":"[^"]*"/g, '"exportedAt":""').replace(/"ruleSource":"[^"]*"/g, '"ruleSource":""').replace(/(stk[0-9a-z]+)-[0-9a-z]+-(\d+)/g, '$1-$2').replace(/-d[0-9a-z]+(?=["')])/g, '');
  const out = {};
  const put = (k, v) => { out[k] = typeof v === 'string' && v.length > 40 ? H(norm(v)) : String(v); };
  const chg = (id, v) => { const e = ctrl(id); e.value = v; e.dispatchEvent(new Event('change', { bubbles: true })); };
  const inp = (id, v) => { const e = ctrl(id); e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); };
  const reset = () => {
    if (state.layers) { state.layers = null; renderLayersUI(); }
    state.colors = ['#000000']; state.colorRule = { ...DEFAULT_COLOR_RULE }; state.paperColor = '#ffffff';
    syncColorRuleUI(); buildPalette();
    chg('sel-element-fillmode', 'fill'); setComponentGrid('square2x2');
  };

  // The cases below were recorded with "Clip to cell" on, which was the default until the toggles moved to the
  // floatbar (a new grid now starts unclipped). They still test the clipped drawing — the harder path — so the
  // battery pins it: every grid it loads, directly or through the page's own code, comes back clipped. The
  // default itself is the last case (symbol:clip:default), on the page's real loadSymbolGrid.
  afterLoadSymbolGrid = m => { state.symbolClipEnabled = true; syncSymbolViewUI(); };   // rt hook, called by loadSymbolGrid itself

  // 1 — every Seed type at its defaults
  reset();
  // controls the battery itself edits later — start every run from the page defaults
  // Figure history is capped at 50 steps: a second run in the same page found it full,
  // so a new step dropped the oldest and the history-length checks read 0. Start empty,
  // and with no current recipe (entering the Figure tab re-applies it — a leftover one
  // made the next identical step a no-op in the history).
  figureHistory.stack.length = 0; figureHistory.idx = -1;
  state.figureRecipe = null;
  chg('sel-rule-chk-rota', '0'); chg('sel-rule-chk-rot', '90');
  ctrl('chk-rule-chk-swap').checked = false; ctrl('chk-rule-chk-flip').checked = false;
  chg('sel-color-rule', 'index'); chg('sel-color-offset', '0');
  Object.keys(SEED_TYPES).forEach(t => {
    if (t === 'freehand' || t === 'custom') return;
    if (!ctrl('sel-seed-type').querySelector(`option[value="${t}"]`)) return;
    chg('sel-seed-type', t);
    chg('sel-element-fillmode', 'fill');   // Segment auto-switches Style to Stroke — pin it so every run sees the same thing
    put('seed:' + t, buildSeedPreviewSVG(getSeed(), 0, false, false, 100));
  });

  // 2 — Component rules, Arc quarter-disc, 2×2
  chg('sel-seed-type', 'arc'); chg('sel-element-fillmode', 'fill'); inp('rg-thickness', 100);
  ['identity', 'pinwheel', 'mirror', 'diagonal', 'checkerboard', 'rowmirror', 'columnmirror', 'radial'].forEach(mode => {
    chg('sel-rule', mode); generate();
    state.components.forEach(c => {
      const g = getGrid();
      put(`rule:${mode}:${c.id}`, buildComponentSVG(buildComponentItems(c, g), getSeed(), frameSize(g)));
    });
  });
  // 3 — Checkerboard on a 3×3
  setComponentGrid('square3x3'); chg('sel-rule', 'checkerboard'); generate();
  put('rule3x3:checkerboard', state.components.map(c => c.cells.map(x => x.rotation + (x.flipH ? 'h' : '') + (x.flipV ? 'v' : '')).join(',')).join('|'));

  // 4 — colour rules on a 3×3 with three inks
  chg('sel-rule', 'identity'); generate();
  state.colors = ['#e8321e', '#0a9a3e', '#1e5be8']; buildPalette();
  Object.keys(COLOR_RULES).forEach(m => [0, 1].forEach(off => {
    state.colorRule = { mode: m, offset: off };
    const it = buildComponentItems(state.components[0], getGrid());
    put(`colour:${m}:${off}`, it.map(x => x.color).join(','));
  }));
  reset();

  // 5 — Symbol Square 5×5 + Checkerboard rule (default, Rotate A/B, Swap)
  setTier('symbol');
  loadSymbolGrid(squareLoomModel(5, 5));
  state.symbolCells = state.symbolCells.map(c => ({ ...c, source: 'seed', seedType: 'arc', rotation: 0, fitMode: 'fill', color: null }));
  chg('sel-symbol-fill', 'rule'); chg('sel-symbol-rule', 'checkerboard');
  const rot = () => { applySymbolRule({ resetAll: true }); return state.symbolCells.map(c => c.rotation).join(','); };
  put('symbol:checker:default', rot());
  chg('sel-rule-chk-rota', '180'); chg('sel-rule-chk-rot', '0'); put('symbol:checker:A180B0', rot());
  ctrl('chk-rule-chk-swap').checked = true; put('symbol:checker:swap', rot());
  put('symbol:svg', buildSymbolSVG());

  // 6 — Grid tiling (internal now, no page — used by Figure/legacy recipes):
  // Alternate flip is a true checkerboard
  const runR = id => runBuiltinRecipe(BUILTIN_RECIPES.find(r => r.id === id));
  runR('leaf-wave'); state.fvsGridConfig.altFlip = true;
  ['square2x2', 'square3x3', 'square4x4'].forEach(t => {
    state.fvsGridConfig.type = t;
    const n = +t.slice(6, 7);
    const d = new DOMParser().parseFromString(buildFvsGridSVG(), 'image/svg+xml');
    const f = [...d.documentElement.children].filter(e => e.tagName === 'g').map(e => /scale\(-1,1\)/.test(e.getAttribute('transform')) ? 1 : 0);
    const rows = []; for (let r = 0; r < n; r++) rows.push(f.slice(r * n, r * n + n).join(''));
    put('altflip:' + t, rows.join('/'));
  });
  state.fvsGridConfig.altFlip = false;

  // 7 — built-in recipes (whole chain)
  BUILTIN_RECIPES.forEach(r => { runR(r.id); put('recipe:' + r.id, tierSVG()); });

  // 8 — variants and plates on the two-ink recipe
  runR('leaf-two-ink');
  put('variant:fill', renderVariant({ style: 'fill', ink: '#0a9a3e', strokeW: 4, paper: null }, false));
  put('variant:stroke', renderVariant({ style: 'stroke', ink: '#e8321e', strokeW: 5, paper: '#fff3c0' }, false));
  const svg = tierSVG(), cs = state.colors.slice();
  cs.forEach((c, i) => put('plate:' + i, plateSVG(svg, cs, i, state.paperColor)));

  // 9 — hygiene: auto tiles hidden, colour spelling, non-square Print
  runR('leaf-wave');
  put('lib:auto-hidden', Object.keys(LIBRARY.read()).some(k => k.startsWith('Tile · ')) && !libraryNames(LIBRARY.read()).some(k => k.startsWith('Tile · ')));
  put('hexKey', [hexKey('#ABC'), hexKey('#A1b2C3'), hexKey(' #fFf ')].join(','));
  put('plate:shorthex', plateSVG('<svg viewBox="0 0 10 10"><path fill="#F00" d="M0 0"/><path fill="#0f0" d="M1 1"/></svg>', ['#ff0000', '#00ff00'], 0, '#fff'));
  put('recolour:shorthex', recolourSVG('<svg><rect fill="#FFF"/><path fill="#123456"/></svg>', '#e8321e', '#ffffff'));
  const P0 = { ...printSizePanel };
  Object.assign(printSizePanel, { getMode: () => 'print', getUnit: () => 'mm', getSize: () => ({ width: 100, height: 100 }), getDpi: () => 300, getBleed: () => 3 });
  try {
    const ns = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><rect width="400" height="200" fill="#ffffff"/></svg>';
    const w = printWrapSVG(ns, '#ffffff', true);
    put('print:nonsquare:svg', w);
    put('print:nonsquare:dims', w.match(/width="([^"]+)" height="([^"]+)"/).slice(1).join('x'));
    const d = printComponentDims(400, 200);
    put('print:nonsquare:px', [d.outW, d.outH, d.trimHmm].join('x'));
    const sq = printComponentDims(400, 400);
    put('print:square:px', [sq.outW, sq.outH, sq.trimHmm].join('x'));
  } finally { Object.assign(printSizePanel, P0); }

  // 10 — named rules on 3×3 and 4×4 (rotation/flip signature per candidate)
  chg('sel-seed-type', 'arc'); inp('rg-thickness', 100);
  ['square3x3', 'square4x4'].forEach(gt => {
    setComponentGrid(gt);
    ['pinwheel', 'mirror', 'diagonal', 'checkerboard', 'rowmirror', 'columnmirror', 'radial'].forEach(mode => {
      const opt = ctrl('sel-rule').querySelector(`option[value="${mode}"]`);
      if (opt.disabled) { put(`rulenm:${gt}:${mode}`, 'disabled'); return; }
      chg('sel-rule', mode); generate();
      put(`rulenm:${gt}:${mode}`, state.components.map(c => c.cells.map(x => x.rotation + (x.flipH ? 'h' : '') + (x.flipV ? 'v' : '')).join(',')).join('|'));
    });
  });
  chg('sel-rule', 'identity'); setComponentGrid('square2x2');

  // 10b — rule-engine audit (Sep 25, 2026): canonical states (H+V ≡ 180°), a
  // 4-cell Loom row is not a 2×2, hex lattice binning, Random/Exhaustive on any grid
  {
    const axes0 = ['rotation', 'flip', 'scale'].map(a => ctrl('chk-axis-' + a).checked);
    const setAxes = (r, f, sc) => { ctrl('chk-axis-rotation').checked = r; ctrl('chk-axis-flip').checked = f; ctrl('chk-axis-scale').checked = sc; };
    const useLoom = g => { state.loomGrid = Organica.loadLoomGrid(g); syncComponentGridUI(); syncRuleAvailability(); renderGallery(); };   // a legacy Component grid (the Loom import left the Component UI)
    const rectLoom = (cols, rows) => JSON.stringify({ version: '1.0', canvas: { width: cols * 200, height: rows * 200, unit: 'px', margin: 0, marginTop: 0, marginRight: 0, marginBottom: 0, marginLeft: 0, bleed: 0, safeArea: 0 },
      grid: { type: 'rectangular', params: { cols, rows }, gap: 0, padding: 0, tracks: { cols: Array(cols).fill(200), rows: Array(rows).fill(200) } },
      cells: Array.from({ length: cols * rows }, (_, i) => ({ id: 'c' + i, col: i % cols, row: Math.floor(i / cols), colSpan: 1, rowSpan: 1, number: i + 1 })) });
    put('engine:canon', [canonicalState(stateFrom(0, true, true, 1)) === canonicalState(stateFrom(180, false, false, 1)),
      dedupeComponents([{ cells: [stateFrom(90, true, true, 1)] }, { cells: [stateFrom(270, false, false, 1)] }]).length].join(','));
    put('engine:checker:distinct', ruleCheckerboard().length);
    useLoom(rectLoom(4, 1));
    put('engine:4x1', [isCanonical2x2(), radialEligible(), ctrl('sel-rule').querySelector('option[value="rowmirror"]').disabled,
      rulePinwheel()[0].cells.map(c => c.rotation).join('.')].join(','));
    useLoom(rectLoom(2, 2));
    put('engine:loom2x2:canonical', isCanonical2x2());
    useLoom(JSON.stringify(SYMBOL_GRID_PRESETS.hexagonal));
    const hc = resolveGridCells(getGrid()), maxA = Math.max(...hc.map(c => c.cellW * c.cellH));
    put('engine:hex:checker', new Set(ruleCheckerboard()[0].cells.filter((c, i) => hc[i].cellW * hc[i].cellH >= maxA * 0.5).map(canonicalState)).size);
    setComponentGrid('square3x3');
    setAxes(true, false, false); put('engine:3x3:ex:R', ruleExhaustive().length);
    setAxes(true, true, false); put('engine:3x3:ex:RF', ruleExhaustive().length);
    setAxes(true, false, false); inp('rg-random-count', 16); inp('num-seed', 7);
    const rnd = ruleRandom();
    put('engine:3x3:random', [rnd.length, new Set(rnd.map(c => componentKey(c.cells))).size, H(rnd.map(c => componentKey(c.cells)).join('|'))].join(','));
    setComponentGrid('square4x4');
    put('engine:4x4:radial:ids', ruleRadial().length + ':' + ruleRadial().filter(c => c.id.includes('tiled')).length);
    put('engine:4x4:mirror:book', ruleMirror().filter(c => c.id.startsWith('mirror-book')).length);
    chg('sel-seed-type', 'circle'); chg('sel-rule', 'pinwheel'); generate();
    // nothing is hidden for looking alike: a Circle still lists all 8 Pinwheels, no status note
    put('engine:nohide:circle', state.components.length + ':' + (ctrl('gallery-status').textContent === ''));
    // a named rule implies the axis it needs: Mirror with Flip OFF still lists its family (not Identity)
    setComponentGrid('square2x2'); setAxes(true, false, false); chg('sel-rule', 'mirror'); generate();
    put('engine:mirror:flipOff', state.components.length + ':' + state.components.every(c => c.ruleSource === 'mirror'));
    setComponentGrid('square4x4');
    chg('sel-seed-type', 'arc'); inp('rg-thickness', 100);
    setAxes(...axes0); inp('num-seed', 1); chg('sel-rule', 'identity'); setComponentGrid('square2x2');
  }

  // 10c — Component grids are columns × rows, 1–4 each (Sep 25, 2026); Loom is Symbol-only
  {
    const disabled = () => [...ctrl('sel-rule').options].filter(o => o.disabled).map(o => o.value).join('/');
    const counts = () => ['pinwheel', 'mirror', 'checkerboard', 'exhaustive'].filter(m => !ctrl('sel-rule').querySelector(`option[value="${m}"]`).disabled)
      .map(m => { chg('sel-rule', m); generate(); return m[0] + state.components.length; }).join('');
    [[1, 1], [2, 3], [3, 4], [4, 1]].forEach(([c, r]) => {
      setComponentGrid({ cols: c, rows: r });
      put(`comp:rect:${c}x${r}`, [activeCellCount(), disabled(), counts()].join('|'));
    });
    setComponentGrid({ cols: 3, rows: 4 }); chg('sel-rule', 'mirror'); generate();
    put('comp:rect:3x4:svg', buildComponentSVG(buildComponentItems(state.components[0], getGrid()), getSeed(), frameSize(getGrid())));
    put('comp:rect:frame', [frameSize(getGrid()), JSON.stringify(frameDims(getGrid()))].join('|'));
    const legacyGrid = { kind: 'loom', cellShape: 'rect', cells: Organica.loadLoomGrid(JSON.stringify(SYMBOL_GRID_PRESETS.bento)).cells, width: 1080, height: 1080 };
    setComponentGrid(legacyGrid);
    put('comp:legacy', [activeCellCount(), ctrl('grid-legacy-hint').style.display !== 'none'].join(','));
    setComponentGrid('square2x2');
    put('comp:legacy:cleared', [state.loomGrid === null, ctrl('grid-legacy-hint').style.display === 'none'].join(','));
    chg('sel-rule', 'identity');
  }

  // 10d — Symbol Canvas + grids generated inside it (Loom's own generators)
  {
    const prevGrid = state.symbolGrid, prevCells = state.symbolCells;
    chg('sel-symcanvas-preset', 'A4 portrait');
    const cv = readSymbolCanvas();
    put('symcanvas:a4', [cv.mode, cv.unit, cv.W, cv.H, cv.dpi, cv.bleed].join(','));
    for (const id of Object.keys(SYMGRID_GENS)) {
      const m = await symbolGridModel(id, {}, cv);
      put('symgrid:gen:' + id, m.cells.length + ':' + H(JSON.stringify(m.cells)));
    }
    loadSymbolGrid(await symbolGridModel('bento', { cols: 3, rows: 4, variety: 0.4, seed: 3 }, cv));
    const F = symbolFrame(getSymbolGrid());
    put('symcanvas:frame', [F.w, F.h].join('x'));
    put('symcanvas:svg', buildSymbolSVG());
    put('symcanvas:print', buildSymbolPrintSVG(F, cv).slice(0, 120));
    const d = symbolPrintDims(F, cv);
    put('symcanvas:printpx', [d.trimWpx, d.trimHpx, d.bleedPx].join('x'));
    const tile = renderedSymbolEntrySVG(buildSymbolLibraryEntry());
    put('symcanvas:tile', [Math.round(tile.size), tile.inner.startsWith('<g transform="translate(')].join(','));
    // drag a column / row border of a Rectangular grid: tracks trade size, weights follow, cells kept
    loadSymbolGrid(await symbolGridModel('rectangular', { colWeights: '1,1,1,1', rowWeights: '1,1,1' }, { ...cv, mode: 'screen', unit: 'px', pw: 1080, ph: 1080, W: 1080, H: 1080, margin: 5 }));
    state.symbolCells[0].locked = true;
    const g0 = state.symbolGrid, b0 = trackBorders('cols')[0];
    moveTrackBorder('cols', 0, b0 + 100); moveTrackBorder('rows', 1, trackBorders('rows')[1] - 60);
    moveTrackBorder('cols', 2, 99999);   // clamped: the last column keeps its 4% minimum
    put('symgrid:drag', [state.symbolGrid.grid.tracks.cols.map(Math.round).join('/'), state.symbolGrid.grid.params.colWeights, state.symbolGrid.grid.params.rowWeights,
      state.symbolCells.length, state.symbolCells[0].locked, state.symbolGrid.canvas.fvsFrame.params.colWeights === state.symbolGrid.grid.params.colWeights,
      !buildSymbolSVG().includes('sym-track'), g0 !== state.symbolGrid].join(','));
    chg('sel-symcanvas-preset', 'Square 1:1');
    state.symbolGrid = prevGrid; state.symbolCells = prevCells;
  }

  // 10e — Symbol from saved Components: palette, Arrange, Suggest (edge continuity, balance, surprise)
  {
    const prevGrid = state.symbolGrid, prevCells = state.symbolCells, prevPal = state.symbolPool;
    const lib = LIBRARY.read();
    setTier('component'); chg('sel-seed-type', 'arc'); inp('rg-thickness', 30);
    setComponentGrid({ cols: 1, rows: 1 }); chg('sel-rule', 'identity'); generate(); lib['zz-t-arc'] = buildLibraryEntryFor(state.components[0]);
    setComponentGrid('square2x2'); chg('sel-rule', 'radial'); generate(); lib['zz-t-ring'] = buildLibraryEntryFor(state.components[0]);
    chg('sel-rule', 'checkerboard'); generate(); lib['zz-t-wave'] = buildLibraryEntryFor(state.components[0]);
    ['zz-t-arc', 'zz-t-ring', 'zz-t-wave'].forEach(n => { lib[n].savedAt = '2000-01-01T00:00:00.000Z'; });   // stable analysis cache key
    LIBRARY.write(lib);
    inp('rg-thickness', 100); chg('sel-rule', 'identity');
    const an = analyseComponent('zz-t-arc');
    // Coarse on purpose: a per-cell hash of a rasterised mask flips with the platform's anti-aliasing
    // (Linux CI Chrome vs macOS). Size + per-quadrant coverage still catches an empty/inverted/shifted mask.
    const q = [0, 0, 0, 0], qn = [0, 0, 0, 0];
    Array.from(an.cov).forEach((v, i) => { const k = (Math.floor(i / an.GW) >= an.GH / 2 ? 2 : 0) + ((i % an.GW) >= an.GW / 2 ? 1 : 0); q[k] += v ? 1 : 0; qn[k]++; });
    put('suggest:analysis', [an.GW, an.GH, an.density.toFixed(1), ...q.map((c, k) => (c / qn[k]).toFixed(1))].join(','));
    state.symbolPool = [{ name: 'zz-t-arc', weight: 2 }, { name: 'zz-t-ring', weight: 1 }, { name: 'zz-t-wave', weight: 1 }];
    const cv = { ...readSymbolCanvas(), mode: 'screen', unit: 'px', pw: 1080, ph: 1080, W: 1080, H: 1080, margin: 5 };
    loadSymbolGrid(await symbolGridModel('rectangular', { colWeights: '1,1,1,1,1,1', rowWeights: '1,1,1,1,1,1' }, cv));
    const pal = poolEntries();
    put('arrange:rules', Object.keys(SYMBOL_ARRANGE).map(id => id + ':' + H(arrangeCells(getSymbolGrid(), state.symbolCells, pal, id, 3, 'fill').map(c => c.componentName[5]).join(''))).join(','));
    const sug = suggestSymbols({ seed: 5, weights: { cont: 0.6, bal: 0.3, sur: 0.3 }, fit: 'fill' });
    const keyOf = sg => sg.cells.map(c => c.componentName + canonicalState(c)).join('|');
    put('suggest:rect', [sug.length, new Set(sug.map(keyOf)).size, sug[0].label, sug[0].score.match.toFixed(2), H(sug.map(keyOf).join('/'))].join(','));
    put('suggest:det', keyOf(suggestSymbols({ seed: 5, weights: { cont: 0.6, bal: 0.3, sur: 0.3 }, fit: 'fill' })[0]) === keyOf(sug[0]));
    state.symbolCells = sug[0].cells.map(c => ({ ...c }));
    state.symbolCells[0].locked = true; state.symbolCells[7].locked = true;
    const l0 = JSON.stringify(state.symbolCells[0]), l7 = JSON.stringify(state.symbolCells[7]);
    const sugL = suggestSymbols({ seed: 9, weights: { cont: 0.6, bal: 0.3, sur: 0.3 }, fit: 'fill' });
    put('suggest:lock', sugL.every(sg => JSON.stringify(sg.cells[0]) === l0 && JSON.stringify(sg.cells[7]) === l7));
    const base = candFromCells(state.symbolCells);
    const more = suggestSymbols({ seed: 2, base, weights: { cont: 0.6, bal: 0.3, sur: 0.3 }, fit: 'fill' });
    const changed = more.map(sg => sg.cells.filter((c, i) => c.componentName !== state.symbolCells[i].componentName || c.rotation !== state.symbolCells[i].rotation || c.flipH !== state.symbolCells[i].flipH).length);
    put('suggest:more', [more.length > 0, Math.max(...changed) < state.symbolCells.length / 2, more.every(sg => JSON.stringify(sg.cells[0]) === l0)].join(','));
    state.symbolCells.forEach(c => { c.locked = false; });
    // colour on a shared edge: the same ink > two distinct inks > two inks too close to tell apart;
    // without a colour table it is the plain ink/paper score; one ink = no Colour score at all
    {
      const fake = pl => ({ pal: pl, share: pl.map(() => 0.5) });
      const A = fake(['#ffffff', '#e8321e']), B = fake(['#ffffff', '#e8321e']), Cb = fake(['#ffffff', '#1e5be8']), D = fake(['#ffffff', '#d4301c']);
      const T = suggestColourTable({ A, B, Cb, D });
      const one = [1, 1, 1, 1];
      put('suggest:colour:edge', [pairScore(one, one, A, B, T).s, pairScore(one, one, A, Cb, T).s, pairScore(one, one, A, D, T).s, pairScore(one, one).s].map(v => v.toFixed(2)).join(','));

    inp('rg-seg-spaceX', 14); inp('rg-seg-spaceY', 14);
    put('segment:tile:svg', buildSeedPreviewSVG(getSeed(), 0, false, false, 100));
    inp('rg-seg-rays', 4); ctrl('ck-seg-round').checked = true; ctrl('ck-seg-round').dispatchEvent(new Event('change'));
    put('segment:rays:inCanvas', segBox());
    const legacy = { ...getSeed() }; delete legacy.segWeight; delete legacy.segRound;
    put('segment:legacyIsBar', / Z/.test(SEED_TYPES.segment.geometry(legacy).d));
    chg('sel-seed-type', 'circle');
    put('segment:leaveRestoresCaps', ctrl('ck-element-rounded').checked);
    // as a second layer, an untouched new layer (Scale 0.6) gets the full canvas; a hand-set one keeps its placement
    addLayer(); chg('sel-seed-type', 'segment');
    const auto = state.layers.items[1].place.scale;
    addLayer(); inp('rg-layer-scale', 0.5); chg('sel-seed-type', 'segment');
    selectLayer(1); chg('sel-seed-type', 'triangle');
    put('segment:layerFullCanvas', auto + ',' + state.layers.items[2].place.scale + ',' + state.layers.items[1].place.scale);   // leaving Segment gives 0.6 back
  } finally {
    ctrl('ck-seg-round').checked = false;
    [['rg-seg-len', 70], ['rg-seg-spaceX', 14], ['rg-seg-spaceY', 14], ['rg-seg-repeatX', 1], ['rg-seg-repeatY', 1], ['rg-seg-rays', 1]].forEach(([id, v]) => inp(id, v));
    reset();
  }

  // 25b — layer-ink colour variants: every candidate × every Fill layer's ink choice
  try {
    reset();
    chg('sel-seed-type', 'triangle');
    state.colors = ['#111111', '#e8321e', '#1f5fd6']; buildPalette();
    chg('sel-rule', 'pinwheel'); generate();
    put('layers:inks:single', state.components.length + ':' + state.components.every(c => !c.layerInks));
    addLayer();   // 2 fill layers, 3 inks → (3+1)² = 16 combos
    chg('sel-rule', 'pinwheel'); generate();
    const n25b = state.components.length;
    put('layers:inks:pinwheel', n25b + ':' + new Set(state.components.map(c => c.id)).size);
    put('layers:inks:firstIsLive', JSON.stringify(state.components[0].layerInks) === JSON.stringify(currentLayerInks()));
    const thumbs25b = [...document.querySelectorAll('#gallery .fvs-thumb')].slice(0, 16).map(b => norm(b.innerHTML));
    put('layers:inks:distinct16', new Set(thumbs25b).size);
    put('layers:inks:thumb:first', thumbs25b[0]);
    put('layers:inks:thumb:last', thumbs25b[15]);
    // saving a variant that is NOT selected bakes its own inks into the entry
    const v25b = state.components[7], e25b = buildLibraryEntryFor(v25b);
    put('layers:inks:save', e25b.seed.layers.every(l => v25b.layerInks[l.id] === l.ink));
    // picking a variant makes its inks the Element's own
    document.querySelectorAll('#gallery .fvs-thumb')[5].click();
    put('layers:inks:adopt', state.layers.items.every(l => l.ink === state.components[5].layerInks[l.id]));
    // the toggle: off → geometry only, even with a stack
    ctrl('chk-layer-inks').checked = false; generate();
    put('layers:inks:toggleOff', state.components.length + ':' + state.components.every(c => !c.layerInks));
    ctrl('chk-layer-inks').checked = true;
    // over the cap: 3 layers × Exhaustive → first 512 shown, the real total reported
    addLayer(); chg('sel-rule', 'exhaustive'); generate();
    put('layers:inks:cap', state.components.length + ':' + ctrl('gallery-status').textContent.startsWith('Showing 512 of'));
  } finally { chg('sel-rule', 'identity'); reset(); }

  // 24 — Component tier auto-default starter gallery
  try {
    reset();
    state.components = []; state.selectedId = null; state.componentAutoGenerated = null; state.componentAutoGenSignature = null;
    setComponentGrid('square2x2');
    setTier('element'); setTier('component');   // a fresh tier entry with nothing generated yet this "session"
    put('auto:populates-on-entry', [state.components.length, state.componentAutoGenerated].join(','));
    put('auto:rulesRun', [...new Set(state.components.map(c => c.ruleSource))].sort().join(','));   // checkerboard,mirror,pinwheel,radial on an eligible 2×2

    // regenerates while the flag is true and the Element changes
    const beforeIds = state.components.map(c => c.id).join(',');
    chg('sel-seed-type', 'star');
    put('auto:regeneratesOnElementChange', [state.componentAutoGenerated, componentElementSignature() === state.componentAutoGenSignature].join(','));

    // locks after an explicit Generate, and further Element changes no longer touch it
    chg('sel-rule', 'identity'); generate();
    const afterGenerateIds = state.components.map(c => c.id).join(',');
    chg('sel-seed-type', 'circle');
    put('auto:generateLocksIt', [state.componentAutoGenerated, state.components.map(c => c.id).join(',') === afterGenerateIds].join(','));

    // locks after Manual
    chg('sel-rule', 'manual'); generate();
    put('auto:manualLocksIt', state.componentAutoGenerated === false);

    // locks after Clear, AND stays blank on a later tier re-entry (does not silently re-populate)
    clearGallery();
    setTier('element'); setTier('component');
    put('auto:clearStaysBlank', [state.components.length, state.componentAutoGenerated].join(','));

    // locks after loading a saved Library entry
    chg('sel-rule', 'identity'); generate();
    const lib24 = LIBRARY.read();
    lib24['zz-auto-load'] = buildLibraryEntry();
    LIBRARY.write(lib24);
    state.componentAutoGenerated = true;   // simulate "still live" right before the load, to prove the load itself is what flips it
    applyLibraryEntryToUI(lib24['zz-auto-load']);
    put('auto:loadLocksIt', state.componentAutoGenerated === false);
    delete lib24['zz-auto-load']; LIBRARY.write(lib24);

    // a grid resize while still live rebuilds at the new cell count instead of going blank or stale
    state.components = []; state.selectedId = null; state.componentAutoGenerated = null; state.componentAutoGenSignature = null;
    setTier('element'); setTier('component');
    const cellsBefore = state.components[0].cells.length;
    setComponentGrid('square3x3');
    put('auto:gridResizeRegenerates', [state.components.length > 0, state.components[0].cells.length !== cellsBefore, state.componentAutoGenerated].join(','));

    // undo restores the auto-generated flag/signature, not just the components
    state.components = []; state.selectedId = null; state.componentAutoGenerated = null; state.componentAutoGenSignature = null;
    setComponentGrid('square2x2');
    setTier('element'); setTier('component');
    const beforeGenAuto = state.componentAutoGenerated;
    chg('sel-rule', 'identity'); generate();
    undoComponents();
    put('auto:undoRestoresFlag', [beforeGenAuto, state.componentAutoGenerated].join(','));
  } finally {
    state.components = []; state.selectedId = null; state.componentAutoGenerated = null; state.componentAutoGenSignature = null;
    setTier('component'); reset(); setComponentGrid('square2x2');
  }

  // Symbol → Figure bridge: a sealed symbol level (Loom grid + cells + inline Components + palette)
  {
    const BR = 'ZZ regression bridge', prevSeed = ctrl('sel-seed-type').value;
    try {
      reset(); chg('sel-seed-type', 'triangle');
      const all = LIBRARY.read();
      all[BR] = buildLibraryEntryFor({ id: 'bridge', ruleSource: 'recipe', cells: componentCellsFromRule('checkerboard', { a: 180, b: 0 }) });
      LIBRARY.write(all);
      const cv = { ...readSymbolCanvas(), mode: 'screen', unit: 'px', pw: 1080, ph: 720, W: 1080, H: 720, margin: 5 };
      loadSymbolGrid(await symbolGridModel('rectangular', { colWeights: '1,2,1', rowWeights: '1,1' }, cv));
      state.symbolCells.forEach((c, i) => {
        if (i % 3 === 0) { c.source = 'component'; c.componentName = BR; }
        else if (i % 3 === 1) { c.source = 'seed'; c.seedType = 'triangle'; c.rotation = 90; }
        else c.source = 'empty';
      });
      state.colors = ['#e8321e', '#1e5be8', '#0a9a3e']; state.colorRule = { ...DEFAULT_COLOR_RULE, mode: 'checker' }; state.paperColor = '#fff4d6';
      syncColorRuleUI(); buildPalette(); renderSymbol();
      const symSVG = buildSymbolSVG();
      const level = symbolLevelFromLiveState();
      put('bridge:level', [level.lattice.type, level.cells.length, Object.keys(level.componentEntries || {}).join('|'), level.colors.join('|'), level.paperColor].join(','));
      const el = { type: 'triangle', colors: ['#000000'], paper: '#ffffff' };   // the level's own palette must win over the Element's
      const def = { tool: 'fvs-recipe', version: 2, element: el, levels: [level] };
      const s0 = runFigureRecipe(def, { keepTier: true });
      put('bridge:symbol', s0);
      put('bridge:same', norm(s0) === norm(symSVG));
      put('bridge:colors', state.colors.join('|') + ',' + state.paperColor);
      // portable: the Component comes back from the recipe; never overwrites one of the same name
      const lib0 = LIBRARY.read(); delete lib0[BR]; LIBRARY.write(lib0);
      put('bridge:portable', [norm(runFigureRecipe(def, { keepTier: true })) === norm(symSVG), !!LIBRARY.read()[BR]].join(','));
      const lib1 = LIBRARY.read(); lib1[BR] = { ...lib1[BR], paperColor: '#123456' }; LIBRARY.write(lib1);
      runFigureRecipe(def, { keepTier: true });
      put('bridge:nooverwrite', LIBRARY.read()[BR].paperColor);
      // tiled and mirrored on top
      const def2 = { ...def, levels: [level, { kind: 'grid', lattice: { type: 'square', n: 2 }, cellSize: 110 }], transform: { mirror: 'v' } };
      put('bridge:grid:mirror', runFigureRecipe(JSON.parse(JSON.stringify(def2)), { keepTier: true }));
      // sealed: no Rules, no painting, no mutations of its layout
      put('bridge:sealed', [fgSymbol(def) === null, JSON.stringify(paintCell(def, { index: 0, parity: 'even' }, state.symbolCells[0], 'toggle', false)) === JSON.stringify(def)].join(','));
      let bad = ''; try { runFigureRecipe({ ...def, levels: [{ ...level, cells: level.cells.slice(1) }] }, { keepTier: true }); } catch (e) { bad = e.message; }
      put('bridge:invalid', bad);
    } finally {
      const l = LIBRARY.read(); delete l[BR]; LIBRARY.write(l);
      state.figureRecipe = null; state.figureStep = null;
      setTier('component'); reset(); chg('sel-seed-type', prevSeed);
    }
  }

  // tidy the throw-away tiles the recipes wrote into the Component library
  const lib = LIBRARY.read(); Object.keys(lib).filter(k => k.startsWith('Tile · recipe-')).forEach(k => delete lib[k]); LIBRARY.write(lib);
  reset();
  // the default of a new grid: unclipped, and the drawing carries no clip path
  afterLoadSymbolGrid = null;
  setTier('symbol'); loadSymbolGrid(squareLoomModel(2, 2));
  put('symbol:clip:default', [state.symbolClipEnabled, /<clipPath/.test(buildSymbolSVG()), JSON.stringify(state.symbolView)].join(','));
  setTier('component');

  // Divide into parts (Oct 10, 2026): every Division of the four straight-edged shapes, one ink per part — the
  // drawing, and that the parts add up to the shape; a count change keeps the inks by key.
  reset();
  state.colors = ['#e8321e', '#0a9a3e', '#1e5be8', '#f2b300']; buildPalette();
  const partArea = d => { const sc = splitPaperScope(), p = importAsPaperShape(sc, d, null); const a = Math.abs(p.area); p.remove(); return a; };
  for (const [t, extra] of [['roundedrect', {}], ['polygon', { polySides: 6, polyBase: 0 }], ['polygon', { polySides: 8 }], ['triangle', {}], ['star', {}], ['star', { starTipRound: 40, starCurve: 30 }]]) {
    chg('sel-seed-type', t);
    const src = { ...panelSeedSnapshot(), ...extra };
    for (const m of partMethodsFor(src)) {
      if (m.reason) { put(`parts:${t}:${JSON.stringify(extra)}:${m.id}`, m.reason); continue; }
      const r = divideLayers(src, m.id, m.count ? m.count[2] : 0, readLookControls());
      r.layers.items.forEach((l, k) => { l.ink = k % state.colors.length; });
      const sd = { type: 'stack', active: 0, layers: r.layers.items, parts: r.layers.parts };
      const res = partsOf(r.layers.parts), whole = SEED_TYPES[t].geometry(src);
      const sum = res.list.reduce((a, p) => a + partArea(p.geo.d), 0), A = Math.abs((() => { const sc = splitPaperScope(), p = importAsPaperShape(sc, whole.d, whole.fillRule); const a = p.area; p.remove(); return a; })());
      put(`parts:${t}:${JSON.stringify(extra)}:${m.id}`, buildSeedPreviewSVG(sd, 0, false, false, 100));
      put(`parts:${t}:${JSON.stringify(extra)}:${m.id}:sum`, [res.list.length, Math.abs(sum - A) / A < 0.005].join(','));
    }
  }
  {
    chg('sel-seed-type', 'star');
    const src = { ...panelSeedSnapshot(), starPoints: 5 };
    const L = divideLayers(src, 'tips', 0, readLookControls()).layers;
    L.items.forEach((l, k) => { l.ink = k % 4; });
    L.parts.source = { ...src, starPoints: 7 }; syncPartLayers(L);
    const seven = L.items.map(l => l.part + ':' + l.ink).join(',');
    L.parts.source = { ...src, starPoints: 5 }; syncPartLayers(L);
    put('parts:keys:5-7-5', seven + ' | ' + L.items.map(l => l.part + ':' + l.ink).join(','));
  }
  reset();
  return out;
}

const $ = id => document.getElementById(id);
const frame = $('frame');
let last = null, baseline = null;

async function loadBaseline() {
  try { const r = await fetch('/fvs/_regression-baseline.json', { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}
async function run() {
  $('summary').textContent = 'Running…';
  const w = frame.contentWindow;
  if (!w || !w.eval || !w.document || w.document.readyState !== 'complete' || !(w.__fvs && w.__fvs.isReady)) { $('summary').textContent = 'Flexible Visual System is still loading — try again in a second.'; return; }
  try { last = await w.eval('with (window.__fvs) { (' + battery.toString() + ')() }'); }
  catch (e) { $('summary').innerHTML = '<span class="bad">Battery threw: ' + e.message + '</span>'; return; }
  baseline = await loadBaseline();
  const keys = Object.keys(last);
  let bad = 0, rows = '<tr><th>case</th><th>now</th><th>baseline</th></tr>';
  keys.forEach(k => {
    const b = baseline ? baseline[k] : undefined, ok = b === undefined ? null : b === last[k];
    if (ok === false) bad++;
    rows += `<tr><td>${k}</td><td class="${ok === false ? 'bad' : ''}">${last[k]}</td><td>${b === undefined ? '—' : b}</td></tr>`;
  });
  const missing = baseline ? Object.keys(baseline).filter(k => !(k in last)) : [];
  $('rows').innerHTML = rows;
  $('summary').innerHTML = baseline
    ? (bad || missing.length ? `<span class="bad">${bad} changed, ${missing.length} missing of ${keys.length} cases</span>` : `<span class="ok">All ${keys.length} cases match the baseline.</span>`)
    : `${keys.length} cases run — no baseline yet (fvs/_regression-baseline.json).`;
}
$('run').addEventListener('click', run);
// Headless mode (scripts/regression.sh): /fvs/_test-regression.html?auto=1 runs on load and
// exposes the verdict as <body data-result="pass|fail|error" data-detail="...">.
if (new URLSearchParams(location.search).has('auto')) {
  const go = async () => {
    const up = () => { const w = frame.contentWindow; return w && w.document && w.document.readyState === 'complete' && w.__fvs && w.__fvs.isReady; };
    for (let i = 0; i < 100 && !up(); i++) await new Promise(r => setTimeout(r, 200));
    await new Promise(r => setTimeout(r, 1500)); // let Flexible Visual System boot (library pull, first render)
    await run();
    const t = $('summary').textContent;
    document.body.dataset.detail = t;
    if (last && baseline) document.body.dataset.changed = Object.keys(last).filter(k => k in baseline && baseline[k] !== last[k]).concat(Object.keys(baseline).filter(k => !(k in last)).map(k => k + '(missing)')).join(', ');
    document.body.dataset.result = /All \d+ cases match/.test(t) ? 'pass' : (/changed|missing|threw|loading|no baseline/.test(t) ? 'fail' : 'error');
  };
  go();
}
$('record').addEventListener('click', () => {
  if (!last) { $('summary').textContent = 'Run first.'; return; }
  const t = $('json'); t.hidden = false; t.value = JSON.stringify(last, null, 2); t.select();
});
</script>
