<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FVS regression</title>
<link rel="stylesheet" href="/shared/tokens.css">
<style>
  /* Dev-only page (underscore prefix, like _test-scanline-relief.html): loads
     /fvs/ in a hidden frame, runs a fixed battery of builds inside it, hashes
     every SVG and diffs the hashes against fvs/_regression-baseline.json.
     Open it on the dev server and press Run. Record → paste the printed JSON
     into fvs/_regression-baseline.json when a change is intentional. */
  body { margin: var(--space-6); font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper); }
  h1 { font-size: var(--fs-large); margin: 0 0 var(--space-4); }
  button { font: inherit; padding: var(--space-2) var(--space-4); border: 1px solid var(--border-strong); background: var(--panel); color: var(--ink); cursor: pointer; margin-right: var(--space-2); }
  #summary { margin: var(--space-4) 0; font-size: var(--fs-medium); }
  .ok { color: var(--tool, var(--ink)); }
  .bad { color: var(--danger); }
  table { border-collapse: collapse; margin-top: var(--space-3); }
  td, th { text-align: left; padding: var(--space-1) var(--space-4) var(--space-1) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-small); }
  textarea { width: 100%; height: 160px; margin-top: var(--space-4); font-size: var(--fs-small); }
  iframe { position: absolute; left: -9999px; width: 1200px; height: 900px; }
</style>
</head>
<body>
<h1>FVS regression</h1>
<button id="run">Run</button><button id="record">Show JSON to record</button>
<div id="summary">Press Run.</div>
<table id="rows"></table>
<textarea id="json" readonly hidden aria-label="Recorded results"></textarea>
<iframe id="frame" src="/fvs/" title="FVS under test"></iframe>

<script>
// Executed INSIDE the FVS page (via eval in the frame), so it sees its globals.
async function battery() {
  const H = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); };
  // <metadata> carries a timestamp and the last-selected rule name (module state) — neither is geometry.
  const norm = s => s.replace(/"exportedAt":"[^"]*"/g, '"exportedAt":""').replace(/"ruleSource":"[^"]*"/g, '"ruleSource":""');
  const out = {};
  const put = (k, v) => { out[k] = typeof v === 'string' && v.length > 40 ? H(norm(v)) : String(v); };
  const chg = (id, v) => { const e = ctrl(id); e.value = v; e.dispatchEvent(new Event('change', { bubbles: true })); };
  const inp = (id, v) => { const e = ctrl(id); e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); };
  const reset = () => {
    state.colors = ['#000000']; state.colorRule = { ...DEFAULT_COLOR_RULE }; state.paperColor = '#ffffff';
    syncColorRuleUI(); buildPalette();
    chg('sel-element-fillmode', 'fill'); chg('sel-grid-type', 'square2x2');
  };

  // 1 — every Seed type at its defaults
  reset();
  // controls the battery itself edits later — start every run from the page defaults
  chg('sel-rule-chk-rota', '0'); chg('sel-rule-chk-rot', '90');
  ctrl('chk-rule-chk-swap').checked = false; ctrl('chk-rule-chk-flip').checked = false;
  chg('sel-color-rule', 'index'); chg('sel-color-offset', '0');
  Object.keys(SEED_TYPES).forEach(t => {
    if (t === 'freehand' || t === 'custom') return;
    if (!ctrl('sel-seed-type').querySelector(`option[value="${t}"]`)) return;
    chg('sel-seed-type', t);
    chg('sel-element-fillmode', 'fill');   // Segment auto-switches Style to Stroke — pin it so every run sees the same thing
    put('seed:' + t, buildSeedPreviewSVG(getSeed(), 0, false, false, 100));
  });

  // 2 — Component rules, Arc quarter-disc, 2×2
  chg('sel-seed-type', 'arc'); chg('sel-element-fillmode', 'fill'); inp('rg-thickness', 100);
  ['identity', 'pinwheel', 'mirror', 'diagonal', 'checkerboard', 'rowmirror', 'columnmirror', 'radial'].forEach(mode => {
    chg('sel-rule', mode); generate();
    state.components.forEach(c => {
      const g = getGrid();
      put(`rule:${mode}:${c.id}`, buildComponentSVG(buildComponentItems(c, g), getSeed(), frameSize(g)));
    });
  });
  // 3 — Checkerboard on a 3×3
  chg('sel-grid-type', 'square3x3'); chg('sel-rule', 'checkerboard'); generate();
  put('rule3x3:checkerboard', state.components.map(c => c.cells.map(x => x.rotation + (x.flipH ? 'h' : '') + (x.flipV ? 'v' : '')).join(',')).join('|'));

  // 4 — colour rules on a 3×3 with three inks
  chg('sel-rule', 'identity'); generate();
  state.colors = ['#e8321e', '#0a9a3e', '#1e5be8']; buildPalette();
  Object.keys(COLOR_RULES).forEach(m => [0, 1].forEach(off => {
    state.colorRule = { mode: m, offset: off };
    const it = buildComponentItems(state.components[0], getGrid());
    put(`colour:${m}:${off}`, it.map(x => x.color).join(','));
  }));
  reset();

  // 5 — Symbol Square 4×4 + Checkerboard rule (default, Rotate A/B, Swap)
  setTier('symbol');
  chg('sel-symbol-square-cols', '4'); chg('sel-symbol-square-rows', '4');
  ctrl('btn-symbol-grid-square').click();
  state.symbolCells = state.symbolCells.map(c => ({ ...c, source: 'seed', seedType: 'arc', rotation: 0, fitMode: 'fill', color: null }));
  chg('sel-symbol-fill', 'rule'); chg('sel-symbol-rule', 'checkerboard');
  const rot = () => { applySymbolRule({ resetAll: true }); return state.symbolCells.map(c => c.rotation).join(','); };
  put('symbol:checker:default', rot());
  chg('sel-rule-chk-rota', '180'); chg('sel-rule-chk-rot', '0'); put('symbol:checker:A180B0', rot());
  ctrl('chk-rule-chk-swap').checked = true; put('symbol:checker:swap', rot());
  put('symbol:svg', buildSymbolSVG());

  // 6 — Grid tier: Alternate flip is a true checkerboard
  const LEAF = [180, 0, 0, 180].map(r => ({ rotation: r, flipH: false, flipV: false, scale: 1 }));
  const runR = id => runBuiltinRecipe(BUILTIN_RECIPES.find(r => r.id === id));
  runR('leaf-wave'); ctrl('chk-fvsgrid-alt-flip').checked = true;
  ['square2x2', 'square3x3', 'square4x4'].forEach(t => {
    chg('sel-fvsgrid-type', t);
    const n = +t.slice(6, 7);
    const d = new DOMParser().parseFromString(buildFvsGridSVG(), 'image/svg+xml');
    const f = [...d.documentElement.children].filter(e => e.tagName === 'g').map(e => /scale\(-1,1\)/.test(e.getAttribute('transform')) ? 1 : 0);
    const rows = []; for (let r = 0; r < n; r++) rows.push(f.slice(r * n, r * n + n).join(''));
    put('altflip:' + t, rows.join('/'));
  });
  ctrl('chk-fvsgrid-alt-flip').checked = false;

  // 7 — built-in recipes (whole chain)
  BUILTIN_RECIPES.forEach(r => { runR(r.id); put('recipe:' + r.id, tierSVG()); });

  // 8 — variants and plates on the two-ink recipe
  runR('leaf-two-ink');
  put('variant:fill', renderVariant({ style: 'fill', ink: '#0a9a3e', strokeW: 4, paper: null }, false));
  put('variant:stroke', renderVariant({ style: 'stroke', ink: '#e8321e', strokeW: 5, paper: '#fff3c0' }, false));
  const svg = tierSVG(), cs = state.colors.slice();
  cs.forEach((c, i) => put('plate:' + i, plateSVG(svg, cs, i, state.paperColor)));

  // 9 — hygiene: auto tiles hidden, colour spelling, non-square Print
  runR('leaf-wave');
  put('lib:auto-hidden', Object.keys(LIBRARY.read()).some(k => k.startsWith('Tile · ')) && !libraryNames(LIBRARY.read()).some(k => k.startsWith('Tile · ')));
  put('hexKey', [hexKey('#ABC'), hexKey('#A1b2C3'), hexKey(' #fFf ')].join(','));
  put('plate:shorthex', plateSVG('<svg viewBox="0 0 10 10"><path fill="#F00" d="M0 0"/><path fill="#0f0" d="M1 1"/></svg>', ['#ff0000', '#00ff00'], 0, '#fff'));
  put('recolour:shorthex', recolourSVG('<svg><rect fill="#FFF"/><path fill="#123456"/></svg>', '#e8321e', '#ffffff'));
  const P0 = { ...printSizePanel };
  Object.assign(printSizePanel, { getMode: () => 'print', getUnit: () => 'mm', getSize: () => ({ width: 100, height: 100 }), getDpi: () => 300, getBleed: () => 3 });
  try {
    const ns = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><rect width="400" height="200" fill="#ffffff"/></svg>';
    const w = printWrapSVG(ns, '#ffffff', true);
    put('print:nonsquare:svg', w);
    put('print:nonsquare:dims', w.match(/width="([^"]+)" height="([^"]+)"/).slice(1).join('x'));
    const d = printComponentDims(400, 200);
    put('print:nonsquare:px', [d.outW, d.outH, d.trimHmm].join('x'));
    const sq = printComponentDims(400, 400);
    put('print:square:px', [sq.outW, sq.outH, sq.trimHmm].join('x'));
  } finally { Object.assign(printSizePanel, P0); }

  // 10 — named rules on 3×3 and 4×4 (rotation/flip signature per candidate)
  chg('sel-seed-type', 'arc'); inp('rg-thickness', 100);
  ['square3x3', 'square4x4'].forEach(gt => {
    chg('sel-grid-type', gt);
    ['pinwheel', 'mirror', 'diagonal', 'checkerboard', 'rowmirror', 'columnmirror', 'radial'].forEach(mode => {
      const opt = ctrl('sel-rule').querySelector(`option[value="${mode}"]`);
      if (opt.disabled) { put(`rulenm:${gt}:${mode}`, 'disabled'); return; }
      chg('sel-rule', mode); generate();
      put(`rulenm:${gt}:${mode}`, state.components.map(c => c.cells.map(x => x.rotation + (x.flipH ? 'h' : '') + (x.flipV ? 'v' : '')).join(',')).join('|'));
    });
  });
  chg('sel-rule', 'identity'); chg('sel-grid-type', 'square2x2');

  // 11 — Cell properties colour override, Undo, rename, quadrant hint
  chg('sel-seed-type', 'arc'); chg('sel-element-fillmode', 'fill');
  setTier('symbol');
  chg('sel-symbol-square-cols', '2'); chg('sel-symbol-square-rows', '2'); ctrl('btn-symbol-grid-square').click();
  state.colors = ['#e8321e', '#0a9a3e']; buildPalette();
  state.symbolCells = state.symbolCells.map(c => ({ ...c, source: 'seed', seedType: 'arc', fitMode: 'fill', color: null }));
  const count = (svg, c) => (svg.match(new RegExp(c, 'gi')) || []).length;
  put('cell:follow', [count(buildSymbolSVG(), '#e8321e'), count(buildSymbolSVG(), '#0a9a3e')].join('/'));
  state.symbolCells[0].color = '#123456'; state.symbolCells[1].color = '#0A9A3E';
  const ov = buildSymbolSVG();
  put('cell:override', [count(ov, '#123456'), count(ov, '#0a9a3e')].join('/'));
  state.symbolSelection = new Set([0]); renderCellPropertiesPanel();
  put('cell:ui', [ctrl('sel-cellprop-color').value, ctrl('row-cellprop-color-override').style.display].join(','));
  ctrl('btn-cellprop-color-reset').click();
  put('cell:reset', state.symbolCells[0].color === null);
  state.symbolSelection.clear();
  setTier('component'); reset();
  chg('sel-rule', 'identity'); generate(); const before = state.components.map(c => c.id).join(','); chg('sel-rule', 'pinwheel'); generate(); clearGallery();
  const depth = undoStack.length; undoComponents(); const afterOne = state.components.length;
  undoComponents(); const afterTwo = state.components.map(c => c.id).join(',');
  put('undo', [depth >= 3, afterOne > 0, afterTwo === before].join(','));
  const lib0 = LIBRARY.read(), sym0 = SYMBOL_LIBRARY.read();
  try {
    chg('sel-rule', 'identity'); generate();
    const L = LIBRARY.read(); L['zz-a'] = buildLibraryEntry(); L['zz-b'] = { ...buildLibraryEntry(), underlyingComponentName: 'zz-a' }; LIBRARY.write(L);
    state.symbolCells = [{ source: 'component', componentName: 'zz-a' }];
    renameLibraryEntry('zz-a', 'zz-renamed');
    const L2 = LIBRARY.read();
    put('rename', [!!L2['zz-renamed'], !L2['zz-a'], L2['zz-b'].underlyingComponentName, state.symbolCells[0].componentName].join(','));
  } finally { LIBRARY.write(lib0); SYMBOL_LIBRARY.write(sym0); }
  chg('sel-grid-type', 'square3x3'); state.colorRule = { mode: 'quadrant', offset: 0 }; setTier('component'); syncColorRuleUI();
  const h3 = ctrl('color-quadrant-hint').style.display === '';
  chg('sel-grid-type', 'square2x2'); syncColorRuleUI();
  put('quadrant:hint', [h3, ctrl('color-quadrant-hint').style.display === ''].join(','));
  state.colorRule = { ...DEFAULT_COLOR_RULE }; syncColorRuleUI();
  undoStack.length = 0;

  // 12 — recipe JSON round-trip, Print marks, PNG size + DPI, Loom grids as Symbols, Triangle
  runR('leaf-two-ink'); setTier('component');
  const rBefore = tierSVG(), rJson = JSON.parse(JSON.stringify(buildRecipe()));
  state.colors = ['#000000']; buildPalette(); chg('sel-grid-type', 'square2x2');
  applyRecipe(rJson);
  put('recipe:roundtrip', norm(rBefore) === norm(tierSVG()));
  const P1 = { ...printSizePanel };
  Object.assign(printSizePanel, { getMode: () => 'print', getUnit: () => 'mm', getSize: () => ({ width: 100, height: 100 }), getDpi: () => 300, getBleed: () => 8 });
  try {
    const ns = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><rect width="400" height="200" fill="#ffffff"/></svg>';
    const wp = printWrapSVG(ns, '#ffffff', true), wn = printWrapSVG(ns, '#ffffff', false);
    put('print:marks', [(wp.match(/<line/g) || []).length, (wp.match(/<circle/g) || []).length, (wn.match(/<line/g) || []).length, (wn.match(/<circle/g) || []).length].join('/'));
    const png = await encodeOutput(ns, { format: 'png', scale: 1, paper: '#ffffff', plate: false });
    const bmp = await createImageBitmap(png), bytes = new Uint8Array(await png.arrayBuffer());
    let hasPhys = false; for (let i = 0; i < 64; i++) if (bytes[i] === 0x70 && bytes[i + 1] === 0x48 && bytes[i + 2] === 0x59 && bytes[i + 3] === 0x73) hasPhys = true;
    put('print:png', [bmp.width, bmp.height, hasPhys].join('x'));
  } finally { Object.assign(printSizePanel, P1); }
  chg('sel-seed-type', 'arc'); chg('sel-element-fillmode', 'fill');
  setTier('symbol');
  ['bento', 'hex'].forEach(k => {
    ctrl('btn-symbol-grid-' + k).click();
    state.symbolCells = state.symbolCells.map(c => ({ ...c, source: 'seed', seedType: 'arc', rotation: 0, flipH: false, flipV: false, scale: 1, fitMode: 'fill', color: null }));
    put('symbol:' + k + ':cells', state.symbolCells.length);
    put('symbol:' + k + ':svg', buildSymbolSVG());
  });
  setTier('component'); reset();
  chg('sel-seed-type', 'triangle'); chg('sel-element-fillmode', 'fill'); chg('sel-grid-type', 'square3x3');
  ['mirror', 'pinwheel', 'diagonal'].forEach(m => { chg('sel-rule', m); generate(); const c = state.components[1] || state.components[0]; put('triangle:3x3:' + m, buildComponentSVG(buildComponentItems(c, getGrid()), getSeed(), frameSize(getGrid()))); });
  chg('sel-rule', 'identity'); chg('sel-grid-type', 'square2x2'); chg('sel-seed-type', 'arc'); undoStack.length = 0;

  // 13 — triangle lattice, Empty cells, Orientation rule, Tier grids, Mirror
  const symLib0 = SYMBOL_LIBRARY.read();
  try {
    chg('sel-seed-type', 'triangle'); chg('sel-element-fillmode', 'fill'); state.colors = ['#f0301f']; buildPalette();
    const mk = (name, n, up, down, empty) => {
      setTier('symbol'); chg('sel-symbol-tri-n', String(n)); ctrl('btn-symbol-grid-tri').click();
      chg('sel-symbol-fill', 'rule'); chg('sel-symbol-rule', 'orientation'); chg('sel-rule-ori-up', up); chg('sel-rule-ori-down', down);
      applySymbolRule({ resetAll: true }); (empty || []).forEach(i => { state.symbolCells[i].source = 'empty'; });
      const all = SYMBOL_LIBRARY.read(); all[name] = buildSymbolLibraryEntry(); SYMBOL_LIBRARY.write(all);
      return buildSymbolSVG();
    };
    const sa = mk('t-a', 2, 'filled', 'empty'), sb = mk('t-b', 2, 'filled', 'filled', [0]), sc = mk('t-c', 4, 'filled', 'empty');
    put('tri:sym:a', sa); put('tri:sym:b', sb); put('tri:sym:c', sc);
    put('tri:counts', [state.symbolCells.length, buildSymbolItems().length, state.symbolCells.filter(c => c.source === 'empty').length].join('/'));
    const ori = triangleLoomModel(4).cells.map(c => polyOrient(c.points));
    put('tri:orient', ori.filter(o => o === 'up').length + '/' + ori.filter(o => o === 'down').length);
    mk('t-d', 2, 'filled', 'filled');
    put('tri:downturn', state.symbolCells.map(c => c.rotation).join(','));
    const G = (name, type, rot, mir) => {
      setTier('grid'); state.fvsGridSymbolName = name; state.fvsGridComponentName = null;
      chg('sel-fvsgrid-type', type); chg('sel-fvsgrid-rot', rot || '0'); chg('sel-fvsgrid-mirror', mir || 'none');
      const svg = buildFvsGridSVG(); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); return svg;
    };
    const g2 = G('t-a', 'tier2');
    put('grid:tier2', g2); put('grid:tier1:rot90:v', G('t-a', 'tier1', '90', 'v')); put('grid:tier1:h', G('t-b', 'tier1', '0', 'h'));
    put('grid:tri3', G('t-a', 'tri3')); put('grid:tier1:vh', G('t-c', 'tier1', '0', 'vh'));
    const ids = (g2.match(/<clipPath id="[^"]+"/g) || []);
    put('grid:clipids', ids.length + '/' + new Set(ids).size);
    put('grid:nometa', (g2.match(/<metadata>/g) || []).length + '/' + (g2.match(/<defs>/g) || []).length);
    // live Symbol: the Grid can tile the Symbol as it is right now, identical to the saved copy
    mk('t-live', 2, 'filled', 'empty');
    setTier('grid'); state.fvsGridSymbolName = LIVE_SYMBOL; chg('sel-fvsgrid-type', 'tier2');
    put('grid:live', norm(buildFvsGridSVG()) === norm(G('t-live', 'tier2')));
    // mirror lands on the drawn edge: a Symbol whose bottom row is empty
    mk('t-top', 2, 'filled', 'filled', [1, 2, 3]);
    put('grid:mirror:contentbox', (G('t-top', 'tier1', '0', 'h').match(/viewBox="([^"]+)"/) || [])[1]);
    put('grid:viewbox', (G('t-a', 'tier1', '90', 'v').match(/viewBox="([^"]+)"/) || [])[1]);
  } finally { SYMBOL_LIBRARY.write(symLib0); chg('sel-fvsgrid-type', 'square4x4'); setTier('component'); reset(); }

  // 14 — figure recipe v2: the v1 recipes and the twelve triangle figures re-expressed as data
  try {
    const norm2 = x => norm(x);
    Object.keys(FIGURE_RECIPES_V1_AS_V2).forEach(id => {
      runBuiltinRecipe(BUILTIN_RECIPES.find(r => r.id === id)); const v1 = tierSVG();
      const v2 = runFigureRecipe({ tool: 'fvs-recipe', version: 2, ...FIGURE_RECIPES_V1_AS_V2[id] });
      put('fig:v1v2:' + id, norm2(v1) === norm2(v2));
    });
    const ref = { 'sierpinski:asset': out['tri:sym:a'], 'trapezoid:asset': out['tri:sym:b'], 'lattice4:asset': out['tri:sym:c'] };
    const tri = triangleFigureRecipes();
    Object.keys(tri).forEach(k => {
      const svg = runFigureRecipe(tri[k]);
      put('fig:tri:' + k, svg);
      if (ref[k]) put('fig:tri:same:' + k, H(norm2(svg)) === ref[k]);
    });
    const other = {
      star: { tool: 'fvs-recipe', version: 2, element: { type: 'star', colors: ['#1e5be8'] },
        levels: [{ kind: 'symbol', lattice: { type: 'square', cols: 3, rows: 3 }, fit: 'contain', rules: [{ when: { parity: 'odd' }, do: { rotate: 90 } }, { when: { index: 4 }, do: { content: 'empty' } }] },
          { kind: 'grid', lattice: { type: 'square', n: 2 }, cellSize: 110 }] },
      blob: { tool: 'fvs-recipe', version: 2, element: { type: 'blob', colors: ['#0a9a3e'] },
        levels: [{ kind: 'symbol', lattice: { type: 'triangle', rows: 2 }, fit: 'fill', rules: [{ when: { class: 'down' }, do: { content: 'empty' } }] },
          { kind: 'grid', lattice: { type: 'tier', stack: 2 } }] },
      polygon: { tool: 'fvs-recipe', version: 2, element: { type: 'polygon', colors: ['#e8321e'] },
        levels: [{ kind: 'symbol', lattice: { type: 'triangle', rows: 3 }, fit: 'fill', rules: [{ when: { class: 'down' }, do: { content: 'filled', rotate: 180 } }, { when: { row: 1 }, do: { content: 'empty' } }] },
          { kind: 'grid', lattice: { type: 'tier', stack: 1 } }], transform: { mirror: 'h' } },
    };
    Object.keys(other).forEach(k => put('fig:seed:' + k, runFigureRecipe(other[k])));
    let bad = ''; try { runFigureRecipe({ tool: 'fvs-recipe', version: 2, element: { type: 'nope' }, levels: [] }); } catch (e) { bad = e.message; }
    put('fig:invalid', bad);
    // Phase 1 — pipeline strip + recipe history
    const r0 = JSON.parse(JSON.stringify(triangleFigureRecipes()['sierpinski:repeated']));
    setTier('figure');
    const h0 = figureHistory.stack.length, u0 = undoStack.length;
    applyFigureRecipe(r0);
    const cardsOf = () => Array.from(document.querySelectorAll('#fg-pipeline .fg-card')).map(c => c.textContent.replace(/[×⇄]/g, '')).join('|');
    put('figstrip:cards', cardsOf());
    put('figstrip:steps', (figureStepSVGs(r0) || []).map(x => x.length > 200).join(','));
    put('figstrip:undostack', undoStack.length === u0);
    const r1 = JSON.parse(JSON.stringify(r0)); r1.levels.push({ kind: 'grid', lattice: { type: 'tier', stack: 1 }, cellSize: 110 });
    applyFigureRecipe(r1);
    put('figstrip:cards:grid', cardsOf());
    put('figstrip:hist', [figureHistory.stack.length - h0, ctrl('fg-undo').disabled].join(','));
    figureHistoryStep(-1); const back = state.figureRecipe.levels.length;
    figureHistoryStep(1); const fwd = state.figureRecipe.levels.length;
    put('figstrip:undoredo', [back, fwd, figureHistory.stack.length - h0].join(','));
    applyFigureRecipe(r1, { noHistory: true }); put('figstrip:nohist', figureHistory.stack.length - h0);
    put('figstrip:same', JSON.stringify(state.figureRecipe) === JSON.stringify(r1));
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); }

  // 15 — Figure tier: form ↔ recipe round-trip, checks, catalog, tier wiring
  try {
    const cat = figureCatalog();
    put('fig:catalog', Object.keys(cat).length);
    let rtBad = [], chkBad = [];
    Object.entries(triangleFigureRecipes()).forEach(([k, def]) => {
      const direct = norm(runFigureRecipe(def, { keepTier: true }));
      const rows = figureChecks(def, figureSVGOf(state.figureTier)); if (rows.some(r => !r.ok)) chkBad.push(k);
      figureFormFromRecipe(def);
      const back = norm(runFigureRecipe(figureRecipeFromForm(), { keepTier: true }));
      if (back !== direct) rtBad.push(k);
    });
    put('fig:form:roundtrip', rtBad.join(',') || 'ok');
    put('fig:checks:triangle', chkBad.join(',') || 'ok');
    setTier('figure'); applyFigureRecipe(cat['Triangle · Sierpinski · repeated'], { resetStep: true });
    put('fig:tier', [state.activeTier, state.figureTier, ctrl('figure-frame').innerHTML.length > 100, (tierSVG().match(/<path /g) || []).length === (ctrl('figure-frame').innerHTML.match(/<path /g) || []).length].join(','));
    ctrl('fg-json').value = '{"tool":"nope"}'; ctrl('fg-json-apply').click();
    put('fig:json:error', ctrl('fg-json-error').textContent);
    const bent = JSON.parse(JSON.stringify(cat['Triangle · Sierpinski · asset'])); bent.levels[0].lattice.rows = 3;
    const rep3 = figureChecks(bent, runFigureRecipe(bent, { keepTier: true }));
    put('fig:checks:rows3', rep3.filter(r => !r.ok).length);
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); }

  // 16 — per-cell Seed settings, reference-image mask
  try {
    const R = live => ({ tool: 'fvs-recipe', version: 2, element: { type: 'arc', params: { 'rg-thickness': 40 }, colors: ['#e8321e'] },
      levels: [{ kind: 'symbol', lattice: { type: 'square', cols: 2, rows: 2 }, fit: 'contain', ...(live ? { seed: 'live' } : {}), rules: [] }] });
    const dflt = runFigureRecipe(R(false)), liveSvg = runFigureRecipe(R(true));
    put('seed:cellparams', [dflt !== liveSvg, state.symbolCells.every(c => !!c.seedParams)].join(','));
    put('seed:cellparams:svg', liveSvg);
    runFigureRecipe(R(false)); put('seed:cellparams:cleared', state.symbolCells.every(c => !c.seedParams));
    const c = document.createElement('canvas'); c.width = 60; c.height = 40; const g = c.getContext('2d');
    g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, 60, 40); g.fillStyle = '#d03020'; g.fillRect(20, 10, 20, 20);
    const im = new Image(); im.src = c.toDataURL(); await im.decode();
    const M = await rasterMask(im, 64, null), n = M.mask.reduce((a, b) => a + b, 0);
    put('refmask', [n > 100 && n < 600, M.box && M.box.x1 - M.box.x0 < 40].join(','));
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); }

  // 17 — hexagonal lattice and 60° poses
  try {
    const hm = hexLoomModel(3);
    const sec = [0, 1, 2, 3, 4, 5].map(k => hm.cells.filter(c => c.ring > 0 && c.sector === k).length).join(',');
    put('hex:model', [hm.cells.length, hm.cells.filter(c => c.ring === 0).length, hm.cells.filter(c => c.ring === 1).length, hm.cells.filter(c => c.ring === 2).length, sec].join('/'));
    put('hex:snap', [snapPose(60), snapPose(89), snapPose(-60), snapPose(370)].join(','));
    Object.entries(hexFigureRecipes()).forEach(([k, def]) => {
      const svg = runFigureRecipe(def, { keepTier: true });
      put('fig:hex:' + def.id, svg);
      put('fig:hex:checks:' + def.id, figureChecks(def, svg).filter(r => !r.ok).length);
      figureFormFromRecipe(def); put('fig:hex:roundtrip:' + def.id, norm(runFigureRecipe(figureRecipeFromForm(), { keepTier: true })) === norm(svg));
    });
    put('hex:poses', [...new Set(state.symbolCells.map(c => c.rotation))].sort((a, b) => a - b).join(','));
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); }

  // 18 — a Grid figure as the tile of another Grid (recursion)
  try {
    Object.values(recursiveFigureRecipes()).forEach(def => {
      const svg = runFigureRecipe(def, { keepTier: true });
      put('fig:rec:' + def.id, svg);
      put('fig:rec:checks:' + def.id, figureChecks(def, svg).filter(r => !r.ok).length + '/' + (svg.replace(/<defs>[\s\S]*?<\/defs>/g, '').match(/<path /g) || []).length);
      put('fig:rec:stats:' + def.id, state.figureLevelStats.map(s => s.tiles + 'x' + s.copies).join(','));
      if (def.id !== 'rec-bowtie') { figureFormFromRecipe(def); put('fig:rec:roundtrip:' + def.id, norm(runFigureRecipe(figureRecipeFromForm(), { keepTier: true })) === norm(svg)); }
    });
    let err = ''; try { runFigureRecipe({ tool: 'fvs-recipe', version: 2, element: { type: 'triangle', colors: ['#000000'] },
      levels: [{ kind: 'symbol', lattice: { type: 'triangle', rows: 8 }, fit: 'fill', rules: [] }, { kind: 'grid', lattice: { type: 'square', n: 6 } }, { kind: 'grid', lattice: { type: 'square', n: 6 } }, { kind: 'grid', lattice: { type: 'square', n: 6 } }] }, { keepTier: true }); } catch (e) { err = e.message.replace(/\d+/g, 'N'); }
    put('fig:rec:limit', err);
    put('fig:rec:cleared', (runFigureRecipe(triangleFigureRecipes()['sierpinski:repeated'], { keepTier: true }), state.fvsGridRaw === null));
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); }

  // 19 — painting cells writes Rules; chips; the active step survives edits
  try {
    const blank = () => ({ tool: 'fvs-recipe', version: 2, element: { type: 'triangle', style: 'fill', colors: ['#f0301f'], paper: '#ffffff' }, levels: [{ kind: 'symbol', lattice: { type: 'triangle', rows: 2 }, fit: 'fill', rules: [] }], transform: {} });
    const cellOf = (def, i) => { runFigureRecipe(def, { keepTier: true }); return [slotClassContext(getSymbolGrid())[i], state.symbolCells[i]]; };
    const draw = def => runFigureRecipe(def, { keepTier: true });
    let d = blank(); let [c, st] = cellOf(d, 2);
    d = paintCell(d, c, st, 'empty', true);
    put('paint:sierpinski', [JSON.stringify(d.levels[0].rules), H(norm(draw(d))) === out['tri:sym:a']].join('|'));
    d = blank(); [c, st] = cellOf(d, 2); d = paintCell(d, c, st, 'rotate', true);   // one Rotate = 180° on a triangular lattice
    [c, st] = cellOf(d, 0); d = paintCell(d, c, st, 'empty', false);
    put('paint:trapezoid', [d.levels[0].rules.length, H(norm(draw(d))) === out['tri:sym:b']].join('|'));
    d = blank(); [c, st] = cellOf(d, 1); d = paintCell(d, c, st, 'toggle', false);
    [c, st] = cellOf(d, 1); d = paintCell(d, c, st, 'toggle', false);
    put('paint:toggle:merge', d.levels[0].rules.length + ':' + JSON.stringify(d.levels[0].rules[0].do));
    put('paint:chips', [describeRule({ when: { class: 'down' }, do: { content: 'empty' } }), describeRule({ when: { index: 3 }, do: { rotate: 180 } }), describeRule({ when: { row: [0] }, do: { content: 'empty' } }), describeRule({ when: {}, do: { rotate: 'sector' } }), describeRule({ when: { parity: 'odd' }, do: { flipH: true } })].join(' ; '));
    const on = blank(); on.levels[0].rules = [{ when: { class: 'down' }, do: { content: 'empty' } }];
    const off = JSON.parse(JSON.stringify(on)); off.levels[0].rules[0].off = true;
    put('paint:off', H(norm(draw(off))) === H(norm(draw(blank()))) && H(norm(draw(on))) !== H(norm(draw(off))));
    put('paint:isformrule', [isFormRule({ when: { class: 'down' }, do: { content: 'empty' } }), isFormRule({ when: { index: 1 }, do: { content: 'empty' } }), isFormRule({ when: { class: 'down' }, do: { content: 'empty' }, off: true })].join(','));
    const painted = blank(); painted.levels[0].rules = [{ when: { index: 1 }, do: { content: 'empty' } }];
    applyFigureRecipe(painted, { resetStep: true }); setFigureStep('level0');
    figureFormFromRecipe(painted); const back = figureRecipeFromForm();
    put('paint:formkeeps', JSON.stringify(back.levels[0].rules));
    applyFigureRecipe(figureRecipeFromForm(), { fromForm: true });
    put('paint:step', state.figureStep + ',' + figurePaintable());
    figureMutate(x => { x.levels[0].rules.push({ when: { index: 2 }, do: { content: 'empty' } }); });
    put('paint:step:kept', state.figureStep);
    // Phase 5 — main Seed parameters in the step panel
    const rec = JSON.parse(JSON.stringify(triangleFigureRecipes()['sierpinski:asset']));
    applyFigureRecipe(rec, { noHistory: true, resetStep: true }); setFigureStep('element');
    put('fig:seedmain:ids', Object.values(FG_SEED_MAIN).flat().every(([id]) => !!document.getElementById(id)));
    const counts = [];
    ['triangle', 'arc', 'star', 'polygon', 'lens', 'blob'].forEach(t => { figureMutate(d => { d.element.type = t; delete d.element.params; }); setFigureStep('element'); counts.push(document.querySelectorAll('#fg-step-panel input[type=range]').length); });
    put('fig:seedmain:sliders', counts.join(','));
    figureMutate(d => { d.element.type = 'star'; delete d.element.params; }); setFigureStep('element');
    const sl = document.querySelector('#fg-step-panel input[type=range]'); sl.value = 8; sl.dispatchEvent(new Event('change', { bubbles: true }));
    put('fig:seedmain:write', JSON.stringify(state.figureRecipe.element.params) + ',' + ctrl('rg-star-points').value);
    fireInput('rg-star-points', 5);
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); state.figureStep = null; }

  // 20 — Mirror / Rotate handles
  try {
    const seq = [];
    let tr = {}; ['mirror-v', 'mirror-h', 'mirror-v', 'mirror-h'].forEach(k => { applyHandle(tr, k); seq.push(tr.mirror); });
    tr = {}; for (let i = 0; i < 5; i++) applyHandle(tr, 'rotate');
    put('handle:toggle', seq.join(',') + '|' + tr.rotate);
    const def = JSON.parse(JSON.stringify(figureCatalog()['Triangle · Sierpinski · repeated']));
    applyFigureRecipe(def, { resetStep: true });
    const hs = [...document.querySelectorAll('#fg-handles [data-handle]')].map(e => e.dataset.handle).join(',');
    const vb = ctrl('fg-handles').getAttribute('viewBox') === ctrl('figure-frame').querySelector('svg').getAttribute('viewBox');
    put('handle:present', hs + '|' + vb);
    const click = k => document.querySelector(`#fg-handles [data-handle="${k}"]`).dispatchEvent(new MouseEvent('click', { bubbles: true }));
    click('mirror-v'); const a1 = JSON.stringify(state.figureRecipe.transform);
    click('rotate'); click('rotate'); const a2 = JSON.stringify(state.figureRecipe.transform);
    click('mirror-v'); const a3 = JSON.stringify(state.figureRecipe.transform);
    put('handle:click', [a1, a2, a3, state.figureStep].join(' / '));
    put('handle:panel', ctrl('fg-step-panel').querySelectorAll('select').length + ':' + [...ctrl('fg-step-panel').querySelectorAll('select')].map(s => s.value).join(','));
    // a middle Grid keeps its own transform, the last one uses the recipe's
    const two = JSON.parse(JSON.stringify(figureCatalog()['Recursive · Sierpinski, three levels']));
    applyFigureRecipe(two, { resetStep: true }); setFigureStep('level1');
    document.querySelector('#fg-handles [data-handle="mirror-h"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    put('handle:level', JSON.stringify(state.figureRecipe.levels[1].transform) + '|' + JSON.stringify(state.figureRecipe.transform || {}) + '|' + state.figureStep);
    setFigureStep('level0'); put('handle:none', ctrl('fg-handles').style.display + '|' + figureHandleTarget());
    const noGrid = JSON.parse(JSON.stringify(figureCatalog()['Triangle · Sierpinski · asset'])); applyFigureRecipe(noGrid, { resetStep: true });
    put('handle:nogrid', ctrl('fg-handles').style.display + '|' + figureHandleTarget());
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); state.figureStep = null; }

  // 21 — play: variations, shuffle with locks, shortcuts
  try {
    setTier('figure');   // the shortcuts only listen while the Figure step is on screen
    const cat = figureCatalog(), base = JSON.parse(JSON.stringify(cat['Triangle · Sierpinski · repeated']));
    const n1 = figureNeighbours(base, 7), n2 = figureNeighbours(base, 7), n3 = figureNeighbours(base, 8);
    put('play:neighbours:det', (JSON.stringify(n1) === JSON.stringify(n2)) + ',' + (JSON.stringify(n1) !== JSON.stringify(n3)));
    let bad = 0, differ = 0; n1.forEach(c => { try { validateFigureRecipe(c.recipe); runFigureRecipe(JSON.parse(JSON.stringify(c.recipe)), { keepTier: true }); } catch (e) { bad++; } if (JSON.stringify(c.recipe) !== JSON.stringify(base)) differ++; });
    put('play:neighbours:valid', [n1.length >= 6 && n1.length <= 9, bad, differ === n1.length].join(','));
    const allLocked = { element: true, symbol: true, rules: true, grid: true, transform: true };
    put('play:shuffle:alllocked', figureShuffle(base, allLocked, 3) === null);
    const onlyTransform = { element: true, symbol: true, rules: true, grid: true };
    let okT = true; for (let sd = 1; sd <= 12; sd++) { const r = figureShuffle(base, onlyTransform, sd); if (!r) continue; const a1 = JSON.parse(JSON.stringify(r)), b1 = JSON.parse(JSON.stringify(base));
      const strip = d => { d.transform = {}; d.levels.forEach(l => { delete l.transform; }); return JSON.stringify(d); }; if (strip(a1) !== strip(b1)) okT = false; }
    put('play:shuffle:transformonly', okT);
    const onlyElement = { symbol: true, rules: true, grid: true, transform: true };
    let okE = true; for (let sd = 1; sd <= 12; sd++) { const r = figureShuffle(base, onlyElement, sd); if (!r) continue; if (JSON.stringify(r.levels) !== JSON.stringify(base.levels) || JSON.stringify(r.transform) !== JSON.stringify(base.transform)) okE = false; }
    put('play:shuffle:elementonly', okE);
    put('play:shuffle:det', JSON.stringify(figureShuffle(base, {}, 5)) === JSON.stringify(figureShuffle(base, {}, 5)));
    // triangles are only turned half a turn
    const turned = figureNeighbours(base, 3, 14).filter(c => c.label === 'Turn cells').map(c => JSON.stringify(c.recipe.levels[0].rules)).join('');
    put('play:turn:tri', !/"rotate":(90|270)/.test(turned));
    // UI: shuffle is one history step and undo restores it
    applyFigureRecipe(JSON.parse(JSON.stringify(base)), { resetStep: true }); const hist0 = figureHistory.stack.length, before = JSON.stringify(state.figureRecipe);
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    const after = JSON.stringify(state.figureRecipe), hist1 = figureHistory.stack.length;
    figureHistoryStep(-1); const undone = JSON.stringify(state.figureRecipe);
    put('play:shuffle:ui', [after !== before, hist1 === hist0 + 1, undone === before].join(','));
    // locks from the toolbar
    const lockBtns = [...document.querySelectorAll('#fg-toolbar .fg-group button')].filter(b => ['Element', 'Symbol', 'Rules', 'Grid', 'Mirror / Rotate'].includes(b.textContent));
    lockBtns.forEach(b => b.click());
    put('play:locks:ui', Object.values(state.figureLocks).filter(Boolean).length + ',' + (figureShuffle(state.figureRecipe, state.figureLocks, 1) === null));
    Object.keys(state.figureLocks).forEach(k => { state.figureLocks[k] = false; });
    // shortcuts
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'v', bubbles: true })); const shown = !ctrl('fg-variations').hidden;
    closeFigureVariations();
    const sym = JSON.parse(JSON.stringify(cat['Triangle · Sierpinski · asset'])); applyFigureRecipe(sym, { resetStep: true }); const r0 = state.figureRecipe.levels[0].lattice.rows;
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: ']', bubbles: true })); const r1 = state.figureRecipe.levels[0].lattice.rows;
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: '[', bubbles: true })); const r2 = state.figureRecipe.levels[0].lattice.rows;
    put('play:shortcuts', [shown, r0, r1, r2].join(','));
  } finally { closeFigureVariations(); setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); state.figureStep = null; state.figureLocks = {}; }

  // 22 — from a blank figure, with real UI events, in at most six actions
  try {
    setTier('figure');
    const blank = () => ({ tool: 'fvs-recipe', version: 2, element: { type: 'triangle', style: 'fill', colors: ['#f0301f'], paper: '#ffffff' }, levels: [{ kind: 'symbol', lattice: { type: 'triangle', rows: 2 }, fit: 'fill', rules: [] }], transform: {} });
    const click = el => el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    const handle = k => click(document.querySelector(`#fg-handles [data-handle="${k}"]`));
    const build = steps => {
      applyFigureRecipe(blank(), { resetStep: true }); let n = 0;
      click(document.querySelector('#fg-pipeline .fg-card[data-step="level0"]')); n++;                                  // 1 open the Symbol step
      const cell = document.querySelector('#figure-frame [data-cell-index="2"]');
      cell.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, shiftKey: true })); window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true })); n++;   // 2 Shift+click a down cell
      click([...document.querySelectorAll('#fg-pipeline .mini-btn')].find(b => b.textContent === '+ Grid')); n++;       // 3 add a Grid
      steps.forEach(st => { st(); n++; });
      return { n, svg: figureSVGOf(state.figureTier) };
    };
    const tier = label => () => click([...document.querySelectorAll('#fg-step-panel .fg-thumb')].find(b => b.title === label));
    const rep = build([tier('Tier ×2')]), bow = build([tier('Tier'), () => handle('rotate'), () => handle('mirror-v')]), hexa = build([tier('Tier'), () => handle('mirror-h')]);
    const ref = k => runFigureRecipe(triangleFigureRecipes()[k], { keepTier: true });
    put('ux:repeated', [rep.n, H(norm(rep.svg)) === H(norm(ref('sierpinski:repeated')))].join(','));
    put('ux:bowtie', [bow.n, H(norm(bow.svg)) === H(norm(ref('sierpinski:mirror-1')))].join(','));
    put('ux:hexagon', [hexa.n, H(norm(hexa.svg)) === H(norm(ref('sierpinski:mirror-2')))].join(','));
    // the Symbol ⇄ Component switch on the first card
    applyFigureRecipe(blank(), { resetStep: true });
    const swBtn = () => document.querySelector('#fg-pipeline .fg-card[data-step="level0"] .fg-card__sw');
    const k0 = state.figureRecipe.levels[0].kind; click(swBtn()); const k1 = state.figureRecipe.levels[0].kind; const ok1 = !ctrl('fg-json-error').textContent || ctrl('fg-json-error').style.display === 'none';
    click(swBtn()); const k2 = state.figureRecipe.levels[0].kind;
    put('fig:switch', [k0, k1, k2, ok1, state.figureStep].join(','));
    // all twelve "Triangle Symbol" figures from a blank one, with real UI events, each in at most six actions
    const tool = label => click([...document.querySelectorAll('#fg-toolbar .fg-group button')].find(b => b.textContent === label));
    const paint = (i, shift) => { const c = document.querySelector(`#figure-frame [data-cell-index="${i}"]`); c.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, shiftKey: !!shift })); window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true })); };
    const rowsSlider = v => { const r = document.querySelector('#fg-step-panel input[type=range]'); r.value = v; r.dispatchEvent(new Event('change', { bubbles: true })); };
    const addGrid = () => click([...document.querySelectorAll('#fg-pipeline .mini-btn')].find(b => b.textContent === '+ Grid'));
    const assets = { sierpinski: [() => paint(2, true)], trapezoid: [() => paint(0, false), () => tool('Rotate'), () => paint(2, true)], lattice4: [() => rowsSlider(4), () => paint(2, true)] };
    const comps = { asset: [], repeated: [addGrid, tier('Tier ×2')], 'mirror-1': [addGrid, () => handle('rotate'), () => handle('mirror-v')], 'mirror-2': [addGrid, () => handle('mirror-h')] };
    const all = triangleFigureRecipes();
    Object.entries(assets).forEach(([an, as]) => Object.entries(comps).forEach(([cn, cs]) => {
      state.figureTool = 'toggle'; applyFigureRecipe(blank(), { resetStep: true }); let n = 0;   // a fresh session starts on Toggle
      if (as[0] === assets.lattice4[0]) { click(document.querySelector('#fg-pipeline .fg-card[data-step="level0"]')); }   // the panel with the rows slider belongs to the Symbol step (already active for a blank figure)
      [...as, ...cs].forEach(st => { st(); n++; });
      put('ux12:' + an + ':' + cn, [n, n <= 6, H(norm(figureSVGOf(state.figureTier))) === H(norm(runFigureRecipe(all[an + ':' + cn], { keepTier: true })))].join(','));
    }));
  } finally { setTier('component'); reset(); chg('sel-fvsgrid-type', 'square4x4'); chg('sel-fvsgrid-rot', '0'); chg('sel-fvsgrid-mirror', 'none'); state.figureStep = null; }

  // tidy the throw-away tiles the recipes wrote into the Component library
  const lib = LIBRARY.read(); Object.keys(lib).filter(k => k.startsWith('Tile · recipe-')).forEach(k => delete lib[k]); LIBRARY.write(lib);
  reset();
  return out;
}

const $ = id => document.getElementById(id);
const frame = $('frame');
let last = null, baseline = null;

async function loadBaseline() {
  try { const r = await fetch('/fvs/_regression-baseline.json', { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}
async function run() {
  $('summary').textContent = 'Running…';
  const w = frame.contentWindow;
  if (!w || !w.eval || !w.document || w.document.readyState !== 'complete') { $('summary').textContent = 'FVS is still loading — try again in a second.'; return; }
  try { last = await w.eval('(' + battery.toString() + ')()'); }
  catch (e) { $('summary').innerHTML = '<span class="bad">Battery threw: ' + e.message + '</span>'; return; }
  baseline = await loadBaseline();
  const keys = Object.keys(last);
  let bad = 0, rows = '<tr><th>case</th><th>now</th><th>baseline</th></tr>';
  keys.forEach(k => {
    const b = baseline ? baseline[k] : undefined, ok = b === undefined ? null : b === last[k];
    if (ok === false) bad++;
    rows += `<tr><td>${k}</td><td class="${ok === false ? 'bad' : ''}">${last[k]}</td><td>${b === undefined ? '—' : b}</td></tr>`;
  });
  const missing = baseline ? Object.keys(baseline).filter(k => !(k in last)) : [];
  $('rows').innerHTML = rows;
  $('summary').innerHTML = baseline
    ? (bad || missing.length ? `<span class="bad">${bad} changed, ${missing.length} missing of ${keys.length} cases</span>` : `<span class="ok">All ${keys.length} cases match the baseline.</span>`)
    : `${keys.length} cases run — no baseline yet (fvs/_regression-baseline.json).`;
}
$('run').addEventListener('click', run);
$('record').addEventListener('click', () => {
  if (!last) { $('summary').textContent = 'Run first.'; return; }
  const t = $('json'); t.hidden = false; t.value = JSON.stringify(last, null, 2); t.select();
});
