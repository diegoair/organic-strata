<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organica</title>
  <link rel="stylesheet" href="/shared/organica-tokens.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg:       #ffffff;
      --ink:      #0a0a0a;
      --ink-dim:  #8a887f;
      --accent:   #6a9c2e;   /* acid green, darkened for contrast on white */
      --accent2:  #c04a1e;   /* warm ember, darkened for contrast on white */
      --line:     rgba(10,10,10,0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ── organic noise canvas behind everything ── */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.35;
    }

    /* ── header — Organica's only appearance on the page ── */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      padding: 1.5rem clamp(1.25rem, 3vw, 2.5rem);
    }

    .header__wordmark {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.05s;
    }

    /* ── left column of tool links ── */
    .side-nav {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      height: 100vh;
      width: clamp(11rem, 16vw, 14rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.55rem;
      padding: 0 clamp(1.25rem, 3vw, 2.5rem);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .nav__link {
      position: relative;
      display: inline-block;
      width: fit-content;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-dim);
      transition: color 0.2s ease;
      padding-bottom: 0.2em;
    }

    /* animated underline */
    .nav__link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1.5px;
      background: var(--accent);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav__link:hover {
      color: var(--ink);
    }

    .nav__link:hover::after {
      width: 100%;
    }

    /* creator gets a teal — the one gap left in the palette */
    .nav__link--creator:hover { color: #2f9c86; }
    .nav__link--creator::after { background: #2f9c86; }

    /* Loom gets a blueprint blue — grid/mathematical precision */
    .nav__link--loom:hover { color: #305f9c; }
    .nav__link--loom::after { background: #305f9c; }

    /* membrane gets a warm coral/tissue-red — the breathing gesture */
    .nav__link--membrane:hover { color: #a3402f; }
    .nav__link--membrane::after { background: #a3402f; }

    /* vortex gets a deep indigo — the spiral's own depth axis */
    .nav__link--vortex:hover { color: #5936c4; }
    .nav__link--vortex::after { background: #5936c4; }

    /* fvs gets emerald — the structured/systematic gap in the accent registry */
    .nav__link--fvs:hover { color: #2c8c62; }
    .nav__link--fvs::after { background: #2c8c62; }

    /* genesis gets a subtle accent tint on hover */
    .nav__link--genesis:hover { color: var(--accent); }
    .nav__link--genesis::after { background: var(--accent); }

    /* strata gets ember */
    .nav__link--strata:hover { color: var(--accent2); }
    .nav__link--strata::after { background: var(--accent2); }

    /* spore gets a cool blue-grey */
    .nav__link--spore:hover { color: #4f7ba8; }
    .nav__link--spore::after { background: #4f7ba8; }

    /* pollen gets a warm pollen-yellow */
    .nav__link--pollen:hover { color: #a4842a; }
    .nav__link--pollen::after { background: #a4842a; }

    /* living path gets a vital violet */
    .nav__link--living:hover { color: #8256cc; }
    .nav__link--living::after { background: #8256cc; }

    /* halide gets a darkroom steel-blue */
    .nav__link--halide:hover { color: #4d6d86; }
    .nav__link--halide::after { background: #4d6d86; }

    /* komorebi gets a dappled forest-green */
    .nav__link--komorebi:hover { color: #5c6f2e; }
    .nav__link--komorebi::after { background: #5c6f2e; }

    /* camo turing gets a GPU-shader cyan */
    .nav__link--turing:hover { color: #21707f; }
    .nav__link--turing::after { background: #21707f; }

    /* warping gets a warm wood terracotta */
    .nav__link--warping:hover { color: #8a5330; }
    .nav__link--warping::after { background: #8a5330; }

    /* soul gets a living rose/pulse — the animation engine, "what gives
       it life", deliberately distinct from Strata's warmer ember */
    .nav__link--soul:hover { color: #a83e6b; }
    .nav__link--soul::after { background: #a83e6b; }

    /* design system is documentation, not a tool — a quiet neutral, not a
       new hue in the palette */
    .nav__link--ds:hover { color: #7a7368; }
    .nav__link--ds::after { background: #7a7368; }

    /* ── centre — reserved for future displays ── */
    .display-area {
      position: relative;
      z-index: 1;
      height: 100vh;
      margin-left: clamp(11rem, 16vw, 14rem);
    }

    /* ── corner metadata ── */
    .meta {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--ink-dim);
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.9s;
    }

    /* ── Loom concept-test pages — small, bottom-centre, below the meta
       line. Not tools, so deliberately quieter than .nav__link: no
       per-link accent colour, lower opacity at rest. ── */
    .experiments {
      position: fixed;
      bottom: 0.7rem;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 1.1rem;
      padding: 0 1rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.05s;
    }

    .experiments__link {
      font-family: var(--font);
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease, color 0.25s ease;
    }

    .experiments__link:hover {
      opacity: 1;
      color: var(--accent);
    }

    /* ── keyframes ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="canvas-bg"></canvas>

  <header class="header">
    <span class="header__wordmark">Organica</span>
  </header>

  <nav class="side-nav">
    <a class="nav__link nav__link--creator" href="/genesis/creator.html">Creator</a>
    <a class="nav__link nav__link--loom" href="/loom/">Loom</a>
    <a class="nav__link nav__link--membrane" href="/membrane/">Membrane</a>
    <a class="nav__link nav__link--vortex" href="/vortex/">Vortex</a>
    <a class="nav__link nav__link--fvs" href="/fvs/">Fvs</a>
    <a class="nav__link nav__link--genesis" href="/genesis/">Genesis</a>
    <a class="nav__link nav__link--strata" href="/strata/">Strata</a>
    <a class="nav__link nav__link--spore" href="/spore/">Spore</a>
    <a class="nav__link nav__link--pollen" href="/pollen/">Pollen</a>
    <a class="nav__link nav__link--living" href="/livingpath/">Living path</a>
    <a class="nav__link nav__link--halide" href="/halide/">Halide</a>
    <a class="nav__link nav__link--komorebi" href="/komorebi/">Komorebi</a>
    <a class="nav__link nav__link--turing" href="/camo-turing/">Camo turing</a>
    <a class="nav__link nav__link--warping" href="/warping/">Warping</a>
    <a class="nav__link nav__link--soul" href="/soul/">Soul</a>
    <a class="nav__link nav__link--ds" href="/design-system/">Design system</a>
  </nav>

  <!-- Reserved for future displays — deliberately empty for now. -->
  <main class="display-area"></main>

  <p class="meta">System v0.1</p>

  <nav class="experiments">
    <a class="experiments__link" href="/loom/_test-camo-cells.html">Camo Cells</a>
    <a class="experiments__link" href="/loom/_test-slice-reposition.html">Slice Reposition</a>
    <a class="experiments__link" href="/loom/_test-mix-restructure.html">Mix Restructure</a>
    <a class="experiments__link" href="/explorations/flow-field/">Flow Field</a>
    <a class="experiments__link" href="/explorations/vortex/">Vortex</a>
    <a class="experiments__link" href="/explorations/membrane/">Membrane</a>
  </nav>

  <script>
    // ── organic noise field on canvas — same mechanic as before, just
    // recoloured (darker, higher-opacity strokes) so it still reads
    // clearly against a white page instead of a near-black one.
    const canvas = document.getElementById('canvas-bg');
    const ctx    = canvas.getContext('2d');

    let W, H, t = 0;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    // simple smooth-noise helper (value noise)
    function hash(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      return (
        hash(ix,   iy)   * (1-ux) * (1-uy) +
        hash(ix+1, iy)   * ux     * (1-uy) +
        hash(ix,   iy+1) * (1-ux) * uy     +
        hash(ix+1, iy+1) * ux     * uy
      );
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const step   = 36;         // grid spacing
      const scale  = 0.0035;     // noise zoom
      const speed  = 0.0004;     // animation pace

      ctx.lineWidth = 0.9;

      for (let x = 0; x <= W; x += step) {
        for (let y = 0; y <= H; y += step) {
          const n   = noise(x * scale + t, y * scale + t * 0.6);
          const ang = n * Math.PI * 4;
          const len = 14 + n * 12;

          const x2 = x + Math.cos(ang) * len;
          const y2 = y + Math.sin(ang) * len;

          // gradient: acid green → ember, based on position — darker,
          // more saturated values than the dark-theme original so the
          // lines still read on white at a moderate opacity.
          const mix = x / W;
          const r   = Math.round(70  + mix * 130);
          const g   = Math.round(110 - mix * 70);
          const b   = Math.round(50  - mix * 20);

          ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      t += speed;
      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    draw();
  </script>
</body>
</html>
